<style>
:root {
  --bg: #0A0F1C; --bg2: #0E1526; --card: #131B2E; --card2: #1A2439; --card3: #243050; --body: #2A3856; --body2: #1B2740;
  --ink: #F1F5FA; --ink2: #A0ACC2; --ink3: #64708A; --line: rgba(255,255,255,.075); --line2: rgba(255,255,255,.045);
  --acc: #22D3B5; --acc2: #7FF2DC; --acc-ink: #6EEBD0; --acc-soft: rgba(34,211,181,.13); --acc-glow: rgba(34,211,181,.32); --on-acc: #04201B;
  --xp: #A78BFA; --xp-soft: rgba(167,139,250,.14);
  --pr: #FF6B6B; --pr-soft: rgba(255,107,107,.14);
  --green: #4ADE80; --green-soft: rgba(74,222,128,.13);
  --red: #FF6B6B; --red-soft: rgba(255,107,107,.13);
  --blue: #60A5FA; --blue-soft: rgba(96,165,250,.13);
  --fb: 'Barlow', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --fd: 'Barlow Condensed', 'Barlow', system-ui, sans-serif;
  --fm: 'JetBrains Mono', ui-monospace, Menlo, monospace;
  --r: 18px; --rs: 12px; --tab-h: 66px; --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px);
  color-scheme: dark;
}
html[data-theme="light"] {
  --bg: #EEF2F6; --bg2: #E5EAF0; --card: #FFFFFF; --card2: #F3F6F9; --card3: #E3E9F0; --body: #C3CEDD; --body2: #AEBBCC;
  --ink: #0F172A; --ink2: #4B5A72; --ink3: #8A97AC; --line: rgba(15,23,42,.09); --line2: rgba(15,23,42,.05);
  --acc: #0FA98F; --acc2: #22D3B5; --acc-ink: #0B7A67; --acc-soft: rgba(15,169,143,.12); --acc-glow: rgba(15,169,143,.22); --on-acc: #FFFFFF;
  --xp: #7C5CE6; --xp-soft: rgba(124,92,230,.12); --pr: #E14B4B; --pr-soft: rgba(225,75,75,.12);
  --green: #1E8F5C; --green-soft: rgba(30,143,92,.12); --red: #D23F35; --red-soft: rgba(210,63,53,.12); --blue: #2E5BD6; --blue-soft: rgba(46,91,214,.12);
  color-scheme: light;
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; background: var(--bg); }
body { font-family: var(--fb); background: var(--bg); color: var(--ink); font-size: 16px; line-height: 1.45; min-height: 100vh; overscroll-behavior-y: none; }
body::before { content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0; background: radial-gradient(900px 420px at 50% -120px, var(--acc-glow), transparent 70%); opacity: .55; }
html[data-theme="light"] body::before { opacity: .35; }
button, input, select, textarea { font: inherit; color: inherit; }
button { background: none; border: 0; cursor: pointer; }
svg { display: block; }
.ic { width: 20px; height: 20px; flex: none; }
.ic-sm { width: 16px; height: 16px; }
.hid { display: none !important; }
a { color: var(--acc-ink); }

/* ── Shell ── */
#app { position: relative; z-index: 1; max-width: 520px; margin: 0 auto; min-height: 100vh; padding: var(--sat) 0 calc(var(--tab-h) + var(--sab) + 24px); }
.page { display: none; padding: 14px 16px 8px; animation: pin .2s ease-out; }
.page.on { display: block; }
@keyframes pin { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .page { animation: none; } * { transition: none !important; } }

.topbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 44px; margin-bottom: 10px; }
.topbar h1 { font-family: var(--fd); font-weight: 700; font-size: 32px; line-height: 1; letter-spacing: .01em; }
.topbar .sub { color: var(--ink2); font-size: 14px; margin-top: 3px; }
.back { display: inline-flex; align-items: center; gap: 2px; color: var(--ink2); font-weight: 500; font-size: 15px; padding: 6px 0; margin-left: -4px; }
.iconbtn { width: 40px; height: 40px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; color: var(--ink2); background: var(--card); border: 1px solid var(--line); }
.iconbtn:active { background: var(--card2); }

.tabbar { position: fixed; bottom: 0; left: 0; right: 0; z-index: 50; background: rgba(10,15,28,.86); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); border-top: 1px solid var(--line); padding-bottom: var(--sab); }
html[data-theme="light"] .tabbar { background: rgba(255,255,255,.86); }
.tabbar > div { max-width: 520px; margin: 0 auto; width: 100%; display: flex; height: var(--tab-h); }
.tab { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: var(--ink3); font-size: 11px; font-weight: 600; letter-spacing: .02em; position: relative; }
.tab.on { color: var(--acc); }
.tab.on::after { content: ''; position: absolute; top: 0; width: 22px; height: 2px; border-radius: 2px; background: var(--acc); }
.tab .ic { width: 22px; height: 22px; }

/* ── Type ── */
h2 { font-family: var(--fd); font-weight: 700; font-size: 24px; line-height: 1.05; letter-spacing: .01em; }
h3 { font-family: var(--fd); font-weight: 600; font-size: 19px; line-height: 1.15; }
.sec { margin: 24px 0 10px; display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.sec h2 { font-size: 21px; }
.sec .more { font-size: 14px; color: var(--acc-ink); font-weight: 600; }
.muted { color: var(--ink2); }
.muted2 { color: var(--ink3); }
.small { font-size: 13px; }
.num { font-family: var(--fd); font-weight: 700; font-variant-numeric: tabular-nums; }
p + p { margin-top: 8px; }

/* ── Cards ── */
.card { background: linear-gradient(165deg, rgba(255,255,255,.035), transparent 45%), var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 15px; }
.card + .card { margin-top: 10px; }
.card.tap { cursor: pointer; }
.card.tap:active { background: var(--card2); }
.row { display: flex; align-items: center; gap: 10px; }
.row.between { justify-content: space-between; }
.grow { flex: 1; min-width: 0; }
.list .card { border-radius: 0; border-width: 0 0 1px; background: transparent; padding: 12px 2px; margin: 0; }
.list .card:first-child { border-top-width: 1px; }
.stack > * + * { margin-top: 10px; }

/* ── Buttons ── */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: var(--rs); padding: 12px 16px; font-weight: 600; font-size: 15px; line-height: 1.2; border: 1px solid var(--line); background: var(--card2); color: var(--ink); min-height: 46px; }
.btn.p { background: linear-gradient(135deg, var(--acc2), var(--acc)); border-color: transparent; color: var(--on-acc); box-shadow: 0 6px 22px -8px var(--acc-glow); }
.btn.g { background: var(--green); border-color: transparent; color: #04170E; }
.btn.d { color: var(--red); border-color: transparent; background: var(--red-soft); }
.btn.w { width: 100%; }
.btn.sm { padding: 8px 12px; font-size: 13px; min-height: 36px; }
.btn.ghost { background: transparent; border-color: transparent; color: var(--acc-ink); }
.btn:active { filter: brightness(.92); transform: translateY(1px); }
.btn:disabled { opacity: .45; }
.btn.big { min-height: 56px; font-size: 17px; border-radius: 14px; }

/* ── Chips / pills ── */
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 4px 0 8px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1px solid var(--line); background: var(--card); color: var(--ink2); border-radius: 999px; padding: 7px 13px; font-size: 13px; font-weight: 600; white-space: nowrap; }
.chip.on { background: var(--acc); color: var(--on-acc); border-color: var(--acc); }
.pill { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .03em; padding: 3px 8px; border-radius: 999px; background: var(--card3); color: var(--ink2); border: 1px solid var(--line); vertical-align: middle; }
.pill.b { background: var(--acc-soft); color: var(--acc-ink); border-color: transparent; }
.pill.g { background: var(--green-soft); color: var(--green); border-color: transparent; }
.pill.r { background: var(--red-soft); color: var(--red); border-color: transparent; }
.pill.a { background: var(--blue-soft); color: var(--blue); border-color: transparent; }

/* ── Inputs ── */
.inp { width: 100%; background: var(--bg2); border: 1px solid var(--line); border-radius: var(--rs); padding: 11px 12px; font-size: 16px; outline: none; color: var(--ink); }
.inp::placeholder { color: var(--ink3); }
.inp:focus { border-color: var(--acc); }
input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
input[type=number] { -moz-appearance: textfield; appearance: textfield; }
label.lbl { display: block; font-size: 13px; font-weight: 600; color: var(--ink2); margin: 12px 0 6px; }
.seg { display: flex; border: 1px solid var(--line); border-radius: var(--rs); overflow: hidden; background: var(--card); }
.seg button { flex: 1; padding: 10px 6px; font-weight: 600; font-size: 14px; color: var(--ink2); border-left: 1px solid var(--line); }
.seg button:first-child { border-left: 0; }
.seg button.on { background: var(--acc); color: var(--on-acc); }

/* ── Nivel / XP ── */
.lvl { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 14px; background: var(--card); border: 1px solid var(--line); margin-bottom: 12px; }
.lvl .badge { width: 44px; height: 44px; border-radius: 12px; background: linear-gradient(135deg, #C4B5FD, var(--xp)); color: #1E1339; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: var(--fd); font-weight: 700; line-height: 1; flex: none; box-shadow: 0 4px 16px -6px rgba(167,139,250,.5); }
.lvl .badge small { font-size: 9px; font-weight: 700; letter-spacing: .06em; opacity: .8; }
.lvl .badge b { font-size: 22px; }
.lvl .t { font-weight: 600; font-size: 15px; }
.lvl .xp { font-size: 12px; color: var(--ink2); }
.lvl .bar { height: 5px; border-radius: 3px; background: var(--card3); margin-top: 6px; overflow: hidden; }
.lvl .bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--xp), #C4B5FD); border-radius: 3px; transition: width .6s ease; }
.flame { position: relative; width: 44px; height: 48px; flex: none; color: var(--pr); filter: drop-shadow(0 0 8px rgba(255,107,107,.45)); }
.flame svg { width: 100%; height: 100%; }
.flame b { position: absolute; left: 0; right: 0; top: 19px; text-align: center; font-family: var(--fd); font-weight: 700; font-size: 17px; color: #2A0A0A; }
.flame.off { color: var(--ink3); filter: none; }
.flame.off b { color: var(--card); }

/* ── Hoy: sesión ── */
.hero { position: relative; border-radius: 22px; padding: 1px; background: linear-gradient(160deg, var(--acc), rgba(34,211,181,.15) 35%, var(--line) 70%); box-shadow: 0 20px 50px -30px var(--acc-glow); }
.hero > div { background: linear-gradient(165deg, rgba(255,255,255,.04), transparent 40%), var(--card); border-radius: 21px; padding: 16px 16px 14px; }
.hero .eyebrow-m { padding-right: 84px; }
.hero .eyebrow { font-size: 13px; color: var(--acc-ink); font-weight: 600; letter-spacing: .01em; }
.hero h2 { font-size: 40px; margin: 2px 0 0; }
.hero .focus { color: var(--ink2); font-size: 14px; margin-top: 2px; }
.hero-ex { margin: 14px 0 12px; border-top: 1px solid var(--line2); }
.hero-ex .r { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line2); }
.hero-ex .r .mu { width: 32px; height: 32px; border-radius: 9px; background: var(--card3); flex: none; overflow: hidden; position: relative; display: flex; align-items: center; justify-content: center; font-family: var(--fd); font-weight: 700; font-size: 9px; color: var(--ink3); }
.hero-ex .r .mu img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.hero-ex .r .n { flex: 1; min-width: 0; font-weight: 500; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hero-ex .r .t { font-family: var(--fd); font-weight: 600; font-size: 17px; max-width: 58%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink); font-variant-numeric: tabular-nums; }
.hero-ex .r .t.up { color: var(--green); }
.hero-ex .r .t.first { color: var(--ink3); font-size: 13px; font-family: var(--fb); font-weight: 500; }
.hero.active { background: linear-gradient(160deg, var(--green), rgba(74,222,128,.15) 35%, var(--line) 70%); }

.weekbox { display: flex; align-items: center; gap: 14px; }
.ring { width: 66px; height: 66px; flex: none; position: relative; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .c1 { fill: none; stroke: var(--card3); stroke-width: 7; }
.ring .c2 { fill: none; stroke: var(--acc); stroke-width: 7; stroke-linecap: round; transition: stroke-dashoffset .6s ease; }
.ring .c2.done { stroke: var(--green); }
.ring .v { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: var(--fd); font-weight: 700; font-size: 20px; }
.days7 { display: flex; gap: 5px; margin-top: 8px; }
.days7 span { flex: 1; height: 7px; border-radius: 4px; background: var(--card3); }
.days7 span.y { background: var(--green); }
.days7 span.t { outline: 1.5px solid var(--acc); outline-offset: 1px; }

.stat3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stat3 .card { padding: 12px 10px; }
.stat3 .num { font-size: 30px; line-height: 1; color: var(--ink); }
.stat3 .lab { font-size: 12px; color: var(--ink2); margin-top: 4px; }
.nextach { display: flex; align-items: center; gap: 12px; }
.nextach .mini { height: 5px; border-radius: 3px; background: var(--card3); overflow: hidden; margin-top: 6px; }
.nextach .mini i { display: block; height: 100%; background: var(--acc); border-radius: 3px; }

/* ── Entreno activo ── */
.wo-head { position: sticky; top: 0; background: var(--bg); z-index: 5; padding: calc(var(--sat) + 8px) 0 8px; margin: calc(-1 * var(--sat) - 14px) 0 8px; }
.wo-prog { height: 4px; background: var(--card3); border-radius: 2px; overflow: hidden; margin-top: 8px; }
.wo-prog i { display: block; height: 100%; background: linear-gradient(90deg, var(--acc), var(--acc2)); transition: width .3s ease; }
.wex { background: linear-gradient(165deg, rgba(255,255,255,.03), transparent 40%), var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 12px 10px; margin-bottom: 10px; }
.wex.done { border-color: rgba(74,222,128,.35); }
.wex.cur { border-color: var(--acc); box-shadow: 0 0 0 3px var(--acc-soft); }
.wex-top { display: flex; align-items: flex-start; gap: 10px; }
.wex-top .mu { width: 40px; height: 40px; border-radius: 10px; background: var(--card3); flex: none; overflow: hidden; position: relative; display: flex; align-items: center; justify-content: center; font-family: var(--fd); font-weight: 700; font-size: 10px; color: var(--ink3); }
.wex-top .mu img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.wex-top .name { flex: 1; min-width: 0; font-weight: 600; font-size: 17px; line-height: 1.2; }
.wex-top .name small { display: block; font-weight: 500; color: var(--ink2); font-size: 13px; margin-top: 2px; }
.wex-top .acts { display: flex; gap: 0; flex: none; }
.wex-top .acts button { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--ink2); }
.wex-top .acts button:active { background: var(--card2); }
.target { margin: 10px 0 8px; padding: 10px 12px; border-radius: var(--rs); background: var(--bg2); border: 1px solid var(--line2); }
.target .big { font-family: var(--fd); font-weight: 700; font-size: 28px; line-height: 1; letter-spacing: .01em; color: var(--acc-ink); }
.target .big.up { color: var(--green); }
.target .why { font-size: 13px; color: var(--ink2); margin-top: 5px; line-height: 1.4; }
.target.first { background: var(--blue-soft); border-color: transparent; }
.target.first .big { font-size: 15px; font-family: var(--fb); font-weight: 500; line-height: 1.4; color: var(--ink); }
.target.deload { background: var(--acc-soft); border-color: transparent; }
.ramp { font-size: 13px; color: var(--ink2); margin: 0 0 8px; padding-left: 2px; }
.ramp b { color: var(--ink); font-weight: 600; }
.sets-h { display: grid; grid-template-columns: 30px 1fr 1fr 1fr 48px; gap: 6px; font-size: 11px; font-weight: 700; color: var(--ink3); letter-spacing: .04em; padding: 0 2px 4px; }
.set { display: grid; grid-template-columns: 30px 1fr 1fr 1fr 48px; gap: 6px; align-items: center; padding: 4px 0; }
.set .sn { font-family: var(--fd); font-weight: 600; font-size: 16px; color: var(--ink3); text-align: center; }
.set .prev { font-size: 13px; color: var(--ink3); text-align: center; font-variant-numeric: tabular-nums; }
.set .prev b { color: var(--ink2); font-weight: 600; }
.set input { width: 100%; text-align: center; padding: 10px 4px; font-family: var(--fd); font-weight: 600; font-size: 20px; border-radius: var(--rs); border: 1px solid var(--line); background: var(--bg2); outline: none; color: var(--ink); }
.set input::placeholder { color: var(--ink3); }
.set input:focus { border-color: var(--acc); }
.set.ok input { background: var(--green-soft); border-color: transparent; color: var(--green); }
.set .chk { width: 48px; height: 44px; border-radius: var(--rs); border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; color: var(--ink3); background: var(--card2); }
.set.ok .chk { background: var(--green); border-color: var(--green); color: #04170E; }
.set .fb { grid-column: 2 / 6; font-size: 12px; color: var(--green); font-weight: 600; padding-left: 2px; margin-top: -2px; }
.set .fb.r { color: var(--red); }
.wex-foot { display: flex; gap: 12px; margin-top: 8px; }
.wex-foot button { font-size: 13px; font-weight: 600; color: var(--acc-ink); padding: 6px 2px; }
.wex-foot button.m { color: var(--ink3); }
.wex-done { display: flex; align-items: center; gap: 10px; padding: 2px 0; }
.wex-done .tick { width: 26px; height: 26px; border-radius: 50%; background: var(--green); color: #04170E; display: flex; align-items: center; justify-content: center; flex: none; }
.wex-done .n { flex: 1; font-weight: 600; }
.wex-done .s { font-size: 13px; color: var(--ink2); font-variant-numeric: tabular-nums; }

.restbar { position: fixed; left: 0; right: 0; bottom: calc(var(--tab-h) + var(--sab)); z-index: 40; transform: translateY(calc(100% + 90px)); transition: transform .25s ease; visibility: hidden; pointer-events: none; }
.restbar.on { transform: none; visibility: visible; pointer-events: auto; }
.restbar > div { position: relative; max-width: 520px; margin: 0 auto; background: var(--card3); color: var(--ink); border: 1px solid var(--line); border-bottom: 0; border-radius: 18px 18px 0 0; padding: 14px 16px; display: flex; align-items: center; gap: 12px; overflow: hidden; box-shadow: 0 -10px 40px rgba(0,0,0,.4); }
.restbar .t { font-family: var(--fd); font-weight: 700; font-size: 36px; line-height: 1; min-width: 80px; font-variant-numeric: tabular-nums; color: var(--acc-ink); }
.restbar .l { flex: 1; font-size: 13px; color: var(--ink2); }
.restbar button { color: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; font-weight: 600; font-size: 13px; background: var(--card); }
.restbar .bar { position: absolute; left: 0; right: 0; top: 0; height: 3px; background: rgba(255,255,255,.08); }
.restbar .bar i { display: block; height: 100%; background: var(--acc); transition: width 1s linear; }
body.wo-on .tabbar { display: none; }
body.wo-on .restbar { bottom: 0; }
body.wo-on .restbar > div { padding-bottom: calc(14px + var(--sab)); }
body.wo-on #app { padding-bottom: calc(130px + var(--sab)); }

/* ── Bottom sheet ── */
.sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 80; display: none; }
.sheet-bg.on { display: block; }
.sheet { visibility: hidden; position: fixed; left: 0; right: 0; bottom: 0; z-index: 81; background: var(--card); border: 1px solid var(--line); border-bottom: 0; border-radius: 22px 22px 0 0; max-height: 88vh; overflow-y: auto; transform: translateY(100%); transition: transform .28s cubic-bezier(.32,.72,0,1); padding: 8px 16px calc(32px + var(--sab)); max-width: 520px; margin: 0 auto; }
.sheet.on { transform: none; visibility: visible; }
.sheet .grab { width: 40px; height: 4px; border-radius: 2px; background: var(--card3); margin: 4px auto 14px; }
.sheet h2 { font-size: 26px; }
.sheet .steps { counter-reset: st; margin: 6px 0 2px; }
.sheet .steps li { list-style: none; position: relative; padding: 7px 0 7px 32px; font-size: 15px; line-height: 1.45; border-bottom: 1px solid var(--line2); }
.sheet .steps li::before { counter-increment: st; content: counter(st); position: absolute; left: 0; top: 8px; width: 22px; height: 22px; border-radius: 50%; background: var(--acc-soft); color: var(--acc-ink); font-family: var(--fd); font-weight: 700; font-size: 14px; display: flex; align-items: center; justify-content: center; }
.sheet .bl { margin: 4px 0; }
.sheet .bl li { list-style: none; padding: 5px 0 5px 18px; position: relative; font-size: 15px; line-height: 1.45; }
.sheet .bl li::before { content: ''; position: absolute; left: 4px; top: 13px; width: 6px; height: 6px; border-radius: 50%; background: var(--ink3); }
.sheet .bl.err li::before { background: var(--red); }
.sheet .bl.cue li::before { background: var(--green); }
.sheet h3 { margin: 18px 0 4px; color: var(--acc-ink); }
.meta { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 4px; }
.ytlink { display: inline-flex; align-items: center; gap: 8px; margin-top: 14px; padding: 10px 14px; border-radius: var(--rs); border: 1px solid var(--line); background: var(--card2); font-weight: 600; font-size: 14px; color: var(--ink); text-decoration: none; }

/* ── Biblioteca ── */
.mugrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.mug { background: linear-gradient(165deg, rgba(255,255,255,.04), transparent 45%), var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px 10px 10px; text-align: center; cursor: pointer; }
.mug:active { background: var(--card2); }
.mug .im { width: 64px; height: 64px; margin: 0 auto 8px; border-radius: 14px; background: var(--card3); display: flex; align-items: center; justify-content: center; overflow: hidden; font-family: var(--fd); font-weight: 700; font-size: 14px; color: var(--ink2); position: relative; }
.mug .im img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.mug b { display: block; font-size: 14px; font-weight: 600; }
.mug span { font-size: 12px; color: var(--ink3); }
.exrow { display: flex; align-items: center; gap: 12px; padding: 11px 2px; border-bottom: 1px solid var(--line2); }
.exrow .mu { width: 44px; height: 44px; border-radius: 12px; background: var(--card3); border: 1px solid var(--line2); display: flex; align-items: center; justify-content: center; font-family: var(--fd); font-weight: 700; font-size: 11px; letter-spacing: .02em; color: var(--ink2); flex: none; text-transform: uppercase; overflow: hidden; position: relative; }
.exrow .mu img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.exrow .n { flex: 1; min-width: 0; }
.exrow .n b { display: block; font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.exrow .n span { font-size: 13px; color: var(--ink2); }
.exrow .best { font-family: var(--fd); font-weight: 600; font-size: 16px; color: var(--acc-ink); white-space: nowrap; }
.search { position: relative; margin-bottom: 10px; }
.search .inp { padding-left: 38px; }
.search .ic { position: absolute; left: 12px; top: 13px; color: var(--ink3); }

/* ── Programas ── */
.prog { background: linear-gradient(165deg, rgba(255,255,255,.04), transparent 45%), var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 15px; margin-bottom: 10px; }
.prog.on { border-color: var(--acc); box-shadow: 0 0 0 3px var(--acc-soft); }
.prog h3 { font-size: 22px; }
.prog .m { color: var(--ink2); font-size: 13px; margin: 2px 0 8px; }
.dayrow { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line2); }
.dayrow .d { font-family: var(--fd); font-weight: 700; font-size: 20px; width: 40px; color: var(--acc-ink); }
.dayrow .n { flex: 1; }
.dayrow .n small { display: block; color: var(--ink2); font-size: 13px; }
.ed-row { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--line2); }
.ed-row .n { flex: 1; min-width: 0; font-weight: 500; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ed-row input { width: 44px; text-align: center; padding: 6px 2px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg2); font-family: var(--fd); font-weight: 600; font-size: 16px; color: var(--ink); }
.ed-row .x { color: var(--ink3); padding: 4px; }
.cycle { display: grid; grid-template-columns: repeat(9, 1fr); gap: 4px; margin-top: 10px; }
.cycle span { height: 26px; border-radius: 6px; background: var(--card3); display: flex; align-items: center; justify-content: center; font-family: var(--fd); font-weight: 700; font-size: 13px; color: var(--ink3); }
.cycle span.b2 { background: var(--acc-soft); color: var(--acc-ink); }
.cycle span.dl { background: var(--blue-soft); color: var(--blue); }
.cycle span.cur { outline: 2px solid var(--acc); outline-offset: 1px; color: var(--ink); }

/* ── Progreso ── */
.chart { width: 100%; height: auto; display: block; }
.chart text { font-family: var(--fb); font-size: 10px; fill: var(--ink3); }
.chart .bar { fill: var(--acc); }
.chart .bar.ok { fill: var(--green); }
.chart .bar.cur { opacity: .55; }
.chart .goal { stroke: var(--ink3); stroke-dasharray: 3 3; }
.chart .ln { fill: none; stroke: var(--acc); stroke-width: 2.2; stroke-linejoin: round; }
.chart .dot { fill: var(--acc); }
.chart .dot.pr { fill: var(--green); }
.heat { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 1fr); gap: 3px; margin-top: 10px; }
.heat span { width: 100%; aspect-ratio: 1; border-radius: 3px; background: var(--card3); }
.heat span.y { background: var(--acc); }
.heat span.t { outline: 1.5px solid var(--ink2); outline-offset: 1px; }
.heat span.f { background: transparent; }
.donut { display: flex; align-items: center; gap: 14px; }
.donut svg { width: 120px; height: 120px; flex: none; }
.donut .lg { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 4px 10px; font-size: 13px; }
.donut .lg i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 6px; vertical-align: middle; }
.ach { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.ach .a { border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; background: var(--card); display: flex; gap: 10px; align-items: center; }
.ach .a .ico { width: 36px; height: 36px; border-radius: 10px; background: var(--card3); display: flex; align-items: center; justify-content: center; color: var(--ink3); flex: none; }
.ach .a.on .ico { background: linear-gradient(135deg, var(--acc2), var(--acc)); color: var(--on-acc); }
.ach .a.on { border-color: rgba(34,211,181,.4); }
.ach .a b { display: block; font-family: var(--fd); font-size: 16px; font-weight: 700; line-height: 1.1; }
.ach .a span { font-size: 11.5px; color: var(--ink2); line-height: 1.3; }
.ach .a:not(.on) { opacity: .5; }
.hist-row { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line2); font-size: 14px; }
.hist-row .d { color: var(--ink2); width: 92px; flex: none; }
.hist-row .s { flex: 1; font-family: var(--fd); font-weight: 600; font-size: 16px; font-variant-numeric: tabular-nums; }

/* ── Onboarding ── */
.ob { position: relative; z-index: 1; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; padding: calc(var(--sat) + 32px) 22px calc(var(--sab) + 40px); max-width: 520px; margin: 0 auto; }
.ob h1 { font-family: var(--fd); font-weight: 700; font-size: 46px; line-height: .95; letter-spacing: .01em; margin-bottom: 10px; }
.ob .lead { font-size: 17px; color: var(--ink2); margin-bottom: 20px; }
.opt { display: block; width: 100%; text-align: left; border: 1px solid var(--line); background: var(--card); border-radius: var(--r); padding: 14px 16px; margin-top: 10px; }
.opt.on { border-color: var(--acc); box-shadow: 0 0 0 3px var(--acc-soft); }
.opt b { display: block; font-size: 16px; font-weight: 600; }
.opt span { font-size: 13px; color: var(--ink2); }
.obdots { display: flex; gap: 6px; margin-bottom: 20px; }
.obdots i { width: 22px; height: 4px; border-radius: 2px; background: var(--card3); }
.obdots i.on { background: var(--acc); }
.logo { display: flex; align-items: center; gap: 10px; margin-bottom: 22px; }
.logo .lg { width: 40px; height: 40px; border-radius: 11px; background: linear-gradient(135deg, var(--acc2), var(--acc)); display: flex; align-items: center; justify-content: center; color: var(--on-acc); }
.logo b { font-family: var(--fd); font-size: 22px; font-weight: 700; letter-spacing: .02em; }
.logo small { display: block; font-size: 11px; color: var(--ink3); letter-spacing: .08em; text-transform: uppercase; font-weight: 600; }

/* ── Resumen ── */
.summary-hero { text-align: center; padding: 28px 12px 18px; }
.summary-hero .big { font-family: var(--fd); font-weight: 700; font-size: 64px; line-height: .95; color: var(--acc-ink); }
.summary-hero .lab { color: var(--ink2); font-size: 15px; margin-top: 6px; }
.win { display: flex; align-items: flex-start; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line2); }
.win .ic { color: var(--green); margin-top: 2px; }
.win.pr .ic { color: var(--pr); }
.win b { font-weight: 600; }
.win span { display: block; color: var(--ink2); font-size: 13px; }
.xpgain { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; border-radius: 14px; background: var(--xp-soft); border: 1px solid rgba(167,139,250,.3); margin-top: 10px; }
.xpgain b { font-family: var(--fd); font-size: 24px; color: #C4B5FD; }

/* ── Aprender ── */
.learn-card { display: flex; align-items: center; gap: 12px; padding: 13px 2px; border-bottom: 1px solid var(--line2); }
.learn-card .ico { width: 40px; height: 40px; border-radius: 12px; background: var(--card3); display: flex; align-items: center; justify-content: center; color: var(--acc-ink); flex: none; }
.learn-card .ico svg { width: 20px; height: 20px; }
.learn-card b { display: block; font-weight: 600; font-size: 15px; }
.learn-card span { font-size: 13px; color: var(--ink2); }
.art { font-size: 15.5px; line-height: 1.6; }
.art p { margin-bottom: 12px; }
.art h3, .art h4 { font-family: var(--fd); font-size: 21px; margin: 18px 0 8px; color: var(--acc-ink); }
.art ul, .art ol { margin: 0 0 12px 20px; }
.art li { margin-bottom: 4px; }
.art table { width: 100%; border-collapse: collapse; margin: 10px 0 14px; font-size: 14px; }
.art th, .art td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line2); }
.art th { font-weight: 600; color: var(--ink2); }
.art .gterm { text-decoration: underline dotted var(--acc); text-underline-offset: 3px; cursor: pointer; color: inherit; }
.art strong { font-weight: 600; }
.faq-q { padding: 12px 2px; border-bottom: 1px solid var(--line2); }
.faq-q b { display: flex; justify-content: space-between; gap: 8px; font-weight: 600; font-size: 15px; cursor: pointer; }
.faq-q p { display: none; margin-top: 8px; color: var(--ink2); font-size: 15px; line-height: 1.5; }
.faq-q.on p { display: block; }
.gloss-row { padding: 10px 2px; border-bottom: 1px solid var(--line2); }
.gloss-row b { font-weight: 600; }
.gloss-row p { font-size: 14px; color: var(--ink2); margin-top: 2px; }

/* ── Toast ── */
.toast { position: fixed; left: 50%; bottom: calc(var(--tab-h) + var(--sab) + 16px); transform: translateX(-50%) translateY(20px); background: var(--acc); color: var(--on-acc); padding: 10px 16px; border-radius: 999px; font-size: 14px; font-weight: 600; opacity: 0; transition: all .2s; z-index: 90; pointer-events: none; white-space: nowrap; max-width: 92vw; overflow: hidden; text-overflow: ellipsis; box-shadow: 0 8px 24px -8px var(--acc-glow); }
.toast.on { opacity: 1; transform: translateX(-50%); }
body.wo-on .toast { bottom: calc(115px + var(--sab)); }

.empty { text-align: center; color: var(--ink2); padding: 28px 16px; font-size: 15px; }
.empty b { display: block; color: var(--ink); font-family: var(--fd); font-size: 22px; margin-bottom: 4px; }
.confetti { position: fixed; inset: 0; pointer-events: none; z-index: 100; }

/* ── Detalles con alma ── */
.eyebrow-m, .lab-m { font-family: var(--fm); font-size: 10px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--ink3); }
.brand { display: flex; align-items: center; gap: 10px; }
.brand .t { font-family: var(--fd); font-size: 18px; font-weight: 700; letter-spacing: .06em; line-height: 1; }
.brand .t small { display: block; font-family: var(--fm); font-size: 9px; letter-spacing: .18em; color: var(--ink3); margin-top: 3px; }
.mfig { display: flex; align-items: center; justify-content: center; flex: none; }
.mfig svg { height: 100%; width: auto; }
.mfig.box { width: 46px; height: 46px; border-radius: 12px; background: var(--card3); overflow: hidden; }
.mfig.box svg { width: 100%; height: 100%; }
.eqg { width: 14px; height: 14px; display: inline-block; vertical-align: -2px; margin-right: 3px; color: var(--ink3); }
.eqg svg { width: 14px; height: 14px; }
.bbwrap { margin: 6px 0 10px; }
.bb { width: 100%; max-width: 300px; height: auto; display: block; margin: 0 auto; }
.bblbl { text-align: center; font-family: var(--fm); font-size: 11px; letter-spacing: .06em; color: var(--ink2); margin-top: 2px; }
.dbv { width: 120px; height: auto; display: block; margin: 0 auto; }
.stk { width: 64px; height: auto; display: block; }
.xpf { position: fixed; z-index: 95; pointer-events: none; font-family: var(--fd); font-weight: 700; font-size: 22px; color: #C4B5FD; text-shadow: 0 0 12px rgba(167,139,250,.7); animation: xpf 1.2s ease-out forwards; }
@keyframes xpf { 0% { opacity: 0; transform: translateY(0) scale(.8); } 20% { opacity: 1; transform: translateY(-8px) scale(1.1); } 100% { opacity: 0; transform: translateY(-46px) scale(1); } }
.set.ok .chk { animation: pop .35s cubic-bezier(.32,.72,0,1); }
@keyframes pop { 0% { transform: scale(.6); } 60% { transform: scale(1.15); } 100% { transform: scale(1); } }
.rring { width: 40px; height: 40px; flex: none; position: relative; }
.rring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.rring .a { fill: none; stroke: rgba(255,255,255,.1); stroke-width: 4; }
.rring .b { fill: none; stroke: var(--acc); stroke-width: 4; stroke-linecap: round; transition: stroke-dashoffset 1s linear; }
.splash { position: fixed; inset: 0; z-index: 999; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; animation: splashOut .5s ease 1.1s forwards; }
.splash .lg { width: 84px; height: 84px; animation: splashIn .7s cubic-bezier(.32,.72,0,1); filter: drop-shadow(0 12px 30px var(--acc-glow)); }
.splash .lg svg { width: 100%; height: 100%; }
.splash .t { font-family: var(--fd); font-size: 30px; font-weight: 700; letter-spacing: .1em; animation: splashIn .7s .15s cubic-bezier(.32,.72,0,1) both; }
.splash .s { font-family: var(--fm); font-size: 10px; letter-spacing: .3em; color: var(--ink3); animation: splashIn .7s .25s both; }
@keyframes splashIn { from { opacity: 0; transform: translateY(14px) scale(.9); } to { opacity: 1; transform: none; } }
@keyframes splashOut { to { opacity: 0; visibility: hidden; } }
.hero-fig { position: absolute; right: 8px; top: 34px; height: 118px; opacity: .95; }
.hero-fig svg { height: 100%; width: auto; }
.chart .area { fill: url(#areag); }
.pr-tag { display: inline-flex; align-items: center; gap: 4px; font-family: var(--fm); font-size: 10px; letter-spacing: .1em; color: var(--pr); }
.radar { width: 100%; max-width: 260px; margin: 0 auto; display: block; }
.radar .grid { fill: none; stroke: var(--line); }
.radar .ax { stroke: var(--line); }
.radar .poly { fill: rgba(34,211,181,.25); stroke: var(--acc); stroke-width: 2; stroke-linejoin: round; }
.radar text { font-family: var(--fm); font-size: 8.5px; fill: var(--ink2); letter-spacing: .06em; }
.bodyheat { display: flex; justify-content: center; gap: 24px; }
.bodyheat .mfig { height: 200px; }
.coach { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 14px; background: var(--card2); border: 1px solid var(--line); margin-top: 10px; font-size: 14px; line-height: 1.45; }
.coach .lg { width: 28px; height: 28px; flex: none; margin-top: 1px; }
.coach .lg svg { width: 100%; height: 100%; }
.ach .a.on .ico { background: linear-gradient(135deg, var(--acc2), var(--acc)); color: var(--on-acc); }
.tab.on { color: var(--acc); }
.sec .more, .btn.ghost, .wex-foot button, .art .gterm { color: var(--acc-ink); }
.summary-hero .big { color: var(--ink); }
.target .big { color: var(--acc-ink); }

/* ── Estado (ficha de personaje) ── */
.sw { position: relative; border: 1px solid var(--acc); border-radius: 14px; padding: 16px 16px 12px; background: linear-gradient(180deg, rgba(34,211,181,.08), transparent 60%), var(--card); box-shadow: 0 0 40px -12px var(--acc-glow), inset 0 1px 0 rgba(255,255,255,.05); overflow: hidden; }
.sw::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 1px; background: linear-gradient(90deg, transparent, var(--acc), transparent); }
.sw .c { position: absolute; width: 10px; height: 10px; border: 1.5px solid var(--acc); opacity: .8; }
.sw .c.tl { top: 6px; left: 6px; border-right: 0; border-bottom: 0; } .sw .c.tr { top: 6px; right: 6px; border-left: 0; border-bottom: 0; } .sw .c.bl { bottom: 6px; left: 6px; border-right: 0; border-top: 0; } .sw .c.br { bottom: 6px; right: 6px; border-left: 0; border-top: 0; }
.sw-head { display: flex; align-items: center; gap: 12px; }
.avatar { width: 50px; height: 50px; border-radius: 12px; background: var(--card3); border: 1px solid var(--acc); color: var(--acc-ink); display: flex; align-items: center; justify-content: center; font-family: var(--fm); font-weight: 600; font-size: 17px; flex: none; }
.sw-name { font-family: var(--fd); font-size: 24px; font-weight: 700; line-height: 1; }
.sw-title { font-family: var(--fm); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--acc-ink); display: inline-flex; align-items: center; gap: 2px; margin-top: 4px; padding: 0; }
.sw-rank { font-family: var(--fd); font-size: 52px; font-weight: 700; line-height: 1; text-align: center; text-shadow: 0 0 18px currentColor; flex: none; }
.sw-rank small { display: block; font-family: var(--fm); font-size: 9px; letter-spacing: .25em; color: var(--ink3); text-shadow: none; margin-bottom: 2px; }
.sw-grid { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 8px; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line2); }
.sw-v { font-family: var(--fd); font-size: 22px; font-weight: 700; line-height: 1; margin-top: 3px; }
.sw-v small { font-family: var(--fb); font-size: 11px; font-weight: 500; color: var(--ink2); }
.rankb { width: 34px; height: 34px; border-radius: 9px; border: 1px solid; display: flex; align-items: center; justify-content: center; font-family: var(--fd); font-size: 20px; font-weight: 700; flex: none; text-shadow: 0 0 10px currentColor; }
.srow { display: flex; gap: 12px; align-items: flex-start; padding: 9px 0; border-top: 1px solid var(--line2); }

.sico { width: 34px; height: 34px; border-radius: 9px; border: 1px solid var(--line); background: var(--bg2); display: flex; align-items: center; justify-content: center; color: var(--ink2); flex: none; margin-top: 2px; }
.sico svg { width: 18px; height: 18px; }
.sname { font-family: var(--fm); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; font-weight: 600; }
.sletter { font-family: var(--fd); font-size: 20px; font-weight: 700; line-height: 1; text-shadow: 0 0 10px currentColor; }
.sletter small { font-family: var(--fm); font-size: 10px; color: var(--ink3); text-shadow: none; font-weight: 500; }
.sbar { height: 5px; border-radius: 3px; background: var(--card3); overflow: hidden; margin-top: 6px; }
.sbar i { display: block; height: 100%; background: var(--acc); border-radius: 3px; transition: width .8s cubic-bezier(.32,.72,0,1); position: relative; }
.sbar i::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255,255,255,.25), transparent); animation: shimmer 2.6s ease-in-out infinite; }
@keyframes shimmer { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }
.ssub { font-family: var(--fm); font-size: 10px; color: var(--ink3); margin-top: 4px; letter-spacing: .03em; }
.lrow { display: flex; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line2); cursor: pointer; }
.lrow:first-of-type { border-top: 0; }
.lletter { width: 40px; height: 40px; border-radius: 10px; border: 1px solid; display: flex; align-items: center; justify-content: center; font-family: var(--fd); font-size: 24px; font-weight: 700; flex: none; text-shadow: 0 0 10px currentColor; }
.mrow { display: flex; gap: 10px; align-items: flex-start; padding: 9px 0; border-top: 1px solid var(--line2); }
.mrow:first-of-type { border-top: 0; }
.mrow.mini { padding: 6px 0; }
.mchk { width: 22px; height: 22px; border-radius: 6px; border: 1.5px solid var(--ink3); flex: none; margin-top: 2px; display: flex; align-items: center; justify-content: center; color: #04170E; }
.mchk svg { width: 14px; height: 14px; }
.mrow.done .mchk { background: var(--green); border-color: var(--green); }
.mrow.done .mname { color: var(--ink2); text-decoration: line-through; }
.mrow.done .sbar i { background: var(--green); }
.mname { font-weight: 600; font-size: 14px; }
.mxp { font-family: var(--fd); font-size: 16px; font-weight: 700; color: #C4B5FD; white-space: nowrap; }
.tgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.trophy { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 6px 10px; text-align: center; cursor: pointer; }
.trophy.on { border-color: var(--acc); background: linear-gradient(180deg, var(--acc-soft), transparent 70%), var(--card); box-shadow: inset 0 0 14px rgba(34,211,181,.08); }
.trophy:not(.on) { opacity: .5; }
.tico { width: 40px; height: 40px; margin: 0 auto 6px; border-radius: 10px; background: var(--card3); display: flex; align-items: center; justify-content: center; color: var(--ink3); }
.tico svg { width: 20px; height: 20px; }
.trophy.on .tico, .tico.on { background: linear-gradient(135deg, var(--acc2), var(--acc)); color: var(--on-acc); box-shadow: 0 4px 14px -4px var(--acc-glow); }
.tico.big { width: 64px; height: 64px; border-radius: 16px; }
.tico.big svg { width: 30px; height: 30px; }
.tname { font-family: var(--fm); font-size: 9px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink2); line-height: 1.25; }
.trophy.on .tname { color: var(--ink); }
.tbar { height: 3px; border-radius: 2px; background: var(--card3); margin-top: 6px; overflow: hidden; }
.tbar i { display: block; height: 100%; background: var(--acc); }
.cine { position: fixed; inset: 0; z-index: 400; display: flex; align-items: center; justify-content: center; animation: pin .3s ease; }
.cine-bg { position: absolute; inset: 0; background: rgba(6,9,18,.92); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.cine-rays { position: absolute; inset: -40%; background: conic-gradient(from 0deg, transparent 0 20deg, var(--cc) 22deg, transparent 26deg 60deg, var(--cc) 62deg, transparent 66deg 110deg, var(--cc) 112deg, transparent 116deg 170deg, var(--cc) 172deg, transparent 176deg 230deg, var(--cc) 232deg, transparent 236deg 290deg, var(--cc) 292deg, transparent 296deg 360deg); opacity: .12; animation: rays 24s linear infinite; }
@keyframes rays { to { transform: rotate(360deg); } }
.cine-box { position: relative; text-align: center; padding: 34px 28px; max-width: 340px; width: 88vw; border: 1px solid var(--line); border-radius: 18px; background: var(--card); box-shadow: 0 0 80px -20px var(--acc-glow); animation: cineIn .8s cubic-bezier(.2,.8,.2,1) both; }
@keyframes cineIn { 0% { opacity: 0; transform: scale(.85); } 100% { opacity: 1; transform: none; } }
.cine-tag { font-family: var(--fm); font-size: 11px; letter-spacing: .4em; text-transform: uppercase; color: var(--ink2); margin-bottom: 14px; animation: tagIn 1s ease both; }
@keyframes tagIn { 0% { opacity: 0; letter-spacing: 1em; } 100% { opacity: 1; letter-spacing: .4em; } }
.cine-big { font-family: var(--fd); font-size: 110px; font-weight: 700; line-height: 1; text-shadow: 0 0 30px currentColor; animation: bigIn 1.2s .3s cubic-bezier(.2,.8,.2,1) both; }
.cine.trophy .cine-big { font-size: 34px; }
.cine.mission .cine-big { font-size: 56px; }
@keyframes bigIn { 0% { opacity: 0; transform: scale(.4); filter: blur(16px); } 60% { opacity: 1; transform: scale(1.12); filter: blur(0); } 100% { transform: scale(1); } }
.cine-ico { width: 72px; height: 72px; margin: 0 auto 12px; border-radius: 18px; background: var(--card3); display: flex; align-items: center; justify-content: center; box-shadow: 0 0 30px -6px currentColor; animation: bigIn 1s .2s both; }
.cine-ico svg { width: 34px; height: 34px; }
.cine-lbl { font-family: var(--fd); font-size: 20px; font-weight: 600; letter-spacing: .04em; margin-top: 10px; animation: pin .8s 1s both; }
.cine-sub { font-size: 13px; color: var(--ink2); margin-top: 6px; animation: pin .8s 1.2s both; }

<script>
// ═══ BIBLIOTECA DE EJERCICIOS ═══
// m: músculo principal · m2: secundarios · eq: barra|mancuernas|maquina|polea|cuerpo|banda
// pat: patrón de movimiento · lvl: 1 fácil de aprender, 2 requiere práctica, 3 técnico
// reps: rango por defecto · inc: cuánto subir cuando llegás al tope del rango · rest: segundos
// mode: w (peso+reps) | bw (solo reps) | time (segundos) · unil: se hace por lado
const EX = [
  // ─── PECHO ───
  { id:'bench', name:'Press de banca con barra', m:'pecho', m2:['triceps','hombros'], eq:'barra', pat:'empuje-h', lvl:2, loc:'gym', reps:[6,10], inc:2.5, rest:150, mode:'w',
    setup:['Acostate con los ojos justo debajo de la barra. Pies firmes en el piso, apoyados completos.','Agarre un poco más ancho que los hombros: cuando la barra toca el pecho, los antebrazos quedan verticales.','Juntá y bajá los omóplatos, sacá pecho. Esa posición no se pierde en ningún momento de la serie.'],
    go:['Sacá la barra del rack y frenala encima de los hombros con los brazos estirados.','Inspirá y bajá la barra controlada hasta tocar la parte baja del pecho. Codos a unos 45° del torso, no pegados ni abiertos en cruz.','Empujá fuerte hacia arriba y un poco hacia atrás, soltando el aire al pasar el punto más difícil.','Frená arriba con los brazos estirados y repetí. Últimas 2 reps difíciles, no imposibles.'],
    cues:['Empujá el piso con los pies mientras empujás la barra.','Doblá la barra como si quisieras partirla al medio: activa los dorsales y estabiliza.'],
    errs:['Rebotar la barra en el pecho. Perdés control y tensión.','Levantar la cola del banco. Los glúteos quedan apoyados siempre.','Muñecas dobladas hacia atrás: la barra va sobre la base de la palma, en línea con el antebrazo.'],
    why:'El press horizontal más eficiente para cargar el pecho con peso alto. Es la base para que crezcan pecho y tríceps.',
    swaps:['db-bench','machine-press','pushup'], yt:'press de banca técnica principiante' },
  { id:'db-bench', name:'Press de banca con mancuernas', m:'pecho', m2:['triceps','hombros'], eq:'mancuernas', pat:'empuje-h', lvl:1, loc:'ambos', reps:[8,12], inc:2, rest:120, mode:'w',
    setup:['Sentate en la punta del banco con las mancuernas apoyadas en los muslos.','Acostate en un movimiento llevando las mancuernas con las rodillas hasta la altura del pecho.','Pies firmes, omóplatos juntos y bajos, pecho arriba.'],
    go:['Empujá las mancuernas hacia arriba hasta estirar casi del todo los brazos, sin chocarlas.','Bajá controlado en 2 segundos hasta que las mancuernas queden a la altura del pecho y sientas el estiramiento.','Codos a unos 45° del cuerpo. Las muñecas rectas, encima de los codos.','Al terminar, apoyá las mancuernas en los muslos y sentate. No las tires al piso.'],
    cues:['Abrazá un tronco al subir: los codos se acercan levemente entre sí.','Sentí que el pecho se estira abajo antes de empujar.'],
    errs:['Bajar poco por miedo. El rango completo es lo que construye músculo.','Codos abiertos a 90° en cruz: castiga el hombro sin ganancia.'],
    why:'Ideal para empezar: cada brazo trabaja por su cuenta, el hombro se mueve libre y es más fácil de aprender que la barra.',
    swaps:['bench','machine-press','incline-db'], yt:'press banca mancuernas técnica' },
  { id:'incline-db', name:'Press inclinado con mancuernas', m:'pecho', m2:['hombros','triceps'], eq:'mancuernas', pat:'empuje-h', lvl:1, loc:'ambos', reps:[8,12], inc:2, rest:120, mode:'w',
    setup:['Banco a 30° (uno o dos clics desde plano). Más inclinado ya es press de hombro.','Subí las mancuernas con las rodillas hasta el pecho.','Omóplatos juntos y bajos, espalda apoyada, pies firmes.'],
    go:['Empujá hacia arriba y un poco hacia adentro hasta estirar los brazos.','Bajá controlado hasta que las mancuernas queden a la altura de las clavículas y sientas estirar la parte alta del pecho.','Codos a 45°, muñecas rectas.'],
    cues:['Empujá el techo con los pulgares.','Pensá en apretar el pecho arriba, no en llevar las manos lejos.'],
    errs:['Inclinar el banco a 45° o más: el hombro delantero se roba el ejercicio.','Chocar las mancuernas arriba y perder tensión.'],
    why:'La parte alta del pecho es la que más se nota y más se descuida. Los 30° la cargan sin castigar el hombro.',
    swaps:['incline-bench','db-bench','machine-press'], yt:'press inclinado mancuernas 30 grados' },
  { id:'incline-bench', name:'Press inclinado con barra', m:'pecho', m2:['hombros','triceps'], eq:'barra', pat:'empuje-h', lvl:2, loc:'gym', reps:[6,10], inc:2.5, rest:150, mode:'w',
    setup:['Banco a 30°. Ojos debajo de la barra, pies firmes.','Agarre un poco más ancho que los hombros.','Omóplatos juntos y bajos antes de sacar la barra.'],
    go:['Bajá la barra hasta la parte alta del pecho, justo debajo de las clavículas.','Empujá hacia arriba hasta estirar los brazos. La barra sube casi vertical.','Codos a 45°, no pegados al cuerpo.'],
    cues:['Apuntá la barra a las clavículas al bajar.','Pecho arriba durante toda la serie.'],
    errs:['Bajar la barra al medio del pecho como en banca plana: los codos se abren y el hombro sufre.','Usar demasiado peso y acortar el recorrido.'],
    why:'Versión con barra del inclinado: permite cargar más y progresar de a 2,5 kg.',
    swaps:['incline-db','bench','machine-press'], yt:'press inclinado barra técnica' },
  { id:'machine-press', name:'Press de pecho en máquina', m:'pecho', m2:['triceps','hombros'], eq:'maquina', pat:'empuje-h', lvl:1, loc:'gym', reps:[8,12], inc:5, rest:90, mode:'w',
    setup:['Ajustá el asiento para que las manijas queden a la altura del medio del pecho.','Espalda apoyada, omóplatos juntos, pies en el piso.'],
    go:['Empujá las manijas hasta casi estirar los brazos.','Volvé lento (2 segundos) hasta sentir que el pecho se estira, sin que el peso toque la pila.'],
    cues:['Empujá con las palmas, no con los dedos.','No despegues la espalda del respaldo.'],

    why:'La máquina guía el movimiento: perfecta para aprender a sentir el pecho y para las últimas series cuando ya estás cansado.',
    swaps:['db-bench','bench','pushup'], yt:'press pecho máquina técnica' },
  { id:'pec-deck', name:'Aperturas en máquina (pec deck)', m:'pecho', m2:[], eq:'maquina', pat:'aisl', lvl:1, loc:'gym', reps:[10,15], inc:5, rest:60, mode:'w',
    setup:['Asiento a una altura en la que las manijas queden a la altura del pecho.','Codos apenas flexionados y fijos en esa posición.'],
    go:['Juntá las manijas al frente apretando el pecho un segundo.','Abrí lento hasta sentir el estiramiento, sin dejar que el peso te tire los hombros hacia atrás.'],
    cues:['Los codos se mueven, no las manos: pensá en juntar los codos.','Pecho arriba, hombros abajo.'],
    errs:['Abrir demasiado y forzar el hombro.','Usar impulso con el torso.'],
    why:'Aísla el pecho sin involucrar tríceps. Va bien después de los presses para sumar volumen con poco riesgo.',
    swaps:['cable-fly','db-bench'], yt:'pec deck técnica' },
  { id:'cable-fly', name:'Aperturas en polea', m:'pecho', m2:['hombros'], eq:'polea', pat:'aisl', lvl:2, loc:'gym', reps:[10,15], inc:2.5, rest:60, mode:'w',
    setup:['Poleas a la altura del pecho o un poco más arriba. Un pie adelante para estabilidad.','Codos un poco flexionados y fijos durante toda la serie.'],
    go:['Llevá las manos al frente en un arco amplio hasta que se junten, apretando el pecho.','Volvé controlado hasta sentir estirar el pecho, con las manos a la altura de los hombros.'],
    cues:['Pensá en abrazar a alguien enorme.','Las manos terminan un poco por debajo de la línea del pecho.'],
    errs:['Doblar y estirar los codos: eso lo convierte en un press.','Inclinar el torso hacia adelante para mover más peso.'],
    why:'Tensión continua en el pecho durante todo el recorrido, algo que los presses no dan.',
    swaps:['pec-deck','db-bench'], yt:'aperturas polea pecho técnica' },
  { id:'dips', name:'Fondos en paralelas', m:'pecho', m2:['triceps','hombros'], eq:'cuerpo', pat:'empuje-h', lvl:2, loc:'gym', reps:[6,12], inc:2.5, rest:120, mode:'bwplus',
    setup:['Agarre firme en las paralelas, brazos estirados, hombros lejos de las orejas.','Incliná el torso levemente hacia adelante y cruzá los pies atrás.'],
    go:['Bajá flexionando los codos hasta que el brazo quede paralelo al piso (codo a 90°).','Empujá hacia arriba hasta estirar los brazos, sin encoger los hombros.','Cuando hagas 12 reps limpias, agregá peso con un cinturón o una mancuerna entre los pies.'],
    cues:['Mirá el piso adelante tuyo, no hacia arriba.','Codos hacia atrás, no hacia afuera.'],
    errs:['Bajar demasiado y sentir tirón en el hombro: el codo a 90° alcanza.','Hacer medias reps arriba.'],
    why:'Uno de los mejores ejercicios de empuje con peso corporal. Cuando tengas fuerza suficiente, es un básico para pecho y tríceps.',
    swaps:['bench-dip','machine-press','pushup'], yt:'fondos paralelas técnica pecho' },
  { id:'pushup', name:'Flexiones de brazos', m:'pecho', m2:['triceps','hombros','core'], eq:'cuerpo', pat:'empuje-h', lvl:1, loc:'ambos', reps:[8,20], inc:0, rest:90, mode:'bw',
    setup:['Manos un poco más anchas que los hombros, dedos apuntando adelante.','Cuerpo en línea recta de cabeza a talones. Glúteos y abdomen apretados.'],
    go:['Bajá hasta que el pecho quede a un puño del piso. Codos a 45° del torso.','Empujá el piso hasta estirar los brazos sin que se te caiga la cadera.','Si no llegás a 8 reps, hacelas con las manos apoyadas en un banco. Si pasás 20, poné una mochila con peso.'],
    cues:['Empujá el piso lejos de vos.','Un tronco rígido: si se mueve la cadera, se mueve todo.'],
    errs:['Cadera caída o levantada.','Codos abiertos en cruz.','Media flexión: bajá hasta cerca del piso.'],
    why:'Sin equipamiento, para casa o como remate. Escalable de fácil a muy difícil.',
    swaps:['incline-pushup','db-bench','machine-press'], yt:'flexiones técnica correcta' },
  { id:'incline-pushup', name:'Flexiones inclinadas (manos en banco)', m:'pecho', m2:['triceps','hombros'], eq:'cuerpo', pat:'empuje-h', lvl:1, loc:'ambos', reps:[8,20], inc:0, rest:60, mode:'bw',
    setup:['Manos apoyadas en un banco, mesa o barra a la altura de la cadera.','Cuerpo en línea recta, pies juntos.'],
    go:['Bajá el pecho hasta tocar el apoyo con los codos a 45°.','Empujá hasta estirar los brazos.','Cuanto más bajo el apoyo, más difícil. Bajalo cuando pases las 20 reps.'],
    cues:['Mismas reglas que una flexión normal, solo cambia el ángulo.'],
    errs:['Doblar la cadera hacia arriba.','Hombros subidos hacia las orejas.'],
    why:'La versión fácil de la flexión: para aprender el patrón antes de ir al piso.',
    swaps:['pushup','machine-press'], yt:'flexiones inclinadas principiantes' },

// Múltiplos del peso corporal para el 1RM estimado. Aproximados, orientativos (tablas tipo Strength Level, hombres).
const STANDARDS = {
  squat: { name: 'Sentadilla', tiers: [0.75, 1.0, 1.5, 2.0, 2.5] },
  bench: { name: 'Press de banca', tiers: [0.5, 0.75, 1.25, 1.5, 1.75] },

};
function bwNow() { if (BW.length) { const l = BW.slice().sort((a, b) => a.d < b.d ? -1 : 1)[BW.length - 1]; return { w: l.w, est: false }; } return { w: 75, est: true }; }
function liftRanks() {
  const bw = bwNow().w; const out = [];
  Object.keys(STANDARDS).forEach(id => {
    const st = STANDARDS[id]; const b = bestOf(id); if (!b) return;
    const load = st.bwLoad ? bw + b.w : b.w; const e1 = e1rm(load, b.r); const ratio = e1 / bw;
    let idx = 0; st.tiers.forEach(t => { if (ratio >= t) idx++; });
    const lo = idx === 0 ? 0 : st.tiers[idx - 1], hi = idx < 5 ? st.tiers[idx] : st.tiers[4] * 1.2;
    const frac = Math.min(1, Math.max(0, (ratio - lo) / (hi - lo)));
    const score = Math.min(100, (idx + frac) * 20);
    out.push({ id, name: st.name, e1: Math.round(e1), ratio, idx, letter: TIER_LETTER[idx], tier: idx === 0 ? 'Debajo de principiante' : TIER_NAMES[idx - 1], next: idx < 5 ? { name: TIER_NAMES[idx], kg: Math.max(0, Math.round(st.tiers[idx] * bw - e1)) } : null, score, best: b });
  });

}
function weekSlice(n) { let ws = weekStart(today()); const arr = []; for (let i = 0; i < n; i++) { arr.push(ws); ws = addDays(ws, -7); } return arr; }
function statsCalc() {
  const lifts = liftRanks();
  const fuerza = lifts.length ? lifts.reduce((a, l) => a + l.score, 0) / lifts.length : 0;
  let done = 0; weekSlice(8).forEach((ws, i) => { const n = sessionsInWeek(ws).length; done += i === 0 ? Math.min(S.goal, n) : Math.min(S.goal, n); });
  const constancia = Math.min(100, 100 * done / (S.goal * 8));
  const w4 = weekSlice(4); const ton = w4.reduce((a, ws) => a + sessionsInWeek(ws).reduce((b, s) => b + s.ton, 0), 0) / 4;
  const volumen = Math.min(100, 100 * Math.log10(1 + ton / 1000) / Math.log10(41));
  const recent = SESSIONS.filter(s => s.date >= addDays(today(), -28)); const wins = recent.reduce((a, s) => a + (s.ups || []).length + (s.prs || []).length, 0);
  const progresion = recent.length ? Math.min(100, 40 * wins / recent.length) : 0;
  const cnt = muscleCounts(28); const groups = [['pecho'], ['espalda'], ['hombros'], ['biceps', 'triceps', 'antebrazos'], ['cuadriceps', 'isquios', 'gluteos', 'gemelos'], ['core']].map(g => g.reduce((a, m) => a + (cnt[m] || 0), 0));
  const mean = groups.reduce((a, b) => a + b, 0) / 6; const sd = Math.sqrt(groups.reduce((a, v) => a + (v - mean) ** 2, 0) / 6);

    { id: 'fuerza', name: 'Fuerza', v: fuerza, ico: 'weight', sub: lifts.length ? lifts.length + ' levantamientos evaluados' : 'Hacé sentadilla, banca o dominadas para medirla' },
    { id: 'constancia', name: 'Constancia', v: constancia, ico: 'cal', sub: Math.round(done) + ' de ' + S.goal * 8 + ' sesiones en 8 semanas' },
    { id: 'volumen', name: 'Volumen', v: volumen, ico: 'dumbbell', sub: fmtK(ton) + ' por semana (promedio 4 sem.)' },
    { id: 'progresion', name: 'Progresión', v: progresion, ico: 'up', sub: wins + ' subidas y récords en 4 semanas' },
    { id: 'equilibrio', name: 'Equilibrio', v: equilibrio, ico: 'cycle', sub: mean ? 'Reparto entre grupos musculares' : 'Sin datos todavía' },
    { id: 'experiencia', name: 'Experiencia', v: experiencia, ico: 'flame', sub: SESSIONS.length + ' sesiones registradas' }
  ];

}

function weekData(ws) {

function weekMissions(ws) {

  html += '<div class="card" style="margin-top:12px"><div class="lab-m" style="margin-bottom:8px">▸ Atributos</div>' + sc.stats.map(st => { const r = rankOf(st.v); return '<div class="srow"><div class="sico">' + ico(st.ico) + '</div><div class="grow"><div class="row between"><div class="sname">' + st.name + '</div><div class="sletter" style="color:' + RANK_COL[r] + '">' + r + ' <small>' + Math.round(st.v) + '</small></div></div><div class="sbar"><i style="width:' + Math.round(st.v) + '%;background:' + RANK_COL[r] + '"></i></div><div class="ssub">' + esc(st.sub) + '</div></div></div>'; }).join('') + '</div>';
  // rangos de fuerza
  html += '<div class="card" style="margin-top:10px"><div class="row between"><div class="lab-m">▸ Rangos de fuerza</div>' + (bw.est ? '<button class="btn sm" onclick="bwSheet()">Anotar peso</button>' : '<span class="small muted2">1RM estimado ÷ peso corporal</span>') + '</div>';
  if (!sc.lifts.length) html += '<div class="empty" style="padding:16px"><b>Sin levantamientos evaluados</b>Sentadilla, banca, peso muerto, press militar, remo con barra y dominadas tienen rangos.</div>';
  else html += sc.lifts.map(l => '<div class="lrow" onclick="go(\'ejercicio\',{id:\'' + l.id + '\'})"><div class="lletter" style="color:' + RANK_COL[l.letter] + ';border-color:' + RANK_COL[l.letter] + '">' + l.letter + '</div><div class="grow"><div class="row between"><b>' + esc(l.name) + '</b><span class="num" style="font-size:17px">' + l.e1 + ' kg</span></div><div class="small muted">' + esc(l.tier) + ' · ' + l.ratio.toFixed(2) + '× tu peso' + (l.next ? ' · faltan ' + l.next.kg + ' kg para ' + l.next.name : ' · nivel máximo') + '</div><div class="sbar" style="margin-top:5px"><i style="width:' + Math.round(l.score) + '%;background:' + RANK_COL[l.letter] + '"></i></div></div></div>').join('');
  if (bw.est && sc.lifts.length) html += '<div class="small muted2" style="margin-top:8px">Calculado con 75 kg de peso corporal. Anotá el tuyo para que sea exacto.</div>';
  html += '</div>';
  // misiones
  const ms = weekMissions(); const mdone = ms.filter(m => m.done).length;
  html += '<div class="card" style="margin-top:10px"><div class="row between"><div class="lab-m">▸ Misiones de la semana</div><span class="pill ' + (mdone === 3 ? 'g' : '') + '">' + mdone + '/3</span></div>' + ms.map(m => '<div class="mrow ' + (m.done ? 'done' : '') + '"><div class="mchk">' + (m.done ? I.check : '') + '</div><div class="grow"><div class="row between"><div class="mname">' + esc(m.name) + '</div><div class="mxp">+' + m.xp + ' XP</div></div><div class="sbar"><i style="width:' + Math.round(m.pct * 100) + '%"></i></div><div class="ssub">' + (m.k ? fmtK(m.v) + ' / ' + fmtK(m.t) : Math.min(m.v, m.t) + ' / ' + m.t) + '</div></div></div>').join('') + '<div class="small muted2" style="margin-top:6px">Se renuevan cada lunes. El XP se acredita solo al completarlas.</div></div>';
  // trofeos
  const got = load('gb2_ach', []); const t = totals();
  html += '<div class="sec"><h2>Trofeos</h2><span class="small muted">' + got.length + '/' + ACHIEVEMENTS.length + '</span></div>';
  const cats = [['constancia', 'Constancia'], ['fuerza', 'Fuerza'], ['volumen', 'Volumen'], ['hitos', 'Hitos'], ['especial', 'Especiales']];
  cats.forEach(([c, n]) => { const list = ACHIEVEMENTS.filter(a => a.cat === c); if (!list.length) return; html += '<div class="lab-m" style="margin:12px 0 6px">' + n + ' · ' + list.filter(a => got.includes(a.id)).length + '/' + list.length + '</div><div class="tgrid">' + list.map(a => { const on = got.includes(a.id); const p = a.prog ? a.prog(t) : null; return '<div class="trophy ' + (on ? 'on' : '') + '" onclick="trophySheet(\'' + a.id + '\')"><div class="tico">' + ico(a.ico) + '</div><div class="tname">' + esc(a.name) + '</div>' + (!on && p ? '<div class="tbar"><i style="width:' + Math.round(100 * Math.min(1, p[0] / p[1])) + '%"></i></div>' : '') + '</div>'; }).join('') + '</div>'; });
  el.innerHTML = html;
}
function trophySheet(id) {

}
