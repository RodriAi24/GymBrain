<style>
:root {
  --bg: #0C0B0A; --bg2: #12100E; --card: #161412; --card2: #1E1B18; --card3: #2A2622; --body: #3A3530; --body2: #24201C;
  --ink: #F4EEE6; --ink2: #A69D92; --ink3: #6E665D; --ink4: #4A443E; --line: rgba(255,236,214,.09); --line2: rgba(255,236,214,.06);
  --acc: #FF5420; --acc2: #FF7A4A; --acc-ink: #FF6A35; --acc-soft: rgba(255,84,32,.12); --acc-glow: rgba(255,84,32,.32); --on-acc: #140600;
  --xp: #FFB224; --xp-soft: rgba(255,178,36,.14);
  --pr: #FFB224; --pr-soft: rgba(255,178,36,.14);
  --green: #FF7A3D; --green-soft: rgba(255,122,61,.13);
  --red: #FF4A4A; --red-soft: rgba(255,74,74,.13);
  --blue: #8FB4D9; --blue-soft: rgba(143,180,217,.11);
  --fb: 'Archivo', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --fd: 'Anton', 'Archivo', system-ui, sans-serif;
  --fm: 'JetBrains Mono', ui-monospace, Menlo, monospace;
  --r: 20px; --rs: 12px; --tab-h: 66px; --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px);
  color-scheme: dark;
}
html[data-theme="light"] {
  --bg: #EEF2F6; --bg2: #E5EAF0; --card: #FFFFFF; --card2: #F3F6F9; --card3: #E3E9F0; --body: #C3CEDD; --body2: #AEBBCC;
  --ink: #0F172A; --ink2: #4B5A72; --ink3: #8A97AC; --line: rgba(15,23,42,.09); --line2: rgba(15,23,42,.05);
  --acc: #E8460F; --acc2: #FF6A35; --acc-ink: #C23A0B; --acc-soft: rgba(232,70,15,.12); --acc-glow: rgba(232,70,15,.22); --on-acc: #FFFFFF;
  --xp: #C98500; --xp-soft: rgba(201,133,0,.12); --pr: #C98500; --pr-soft: rgba(201,133,0,.12);
  --green: #D9520F; --green-soft: rgba(217,82,15,.12); --red: #D23F35; --red-soft: rgba(210,63,53,.12); --blue: #2E5BD6; --blue-soft: rgba(46,91,214,.12);
  color-scheme: light;
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; background: var(--bg); }
body { font-synthesis: none; font-family: var(--fb); background: var(--bg); color: var(--ink); font-size: 16px; line-height: 1.45; min-height: 100vh; overscroll-behavior-y: none; }
body::before { content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0; background: radial-gradient(900px 420px at 50% -120px, var(--acc-glow), transparent 70%); opacity: .55; }
html[data-theme="light"] body::before { opacity: .35; }
button, input, select, textarea { font: inherit; color: inherit; }
button { background: none; border: 0; cursor: pointer; }
svg { display: block; }
.ic { width: 20px; height: 20px; flex: none; }
.ic-sm { width: 16px; height: 16px; }
.hid { display: none !important; }
a { color: var(--acc-ink); }

/* ── Shell ── */
#app { position: relative; z-index: 1; max-width: 520px; margin: 0 auto; min-height: 100vh; padding: var(--sat) 0 calc(var(--tab-h) + var(--sab) + 24px); }
.page { display: none; padding: 14px 16px 8px; animation: pin .2s ease-out; }
.page.on { display: block; }
@keyframes pin { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .page { animation: none; } * { transition: none !important; } }

.topbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 44px; margin-bottom: 10px; }
.topbar h1 { font-family: var(--fd); font-weight: 400; font-size: 34px; line-height: .95; letter-spacing: 0; text-transform: uppercase; }
.topbar .sub { color: var(--ink2); font-size: 14px; margin-top: 3px; }
.back { display: inline-flex; align-items: center; gap: 2px; color: var(--ink2); font-weight: 500; font-size: 15px; padding: 6px 0; margin-left: -4px; }
.iconbtn { width: 40px; height: 40px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; color: var(--ink2); background: var(--card); border: 1px solid var(--line); }
.iconbtn:active { background: var(--card2); }

.tabbar { position: fixed; bottom: 0; left: 0; right: 0; z-index: 50; background: rgba(12,11,10,.88); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); border-top: 1px solid var(--line); padding-bottom: var(--sab); }
html[data-theme="light"] .tabbar { background: rgba(255,255,255,.86); }
.tabbar > div { max-width: 520px; margin: 0 auto; width: 100%; display: flex; height: var(--tab-h); }
.tab { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: var(--ink3); font-size: 11px; font-weight: 600; letter-spacing: .02em; position: relative; }
.tab.on { color: var(--acc); }
.tab.on::after { content: ''; position: absolute; top: 0; width: 22px; height: 2px; border-radius: 2px; background: var(--acc); }
.tab .ic { width: 22px; height: 22px; }

/* ── Type ── */
h2 { font-family: var(--fd); font-weight: 400; font-size: 24px; line-height: 1.05; letter-spacing: .01em; }
h3 { font-family: var(--fb); font-weight: 700; font-size: 18px; line-height: 1.2; letter-spacing: -.005em; }
.sec { margin: 24px 0 10px; display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.sec h2 { font-size: 22px; text-transform: uppercase; }
.sec { margin: 26px 4px 10px; }
.sec .more { font-size: 14px; color: var(--acc-ink); font-weight: 600; }
.muted { color: var(--ink2); }
.muted2 { color: var(--ink3); }
.small { font-size: 13px; }
.num { font-family: var(--fd); font-weight: 700; font-variant-numeric: tabular-nums; }
p + p { margin-top: 8px; }

/* ── Cards ── */
.card { background: linear-gradient(165deg, rgba(255,255,255,.035), transparent 45%), var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 15px; }
.card + .card { margin-top: 10px; }
.card.tap { cursor: pointer; }
.card.tap:active { background: var(--card2); }
.row { display: flex; align-items: center; gap: 10px; }
.row.between { justify-content: space-between; }
.grow { flex: 1; min-width: 0; }
.list .card { border-radius: 0; border-width: 0 0 1px; background: transparent; padding: 12px 2px; margin: 0; }
.list .card:first-child { border-top-width: 1px; }
.stack > * + * { margin-top: 10px; }

/* ── Buttons ── */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: var(--rs); padding: 12px 16px; font-weight: 600; font-size: 15px; line-height: 1.2; border: 1px solid var(--line); background: var(--card2); color: var(--ink); min-height: 46px; }
.btn.p { background: linear-gradient(135deg, var(--acc2), var(--acc)); border-color: transparent; color: var(--on-acc); box-shadow: 0 6px 22px -8px var(--acc-glow); }
.btn.g { background: var(--green); border-color: transparent; color: #140600; }
.btn.d { color: var(--red); border-color: transparent; background: var(--red-soft); }
.btn.w { width: 100%; }
.btn.sm { padding: 8px 12px; font-size: 13px; min-height: 36px; }
.btn.ghost { background: transparent; border-color: transparent; color: var(--acc-ink); }
.btn:active { filter: brightness(.92); transform: translateY(1px); }
.btn:disabled { opacity: .45; }
.btn.big { min-height: 56px; font-size: 17px; border-radius: 14px; }

/* ── Chips / pills ── */
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 4px 0 8px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1px solid var(--line); background: var(--card); color: var(--ink2); border-radius: 999px; padding: 7px 13px; font-size: 13px; font-weight: 600; white-space: nowrap; }
.chip.on { background: var(--acc); color: var(--on-acc); border-color: var(--acc); }
.pill { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .03em; padding: 3px 8px; border-radius: 999px; background: var(--card3); color: var(--ink2); border: 1px solid var(--line); vertical-align: middle; }
.pill.b { background: var(--acc-soft); color: var(--acc-ink); border-color: transparent; }
.pill.g { background: var(--green-soft); color: var(--green); border-color: transparent; }
.pill.r { background: var(--red-soft); color: var(--red); border-color: transparent; }
.pill.a { background: var(--blue-soft); color: var(--blue); border-color: transparent; }

/* ── Inputs ── */
.inp { width: 100%; background: var(--bg2); border: 1px solid var(--line); border-radius: var(--rs); padding: 11px 12px; font-size: 16px; outline: none; color: var(--ink); }
.inp::placeholder { color: var(--ink3); }
.inp:focus { border-color: var(--acc); }
input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
input[type=number] { -moz-appearance: textfield; appearance: textfield; }
label.lbl { display: block; font-size: 13px; font-weight: 600; color: var(--ink2); margin: 12px 0 6px; }
.seg { display: flex; border: 1px solid var(--line); border-radius: var(--rs); overflow: hidden; background: var(--card); }
.seg button { flex: 1; padding: 10px 6px; font-weight: 600; font-size: 14px; color: var(--ink2); border-left: 1px solid var(--line); }
.seg button:first-child { border-left: 0; }
.seg button.on { background: var(--acc); color: var(--on-acc); }

/* ── Nivel / XP ── */
.lvl { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 14px; background: var(--card); border: 1px solid var(--line); margin-bottom: 12px; }
.lvl .badge { width: 44px; height: 44px; border-radius: 12px; background: linear-gradient(135deg, #FFD27A, var(--xp)); color: #140600; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: var(--fd); font-weight: 700; line-height: 1; flex: none; box-shadow: 0 4px 16px -6px rgba(255,178,36,.5); }
.lvl .badge small { font-size: 9px; font-weight: 700; letter-spacing: .06em; opacity: .8; }
.lvl .badge b { font-size: 22px; }
.lvl .t { font-weight: 600; font-size: 15px; }
.lvl .xp { font-size: 12px; color: var(--ink2); }
.lvl .bar { height: 5px; border-radius: 3px; background: var(--card3); margin-top: 6px; overflow: hidden; }
.lvl .bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--xp), #FFD27A); border-radius: 3px; transition: width .6s ease; }
.flame { position: relative; width: 44px; height: 48px; flex: none; color: var(--pr); filter: drop-shadow(0 0 8px rgba(255,84,32,.45)); }
.flame svg { width: 100%; height: 100%; }
.flame b { position: absolute; left: 0; right: 0; top: 19px; text-align: center; font-family: var(--fd); font-weight: 700; font-size: 17px; color: #140600; }
.flame.off { color: var(--ink3); filter: none; }
.flame.off b { color: var(--card); }

/* ── Hoy: sesión ── */
.hero { position: relative; border-radius: 22px; padding: 1px; background: linear-gradient(160deg, var(--acc), rgba(255,84,32,.15) 35%, var(--line) 70%); box-shadow: 0 20px 50px -30px var(--acc-glow); }
.hero > div { background: linear-gradient(165deg, rgba(255,255,255,.04), transparent 40%), var(--card); border-radius: 21px; padding: 16px 16px 14px; }
.hero .eyebrow-m { padding-right: 104px; }
.hero .eyebrow { font-size: 13px; color: var(--acc-ink); font-weight: 600; letter-spacing: .01em; }
.hero h2 { font-size: 40px; margin: 2px 0 0; }
.hero .focus { color: var(--ink2); font-size: 14px; margin-top: 2px; }
.hero-ex { margin: 14px 0 12px; border-top: 1px solid var(--line2); }
.hero-ex .r { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line2); }
.hero-ex .r .mu { width: 32px; height: 32px; border-radius: 9px; background: var(--card3); flex: none; overflow: hidden; position: relative; display: flex; align-items: center; justify-content: center; font-family: var(--fd); font-weight: 700; font-size: 9px; color: var(--ink3); }
.hero-ex .r .mu img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.hero-ex .r .n { flex: 1; min-width: 0; font-weight: 500; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hero-ex .r .t { font-family: var(--fd); font-weight: 600; font-size: 17px; max-width: 58%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink); font-variant-numeric: tabular-nums; }
.hero-ex .r .t.up { color: var(--green); }
.hero-ex .r .t.first { color: var(--ink3); font-size: 13px; font-family: var(--fb); font-weight: 500; }
.hero.active { background: linear-gradient(160deg, var(--green), rgba(255,122,61,.15) 35%, var(--line) 70%); }

.weekbox { display: flex; align-items: center; gap: 14px; }
.ring { width: 66px; height: 66px; flex: none; position: relative; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .c1 { fill: none; stroke: var(--card3); stroke-width: 7; }
.ring .c2 { fill: none; stroke: var(--acc); stroke-width: 7; stroke-linecap: round; transition: stroke-dashoffset .6s ease; }
.ring .c2.done { stroke: var(--green); }
.ring .v { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: var(--fd); font-weight: 700; font-size: 20px; }
.days7 { display: flex; gap: 5px; margin-top: 8px; }
.days7 span { flex: 1; height: 7px; border-radius: 4px; background: var(--card3); }
.days7 span.y { background: var(--green); }
.days7 span.t { outline: 1.5px solid var(--acc); outline-offset: 1px; }

.stat3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stat3 .card { padding: 12px 10px; }
.stat3 .num { font-size: 30px; line-height: 1; color: var(--ink); }
.stat3 .lab { font-size: 12px; color: var(--ink2); margin-top: 4px; }
.nextach { display: flex; align-items: center; gap: 12px; }
.nextach .mini { height: 5px; border-radius: 3px; background: var(--card3); overflow: hidden; margin-top: 6px; }
.nextach .mini i { display: block; height: 100%; background: var(--acc); border-radius: 3px; }

/* ── Entreno activo ── */
.wo-head { position: sticky; top: 0; background: var(--bg); z-index: 5; padding: calc(var(--sat) + 8px) 0 8px; margin: calc(-1 * var(--sat) - 14px) 0 8px; }
.wo-prog { height: 4px; background: var(--card3); border-radius: 2px; overflow: hidden; margin-top: 8px; }
.wo-prog i { display: block; height: 100%; background: linear-gradient(90deg, var(--acc), var(--acc2)); transition: width .3s ease; }
.wex { background: linear-gradient(165deg, rgba(255,255,255,.03), transparent 40%), var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 12px 10px; margin-bottom: 10px; }
.wex.done { border-color: rgba(255,122,61,.35); }
.wex.cur { border-color: var(--acc); box-shadow: 0 0 0 3px var(--acc-soft); }
.wex-top { display: flex; align-items: flex-start; gap: 10px; }
.wex-top .mu { width: 40px; height: 40px; border-radius: 10px; background: var(--card3); flex: none; overflow: hidden; position: relative; display: flex; align-items: center; justify-content: center; font-family: var(--fd); font-weight: 700; font-size: 10px; color: var(--ink3); }
.wex-top .mu img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.wex-top .name { flex: 1; min-width: 0; font-weight: 600; font-size: 17px; line-height: 1.2; }
.wex-top .name small { display: block; font-weight: 500; color: var(--ink2); font-size: 13px; margin-top: 2px; }
.wex-top .acts { display: flex; gap: 0; flex: none; }
.wex-top .acts button { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--ink2); }
.wex-top .acts button:active { background: var(--card2); }
.target { margin: 10px 0 8px; padding: 10px 12px; border-radius: var(--rs); background: var(--bg2); border: 1px solid var(--line2); }
.target .big { font-family: var(--fd); font-weight: 700; font-size: 28px; line-height: 1; letter-spacing: .01em; color: var(--acc-ink); }
.target .big.up { color: var(--green); }
.target .why { font-size: 13px; color: var(--ink2); margin-top: 5px; line-height: 1.4; }
.target.first { background: var(--blue-soft); border-color: transparent; }
.target.first .big { font-size: 15px; font-family: var(--fb); font-weight: 500; line-height: 1.4; color: var(--ink); }
.target.deload { background: var(--acc-soft); border-color: transparent; }
.ramp { font-size: 13px; color: var(--ink2); margin: 0 0 8px; padding-left: 2px; }
.ramp b { color: var(--ink); font-weight: 600; }
.sets-h { display: grid; grid-template-columns: 30px 1fr 1fr 1fr 48px; gap: 6px; font-size: 11px; font-weight: 700; color: var(--ink3); letter-spacing: .04em; padding: 0 2px 4px; }
.set { display: grid; grid-template-columns: 30px 1fr 1fr 1fr 48px; gap: 6px; align-items: center; padding: 4px 0; }
.set .sn { font-family: var(--fd); font-weight: 600; font-size: 16px; color: var(--ink3); text-align: center; }
.set .prev { font-size: 13px; color: var(--ink3); text-align: center; font-variant-numeric: tabular-nums; }
.set .prev b { color: var(--ink2); font-weight: 600; }
.set input { width: 100%; text-align: center; padding: 10px 4px; font-family: var(--fd); font-weight: 600; font-size: 20px; border-radius: var(--rs); border: 1px solid var(--line); background: var(--bg2); outline: none; color: var(--ink); }
.set input::placeholder { color: var(--ink3); }
.set input:focus { border-color: var(--acc); }
.set.ok input { background: var(--green-soft); border-color: transparent; color: var(--green); }
.set .chk { width: 48px; height: 44px; border-radius: var(--rs); border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; color: var(--ink3); background: var(--card2); }
.set.ok .chk { background: var(--green); border-color: var(--green); color: #140600; }
.set .fb { grid-column: 2 / 6; font-size: 12px; color: var(--green); font-weight: 600; padding-left: 2px; margin-top: -2px; }
.set .fb.r { color: var(--red); }
.wex-foot { display: flex; gap: 12px; margin-top: 8px; }
.wex-foot button { font-size: 13px; font-weight: 600; color: var(--acc-ink); padding: 6px 2px; }
.wex-foot button.m { color: var(--ink3); }
.wex-done { display: flex; align-items: center; gap: 10px; padding: 2px 0; }
.wex-done .tick { width: 26px; height: 26px; border-radius: 50%; background: var(--green); color: #140600; display: flex; align-items: center; justify-content: center; flex: none; }
.wex-done .n { flex: 1; font-weight: 600; }
.wex-done .s { font-size: 13px; color: var(--ink2); font-variant-numeric: tabular-nums; }

.restbar { position: fixed; left: 0; right: 0; bottom: calc(var(--tab-h) + var(--sab)); z-index: 40; transform: translateY(calc(100% + 90px)); transition: transform .25s ease; visibility: hidden; pointer-events: none; }
.restbar.on { transform: none; visibility: visible; pointer-events: auto; }
.restbar > div { position: relative; max-width: 520px; margin: 0 auto; background: var(--card3); color: var(--ink); border: 1px solid var(--line); border-bottom: 0; border-radius: 18px 18px 0 0; padding: 14px 16px; display: flex; align-items: center; gap: 12px; overflow: hidden; box-shadow: 0 -10px 40px rgba(0,0,0,.4); }
.restbar .t { font-family: var(--fd); font-weight: 700; font-size: 36px; line-height: 1; min-width: 80px; font-variant-numeric: tabular-nums; color: var(--acc-ink); }
.restbar .l { flex: 1; font-size: 13px; color: var(--ink2); }
.restbar button { color: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; font-weight: 600; font-size: 13px; background: var(--card); }
.restbar .bar { position: absolute; left: 0; right: 0; top: 0; height: 3px; background: rgba(255,255,255,.08); }
.restbar .bar i { display: block; height: 100%; background: var(--acc); transition: width 1s linear; }
body.wo-on .tabbar { display: none; }
body.wo-on .restbar { bottom: 0; }
body.wo-on .restbar > div { padding-bottom: calc(14px + var(--sab)); }
body.wo-on #app { padding-bottom: calc(130px + var(--sab)); }

/* ── Bottom sheet ── */
.sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 80; display: none; }
.sheet-bg.on { display: block; }
.sheet { visibility: hidden; position: fixed; left: 0; right: 0; bottom: 0; z-index: 81; background: var(--card); border: 1px solid var(--line); border-bottom: 0; border-radius: 22px 22px 0 0; max-height: 88vh; overflow-y: auto; transform: translateY(100%); transition: transform .28s cubic-bezier(.32,.72,0,1); padding: 8px 16px calc(32px + var(--sab)); max-width: 520px; margin: 0 auto; }
.sheet.on { transform: none; visibility: visible; }
.sheet .grab { width: 40px; height: 4px; border-radius: 2px; background: var(--card3); margin: 4px auto 14px; }
.sheet h2 { font-size: 26px; }
.sheet .steps { counter-reset: st; margin: 6px 0 2px; }
.sheet .steps li { list-style: none; position: relative; padding: 7px 0 7px 32px; font-size: 15px; line-height: 1.45; border-bottom: 1px solid var(--line2); }
.sheet .steps li::before { counter-increment: st; content: counter(st); position: absolute; left: 0; top: 8px; width: 22px; height: 22px; border-radius: 50%; background: var(--acc-soft); color: var(--acc-ink); font-family: var(--fd); font-weight: 700; font-size: 14px; display: flex; align-items: center; justify-content: center; }
.sheet .bl { margin: 4px 0; }
.sheet .bl li { list-style: none; padding: 5px 0 5px 18px; position: relative; font-size: 15px; line-height: 1.45; }
.sheet .bl li::before { content: ''; position: absolute; left: 4px; top: 13px; width: 6px; height: 6px; border-radius: 50%; background: var(--ink3); }
.sheet .bl.err li::before { background: var(--red); }
.sheet .bl.cue li::before { background: var(--green); }
.sheet h3 { margin: 18px 0 4px; color: var(--acc-ink); }
.meta { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 4px; }
.ytlink { display: inline-flex; align-items: center; gap: 8px; margin-top: 14px; padding: 10px 14px; border-radius: var(--rs); border: 1px solid var(--line); background: var(--card2); font-weight: 600; font-size: 14px; color: var(--ink); text-decoration: none; }

/* ── Biblioteca ── */
.mugrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.mug { background: linear-gradient(165deg, rgba(255,255,255,.04), transparent 45%), var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px 10px 10px; text-align: center; cursor: pointer; }
.mug:active { background: var(--card2); }
.mug .im { width: 64px; height: 64px; margin: 0 auto 8px; border-radius: 14px; background: var(--card3); display: flex; align-items: center; justify-content: center; overflow: hidden; font-family: var(--fd); font-weight: 700; font-size: 14px; color: var(--ink2); position: relative; }
.mug .im img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.mug b { display: block; font-size: 14px; font-weight: 600; }
.mug span { font-size: 12px; color: var(--ink3); }
.exrow { display: flex; align-items: center; gap: 12px; padding: 11px 2px; border-bottom: 1px solid var(--line2); }
.exrow .mu { width: 44px; height: 44px; border-radius: 12px; background: var(--card3); border: 1px solid var(--line2); display: flex; align-items: center; justify-content: center; font-family: var(--fd); font-weight: 700; font-size: 11px; letter-spacing: .02em; color: var(--ink2); flex: none; text-transform: uppercase; overflow: hidden; position: relative; }
.exrow .mu img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.exrow .n { flex: 1; min-width: 0; }
.exrow .n b { display: block; font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.exrow .n span { font-size: 13px; color: var(--ink2); }
.exrow .best { font-family: var(--fd); font-weight: 600; font-size: 16px; color: var(--acc-ink); white-space: nowrap; }
.search { position: relative; margin-bottom: 10px; }
.search .inp { padding-left: 38px; }
.search .ic { position: absolute; left: 12px; top: 13px; color: var(--ink3); }

/* ── Programas ── */
.prog { background: linear-gradient(165deg, rgba(255,255,255,.04), transparent 45%), var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 15px; margin-bottom: 10px; }
.prog.on { border-color: var(--acc); box-shadow: 0 0 0 3px var(--acc-soft); }
.prog h3 { font-size: 22px; }
.prog .m { color: var(--ink2); font-size: 13px; margin: 2px 0 8px; }
.dayrow { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line2); }
.dayrow .d { font-family: var(--fd); font-weight: 700; font-size: 20px; width: 40px; color: var(--acc-ink); }
.dayrow .n { flex: 1; }
.dayrow .n small { display: block; color: var(--ink2); font-size: 13px; }
.ed-row { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--line2); }
.ed-row .n { flex: 1; min-width: 0; font-weight: 500; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ed-row input { width: 44px; text-align: center; padding: 6px 2px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg2); font-family: var(--fd); font-weight: 600; font-size: 16px; color: var(--ink); }
.ed-row .x { color: var(--ink3); padding: 4px; }
.cycle { display: grid; grid-template-columns: repeat(9, 1fr); gap: 4px; margin-top: 10px; }
.cycle span { height: 26px; border-radius: 6px; background: var(--card3); display: flex; align-items: center; justify-content: center; font-family: var(--fd); font-weight: 700; font-size: 13px; color: var(--ink3); }
.cycle span.b2 { background: var(--acc-soft); color: var(--acc-ink); }
.cycle span.dl { background: var(--blue-soft); color: var(--blue); }
.cycle span.cur { outline: 2px solid var(--acc); outline-offset: 1px; color: var(--ink); }

/* ── Progreso ── */
.chart { width: 100%; height: auto; display: block; }
.chart text { font-family: var(--fb); font-size: 10px; fill: var(--ink3); }
.chart .bar { fill: var(--acc); }
.chart .bar.ok { fill: var(--green); }
.chart .bar.cur { opacity: .55; }
.chart .goal { stroke: var(--ink3); stroke-dasharray: 3 3; }
.chart .ln { fill: none; stroke: var(--acc); stroke-width: 2.2; stroke-linejoin: round; }
.chart .dot { fill: var(--acc); }
.chart .dot.pr { fill: var(--green); }
.heat { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 1fr); gap: 3px; margin-top: 10px; }
.heat span { width: 100%; aspect-ratio: 1; border-radius: 3px; background: var(--card3); }
.heat span.y { background: var(--acc); }
.heat span.t { outline: 1.5px solid var(--ink2); outline-offset: 1px; }
.heat span.f { background: transparent; }
.donut { display: flex; align-items: center; gap: 14px; }
.donut svg { width: 120px; height: 120px; flex: none; }
.donut .lg { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 4px 10px; font-size: 13px; }
.donut .lg i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 6px; vertical-align: middle; }
.ach { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.ach .a { border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; background: var(--card); display: flex; gap: 10px; align-items: center; }
.ach .a .ico { width: 36px; height: 36px; border-radius: 10px; background: var(--card3); display: flex; align-items: center; justify-content: center; color: var(--ink3); flex: none; }
.ach .a.on .ico { background: linear-gradient(135deg, var(--acc2), var(--acc)); color: var(--on-acc); }
.ach .a.on { border-color: rgba(255,84,32,.4); }
.ach .a b { display: block; font-family: var(--fd); font-size: 16px; font-weight: 700; line-height: 1.1; }
.ach .a span { font-size: 11.5px; color: var(--ink2); line-height: 1.3; }
.ach .a:not(.on) { opacity: .5; }
.hist-row { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line2); font-size: 14px; }
.hist-row .d { color: var(--ink2); width: 92px; flex: none; }
.hist-row .s { flex: 1; font-family: var(--fd); font-weight: 600; font-size: 16px; font-variant-numeric: tabular-nums; }

/* ── Onboarding ── */
.ob { position: relative; z-index: 1; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; padding: calc(var(--sat) + 32px) 22px calc(var(--sab) + 40px); max-width: 520px; margin: 0 auto; }
.ob h1 { font-family: var(--fd); font-weight: 700; font-size: 46px; line-height: .95; letter-spacing: .01em; margin-bottom: 10px; }
.ob .lead { font-size: 17px; color: var(--ink2); margin-bottom: 20px; }
.opt { display: block; width: 100%; text-align: left; border: 1px solid var(--line); background: var(--card); border-radius: var(--r); padding: 14px 16px; margin-top: 10px; }
.opt.on { border-color: var(--acc); box-shadow: 0 0 0 3px var(--acc-soft); }
.opt b { display: block; font-size: 16px; font-weight: 600; }
.opt span { font-size: 13px; color: var(--ink2); }
.obdots { display: flex; gap: 6px; margin-bottom: 20px; }
.obdots i { width: 22px; height: 4px; border-radius: 2px; background: var(--card3); }
.obdots i.on { background: var(--acc); }
.logo { display: flex; align-items: center; gap: 10px; margin-bottom: 22px; }
.logo .lg { width: 40px; height: 40px; border-radius: 11px; background: linear-gradient(135deg, var(--acc2), var(--acc)); display: flex; align-items: center; justify-content: center; color: var(--on-acc); }
.logo b { font-family: var(--fd); font-size: 22px; font-weight: 700; letter-spacing: .02em; }
.logo small { display: block; font-size: 11px; color: var(--ink3); letter-spacing: .08em; text-transform: uppercase; font-weight: 600; }

/* ── Resumen ── */
.summary-hero { text-align: center; padding: 28px 12px 18px; }
.summary-hero .big { font-family: var(--fd); font-weight: 700; font-size: 64px; line-height: .95; color: var(--acc-ink); }
.summary-hero .lab { color: var(--ink2); font-size: 15px; margin-top: 6px; }
.win { display: flex; align-items: flex-start; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line2); }
.win .ic { color: var(--green); margin-top: 2px; }
.win.pr .ic { color: var(--pr); }
.win b { font-weight: 600; }
.win span { display: block; color: var(--ink2); font-size: 13px; }
.xpgain { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; border-radius: 14px; background: var(--xp-soft); border: 1px solid rgba(255,178,36,.3); margin-top: 10px; }
.xpgain b { font-family: var(--fd); font-size: 24px; color: #FFD27A; }

/* ── Aprender ── */
.learn-card { display: flex; align-items: center; gap: 12px; padding: 13px 2px; border-bottom: 1px solid var(--line2); }
.learn-card .ico { width: 40px; height: 40px; border-radius: 12px; background: var(--card3); display: flex; align-items: center; justify-content: center; color: var(--acc-ink); flex: none; }
.learn-card .ico svg { width: 20px; height: 20px; }
.learn-card b { display: block; font-weight: 600; font-size: 15px; }
.learn-card span { font-size: 13px; color: var(--ink2); }
.art { font-size: 15.5px; line-height: 1.6; }
.art p { margin-bottom: 12px; }
.art h3, .art h4 { font-family: var(--fd); font-size: 21px; margin: 18px 0 8px; color: var(--acc-ink); }
.art ul, .art ol { margin: 0 0 12px 20px; }
.art li { margin-bottom: 4px; }
.art table { width: 100%; border-collapse: collapse; margin: 10px 0 14px; font-size: 14px; }
.art th, .art td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line2); }
.art th { font-weight: 600; color: var(--ink2); }
.art .gterm { text-decoration: underline dotted var(--acc); text-underline-offset: 3px; cursor: pointer; color: inherit; }
.art strong { font-weight: 600; }
.faq-q { padding: 12px 2px; border-bottom: 1px solid var(--line2); }
.faq-q b { display: flex; justify-content: space-between; gap: 8px; font-weight: 600; font-size: 15px; cursor: pointer; }
.faq-q p { display: none; margin-top: 8px; color: var(--ink2); font-size: 15px; line-height: 1.5; }
.faq-q.on p { display: block; }
.gloss-row { padding: 10px 2px; border-bottom: 1px solid var(--line2); }
.gloss-row b { font-weight: 600; }
.gloss-row p { font-size: 14px; color: var(--ink2); margin-top: 2px; }

/* ── Toast ── */
.toast { position: fixed; left: 50%; bottom: calc(var(--tab-h) + var(--sab) + 16px); transform: translateX(-50%) translateY(20px); background: var(--acc); color: var(--on-acc); padding: 10px 16px; border-radius: 999px; font-size: 14px; font-weight: 600; opacity: 0; transition: all .2s; z-index: 90; pointer-events: none; white-space: nowrap; max-width: 92vw; overflow: hidden; text-overflow: ellipsis; box-shadow: 0 8px 24px -8px var(--acc-glow); }
.toast.on { opacity: 1; transform: translateX(-50%); }
body.wo-on .toast { bottom: calc(115px + var(--sab)); }

.empty { text-align: center; color: var(--ink2); padding: 28px 16px; font-size: 15px; }
.empty b { display: block; color: var(--ink); font-family: var(--fd); font-size: 22px; margin-bottom: 4px; }
.confetti { position: fixed; inset: 0; pointer-events: none; z-index: 100; }

/* ── Detalles con alma ── */
.eyebrow-m, .lab-m { font-family: var(--fm); font-size: 10px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--ink3); }
.brand { display: flex; align-items: center; gap: 10px; }
.brand .t { font-family: var(--fd); font-size: 18px; font-weight: 700; letter-spacing: .06em; line-height: 1; }
.brand .t small { display: block; font-family: var(--fm); font-size: 9px; letter-spacing: .18em; color: var(--ink3); margin-top: 3px; }
.mfig { display: flex; align-items: center; justify-content: center; flex: none; }
.mfig svg { height: 100%; width: auto; }
.mfig.box { width: 46px; height: 46px; border-radius: 12px; background: var(--card3); overflow: hidden; }
.mfig.box svg { width: 100%; height: 100%; }
.eqg { width: 14px; height: 14px; display: inline-block; vertical-align: -2px; margin-right: 3px; color: var(--ink3); }
.eqg svg { width: 14px; height: 14px; }
.bbwrap { margin: 6px 0 10px; }
.bb { width: 100%; max-width: 300px; height: auto; display: block; margin: 0 auto; }
.bblbl { text-align: center; font-family: var(--fm); font-size: 11px; letter-spacing: .06em; color: var(--ink2); margin-top: 2px; }
.dbv { width: 120px; height: auto; display: block; margin: 0 auto; }
.stk { width: 64px; height: auto; display: block; }
.xpf { position: fixed; z-index: 95; pointer-events: none; font-family: var(--fd); font-weight: 700; font-size: 22px; color: #FFD27A; text-shadow: 0 0 12px rgba(255,178,36,.7); animation: xpf 1.2s ease-out forwards; }
@keyframes xpf { 0% { opacity: 0; transform: translateY(0) scale(.8); } 20% { opacity: 1; transform: translateY(-8px) scale(1.1); } 100% { opacity: 0; transform: translateY(-46px) scale(1); } }
.set.ok .chk { animation: pop .35s cubic-bezier(.32,.72,0,1); }
@keyframes pop { 0% { transform: scale(.6); } 60% { transform: scale(1.15); } 100% { transform: scale(1); } }
.rring { width: 40px; height: 40px; flex: none; position: relative; }
.rring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.rring .a { fill: none; stroke: rgba(255,255,255,.1); stroke-width: 4; }
.rring .b { fill: none; stroke: var(--acc); stroke-width: 4; stroke-linecap: round; transition: stroke-dashoffset 1s linear; }
.splash { position: fixed; inset: 0; z-index: 999; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; animation: splashOut .5s ease 1.1s forwards; }
.splash .lg { width: 84px; height: 84px; animation: splashIn .7s cubic-bezier(.32,.72,0,1); filter: drop-shadow(0 12px 30px var(--acc-glow)); }
.splash .lg svg { width: 100%; height: 100%; }
.splash .t { font-family: var(--fd); font-size: 30px; font-weight: 700; letter-spacing: .1em; animation: splashIn .7s .15s cubic-bezier(.32,.72,0,1) both; }
.splash .s { font-family: var(--fm); font-size: 10px; letter-spacing: .3em; color: var(--ink3); animation: splashIn .7s .25s both; }
@keyframes splashIn { from { opacity: 0; transform: translateY(14px) scale(.9); } to { opacity: 1; transform: none; } }
@keyframes splashOut { to { opacity: 0; visibility: hidden; } }
.hero-fig { position: absolute; right: 2px; top: 30px; height: 126px; display: flex; gap: 0; opacity: .97; }
.hero-fig svg { height: 100%; width: auto; }
.chart .area { fill: url(#areag); }
.pr-tag { display: inline-flex; align-items: center; gap: 4px; font-family: var(--fm); font-size: 10px; letter-spacing: .1em; color: var(--pr); }
.radar { width: 100%; max-width: 260px; margin: 0 auto; display: block; }
.radar .grid { fill: none; stroke: var(--line); }
.radar .ax { stroke: var(--line); }
.radar .poly { fill: rgba(255,84,32,.25); stroke: var(--acc); stroke-width: 2; stroke-linejoin: round; }
.radar text { font-family: var(--fm); font-size: 8.5px; fill: var(--ink2); letter-spacing: .06em; }
.bodyheat { display: flex; justify-content: center; gap: 24px; }
.bodyheat .mfig { height: 200px; }
.coach { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 14px; background: var(--card2); border: 1px solid var(--line); margin-top: 10px; font-size: 14px; line-height: 1.45; }
.coach .lg { width: 28px; height: 28px; flex: none; margin-top: 1px; }
.coach .lg svg { width: 100%; height: 100%; }
.ach .a.on .ico { background: linear-gradient(135deg, var(--acc2), var(--acc)); color: var(--on-acc); }
.tab.on { color: var(--acc); }
.sec .more, .btn.ghost, .wex-foot button, .art .gterm { color: var(--acc-ink); }
.summary-hero .big { color: var(--ink); }
.target .big { color: var(--acc-ink); }

/* ── Estado (ficha de personaje) ── */
.sw { position: relative; border: 1px solid var(--acc); border-radius: 14px; padding: 16px 16px 12px; background: linear-gradient(180deg, rgba(255,84,32,.08), transparent 60%), var(--card); box-shadow: 0 0 40px -12px var(--acc-glow), inset 0 1px 0 rgba(255,255,255,.05); overflow: hidden; }
.sw::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 1px; background: linear-gradient(90deg, transparent, var(--acc), transparent); }
.sw .c { position: absolute; width: 10px; height: 10px; border: 1.5px solid var(--acc); opacity: .8; }
.sw .c.tl { top: 6px; left: 6px; border-right: 0; border-bottom: 0; } .sw .c.tr { top: 6px; right: 6px; border-left: 0; border-bottom: 0; } .sw .c.bl { bottom: 6px; left: 6px; border-right: 0; border-top: 0; } .sw .c.br { bottom: 6px; right: 6px; border-left: 0; border-top: 0; }

    why:'La máquina guía el movimiento, así que podés llegar cerca del fallo en la parte alta del pecho sin riesgo. Muy buena para principiantes o como segundo ejercicio de pecho.',
    swaps:['incline-db','smith-incline','incline-bench','machine-press'], yt:'press inclinado en máquina técnica', img:'Leverage_Incline_Chest_Press' },

  { id:'db-fly', name:'Aperturas con mancuernas', m:'pecho', m2:['hombros'], tp:['pectoral'], ts:['deltoides_ant'], eq:'mancuernas', pat:'aisl', lvl:2, loc:'ambos', reps:[10,15], inc:2, rest:60, mode:'w',
    setup:['Sentate en la punta de un banco plano con las mancuernas en los muslos y acostate llevándolas a la altura del pecho.','Subí las mancuernas por encima del pecho, palmas enfrentadas, codos apenas doblados.','Omóplatos juntos y bajos, pies firmes en el piso.'],
    go:['Abrí los brazos en un arco amplio, bajando en 2-3 segundos, con los codos fijos en esa leve flexión.','Bajá hasta que las mancuernas queden a la altura del pecho y sientas el estiramiento. No más abajo.','Volvé por el mismo arco hasta juntar las mancuernas arriba, sin chocarlas.'],
    cues:['Abrazá un barril grande.','Los codos no se doblan ni se estiran: el movimiento es solo del hombro.'],
    errs:['Doblar los codos al bajar: se vuelve un press y el pecho trabaja menos.','Bajar demasiado con peso alto. Castiga el hombro: llegá a la altura del pecho y listo.','Elegir mancuernas pesadas. Acá manda el estiramiento, no el kilaje.'],
    why:'Aísla el pecho con mucho estiramiento después de los presses. Si te molesta el hombro, el pec deck o las poleas son más amables.',
    swaps:['pec-deck','cable-fly','db-bench'], yt:'aperturas con mancuernas técnica', img:'Dumbbell_Flyes' },

  { id:'incline-db-fly', name:'Aperturas inclinadas con mancuernas', m:'pecho', m2:['hombros'], tp:['pectoral_sup'], ts:['deltoides_ant'], eq:'mancuernas', pat:'aisl', lvl:2, loc:'ambos', reps:[10,15], inc:2, rest:60, mode:'w',
    setup:['Banco a 30° como máximo. Sentate con las mancuernas en los muslos y acostate llevándolas al pecho.','Subilas por encima del pecho con los codos apenas doblados. Las mancuernas casi se tocan.','Omóplatos juntos, pecho alto, pies firmes.'],
    go:['Abrí los brazos hacia los costados en un arco, bajando en 2-3 segundos. Abajo, las palmas miran hacia el techo.','Frená cuando las mancuernas lleguen a la altura del pecho y sientas el estiramiento arriba del pecho.','Cerrá por el mismo arco hasta juntar las mancuernas encima de las clavículas.'],
    cues:['Las manos dibujan una media luna, siempre con el mismo ángulo de codo.','Juntá los bíceps arriba, no solo las manos.'],
    errs:['Banco muy inclinado: pasa a trabajar más el hombro que el pecho.','Convertirlo en press doblando los codos al subir.','Bajar más allá de la línea del pecho con peso alto. Riesgo para el hombro.'],
    why:'Lleva el estiramiento de las aperturas a la parte alta del pecho, que suele quedar atrás. Buen cierre después de un press inclinado.',
    swaps:['low-cable-fly','cable-fly','incline-db'], yt:'aperturas inclinadas con mancuernas técnica', img:'Incline_Dumbbell_Flyes' },

  { id:'low-cable-fly', name:'Cruce de poleas de abajo hacia arriba', m:'pecho', m2:['hombros'], tp:['pectoral_sup'], ts:['deltoides_ant'], eq:'polea', pat:'aisl', lvl:1, loc:'gym', reps:[12,15], inc:2.5, rest:60, mode:'w',
    setup:['Poleas en la posición más baja, un estribo en cada mano.','Da un paso adelante para que el cable tenga tensión. Un pie adelante y otro atrás para estabilizarte.','Brazos casi estirados al costado de las piernas, palmas al frente, codos apenas doblados.'],
    go:['Subí las manos en diagonal hacia adelante y arriba, hasta que se encuentren frente a la parte alta del pecho.','Arriba, apretá el pecho un segundo con las palmas mirando hacia el techo.','Bajá controlado en 2 segundos por el mismo camino hasta sentir el estiramiento.'],
    cues:['Como si levantaras una bandeja con las dos manos.','El torso queda quieto: solo se mueven los brazos.'],
    errs:['Subir las manos por encima de la cara: ahí ya trabaja el hombro.','Doblar los codos y tirar con los bíceps.','Balancear el torso para mover más peso.'],
    why:'Trabaja la parte alta del pecho con tensión constante en todo el recorrido. Muy buen complemento del press inclinado y fácil de aprender.',
    swaps:['incline-db-fly','cable-fly','pec-deck'], yt:'cruce de poleas bajas pecho superior técnica', img:'Low_Cable_Crossover' },

  { id:'decline-pushup', name:'Flexiones con pies elevados', m:'pecho', m2:['hombros','triceps','core'], tp:['pectoral_sup','pectoral'], ts:['deltoides_ant','triceps','transverso'], eq:'cuerpo', pat:'empuje-h', lvl:2, loc:'ambos', reps:[8,15], inc:0, rest:90, mode:'bw',
    setup:['Puntas de los pies arriba de un banco o una silla firme, manos en el piso un poco más abiertas que los hombros.','Cuerpo en línea recta de cabeza a talones, glúteos y abdomen apretados.','Cuanto más alto el apoyo de los pies, más difícil y más trabaja el hombro.'],
    go:['Bajá en 2 segundos hasta que el pecho quede a pocos centímetros del piso, codos a unos 45° del cuerpo.','Empujá el piso hasta estirar los brazos, sin perder la línea del cuerpo.','Cuando hagas 15 limpias, subí la altura de los pies o ponete un disco en la espalda.'],
    cues:['Cuerpo como una tabla de cabeza a talones.','Empujá el piso lejos de vos.'],
    errs:['Cadera caída: la zona lumbar se arquea y se carga.','Bajar a medias. El rango completo es lo que hace que sirva.','Codos abiertos en cruz: castiga el hombro.'],
    why:'Pone más peso en las manos y apunta a la parte alta del pecho. El paso siguiente cuando las flexiones normales te quedan fáciles.',
    swaps:['pushup','incline-db','pike-pushup'], yt:'flexiones con pies elevados técnica', img:'Push-Ups_With_Feet_Elevated' },

  { id:'db-floor-press', name:'Press en el piso con mancuernas', m:'pecho', m2:['triceps','hombros'], tp:['pectoral','triceps'], ts:['deltoides_ant'], eq:'mancuernas', pat:'empuje-h', lvl:1, loc:'ambos', reps:[8,12], inc:2, rest:90, mode:'w',
    setup:['Sentate en el piso con una mancuerna en cada muslo y acostate llevándolas al pecho con ayuda de las rodillas.','Rodillas dobladas, plantas apoyadas en el piso.','Mancuernas arriba con los brazos estirados, palmas mirando hacia los pies o enfrentadas.'],
    go:['Bajá controlado hasta que la parte de atrás del brazo toque el piso suavemente.','Frená un segundo con los brazos apoyados, sin relajar el cuerpo.','Empujá hasta estirar los brazos, acercando las mancuernas arriba sin chocarlas.'],
    cues:['Apoyá el codo como si fuera un huevo: tocá, no golpees.','Codos a unos 45° del torso; más pegados si querés más tríceps.'],
    errs:['Golpear los codos contra el piso y rebotar.','Codos abiertos en cruz: castiga el hombro aunque el rango sea corto.','Perder la pausa abajo. Ahí está la gracia: arrancar sin impulso.'],
    why:'El piso limita el recorrido y protege el hombro. Ideal para entrenar en casa sin banco o si el press completo te molesta.',
    swaps:['db-bench','pushup','close-bench'], yt:'press en el suelo con mancuernas técnica', img:'Dumbbell_Floor_Press' },

  { id:'db-pullover', name:'Pullover con mancuerna', m:'pecho', m2:['espalda','triceps'], tp:['pectoral','dorsal'], ts:['triceps_largo','redondo','deltoides_post'], eq:'mancuernas', pat:'aisl', lvl:2, loc:'ambos', reps:[10,15], inc:2, rest:60, mode:'w',
    setup:['Acostate cruzado sobre un banco plano: solo la parte alta de la espalda apoyada, cadera más baja que el banco y pies firmes en el piso.','Agarrá una mancuerna con las dos manos, palmas contra la cara interna del disco de arriba.','Llevala encima del pecho con los brazos estirados y los codos apenas doblados.'],
    go:['Bajá la mancuerna por detrás de la cabeza en un arco, en 2-3 segundos, sin doblar más los codos.','Frená cuando los brazos queden en línea con el torso y sientas el estiramiento en el pecho y debajo de las axilas.','Volvé por el mismo arco hasta tener la mancuerna otra vez encima del pecho.'],
    cues:['Los brazos son una palanca rígida: solo se mueve el hombro.','Costillas abajo: no dejes que el pecho se infle y la espalda se arquee.'],
    errs:['Doblar los codos al bajar: pasa a ser un ejercicio de tríceps.','Bajar más allá de la línea del torso con peso. Fuerza el hombro.','Mancuerna mal agarrada o con discos flojos. Revisala antes: pasa por encima de tu cara.'],
    why:'Estira pecho y dorsales a la vez en un movimiento que pocos ejercicios cubren. Requiere hombros con buena movilidad: si molesta, cambialo por el pullover en polea.',
    swaps:['straight-arm-pd','db-fly','lat-pulldown'], yt:'pullover con mancuerna técnica correcta', img:'Straight-Arm_Dumbbell_Pullover' },

  // ─── ESPALDA ───
  { id:'chinup', name:'Dominadas supinas (chin-up)', m:'espalda', m2:['biceps','core'], tp:['dorsal','biceps'], ts:['redondo','braquial','romboides'], eq:'cuerpo', pat:'tiron-v', lvl:2, loc:'ambos', reps:[5,10], inc:2.5, rest:150, mode:'bwplus',
    setup:['Agarrá la barra con las palmas mirando hacia vos, manos al ancho de los hombros.','Colgate con los brazos estirados y los hombros activos: que las orejas no se hundan entre los hombros.','Piernas juntas y un poco adelante, abdomen firme para no balancearte.'],
    go:['Bajá los omóplatos y tirá llevando los codos hacia las costillas hasta que el mentón pase la barra.','Frená un segundo arriba con el pecho cerca de la barra.','Bajá en 2-3 segundos hasta estirar los brazos por completo.','Cuando hagas 10 limpias, agregá peso con cinturón o una mancuerna entre los pies.'],
    cues:['Codos a los bolsillos.','Pecho a la barra, no mentón estirado hacia arriba.'],
    errs:['Estirar el cuello para pasar el mentón. No cuenta: subí el cuerpo.','Balancearse o patear para ganar impulso.','Bajar a medias. La rep empieza con los brazos estirados.'],
    why:'La versión de dominada que más fácil sale: el bíceps ayuda más. Buen primer objetivo antes de las dominadas pronas.',
    swaps:['assisted-pullup','underhand-pulldown','pullup'], yt:'dominadas supinas chin up técnica', img:'Chin-Up' },

  { id:'close-pulldown', name:'Jalón agarre estrecho', m:'espalda', m2:['biceps'], tp:['dorsal'], ts:['redondo','biceps','romboides'], eq:'polea', pat:'tiron-v', lvl:1, loc:'gym', reps:[8,12], inc:5, rest:90, mode:'w',
    setup:['Ajustá el rodillo para que te trabe los muslos firmes contra el asiento.','Agarrá la barra con las palmas al frente y las manos más juntas que los hombros (si tu gym tiene triángulo, el movimiento es el mismo).','Brazos estirados, torso inclinado unos 20-30° hacia atrás, pecho arriba.'],
    go:['Bajá los omóplatos y tirá la barra hasta la parte alta del pecho, llevando los codos hacia abajo y pegados al cuerpo.','Abajo, apretá la espalda un segundo sin echarte más hacia atrás.','Subí controlado en 2 segundos hasta estirar los brazos y sentir el estiramiento debajo de las axilas.'],
    cues:['Llevá los codos a los bolsillos traseros.','Las manos son ganchos: tirás con los codos, no con los dedos.'],
    errs:['Tirarse hacia atrás para mover más peso. El torso queda quieto.','Subir a medias. El estiramiento de arriba es parte del ejercicio.','Encoger los hombros al tirar: el trapecio le roba trabajo al dorsal.'],
    why:'El agarre cerrado alarga el recorrido de los codos y carga mucho el dorsal. Buena variante para alternar con el jalón abierto.',
    swaps:['lat-pulldown','underhand-pulldown','cable-row'], yt:'jalón al pecho agarre cerrado técnica', img:'Close-Grip_Front_Lat_Pulldown' },

  { id:'underhand-pulldown', name:'Jalón supino', m:'espalda', m2:['biceps'], tp:['dorsal','biceps'], ts:['redondo','braquial','romboides'], eq:'polea', pat:'tiron-v', lvl:1, loc:'gym', reps:[8,12], inc:5, rest:90, mode:'w',
    setup:['Ajustá el rodillo para que te trabe los muslos contra el asiento.','Agarrá la barra con las palmas mirando hacia vos, manos al ancho de los hombros o un poco más juntas.','Brazos estirados, torso inclinado unos 20-30° hacia atrás, pecho alto.'],
    go:['Bajá los omóplatos y tirá la barra hasta la parte alta del pecho, con los codos cerca del cuerpo.','Apretá la espalda un segundo abajo.','Subí controlado en 2 segundos hasta estirar los brazos por completo.'],
    cues:['Pecho a la barra.','Codos hacia las costillas, no hacia atrás.'],
    errs:['Tirar solo con los brazos, como un curl. Iniciá bajando los omóplatos.','Echarse hacia atrás con todo el torso para subir peso.','Dejar que la barra suba de golpe.'],
    why:'Mismo movimiento que la dominada supina pero con peso regulable. Ideal para prepararte para las chin-ups o sumar volumen de dorsal y bíceps.',
    swaps:['chinup','lat-pulldown','close-pulldown'], yt:'jalón supino técnica', img:'Underhand_Cable_Pulldowns' },

  { id:'single-arm-pulldown', name:'Jalón a una mano', m:'espalda', m2:['biceps'], tp:['dorsal'], ts:['redondo','biceps','oblicuos'], eq:'polea', pat:'tiron-v', lvl:1, loc:'gym', reps:[10,12], inc:2.5, rest:60, mode:'w', unil:true,
    setup:['Polea alta con un estribo. Sentate con el rodillo trabando los muslos.','Agarrá el estribo con la palma al frente y el brazo estirado arriba.','Torso derecho, pecho alto; la otra mano apoyada en el muslo o en la máquina.'],
    go:['Bajá el omóplato y tirá el codo hacia abajo y al costado hasta que la mano quede a la altura del hombro.','Apretá un segundo abajo con el codo pegado al cuerpo.','Subí controlado en 2 segundos hasta estirar del todo y sentir el estiramiento en el costado.','Hacé todas las reps de un lado y después cambiá.'],
    cues:['Metete el codo en el bolsillo del pantalón.','El torso no gira: solo se mueve el brazo.'],
    errs:['Girar el torso para tirar más peso.','Recorrido corto arriba. El estiramiento es lo que lo hace valioso.','Encoger el hombro al tirar.'],
    why:'Trabaja cada lado por separado y permite más recorrido que el jalón con barra. Útil para corregir diferencias entre un lado y otro.',
    swaps:['lat-pulldown','db-row','band-pulldown'], yt:'jalón a una mano polea técnica', img:'One_Arm_Lat_Pulldown' },

  { id:'tbar-row', name:'Remo en T', m:'espalda', m2:['biceps','hombros'], tp:['romboides','dorsal'], ts:['deltoides_post','biceps','lumbares','redondo'], eq:'barra', pat:'tiron-h', lvl:2, loc:'gym', reps:[8,12], inc:2.5, rest:120, mode:'w',
    setup:['Una punta de la barra trabada en un landmine o en un rincón, discos en la otra punta.','Parate a horcajadas de la barra y poné el agarre en V (triángulo) debajo de la barra, junto a los discos.','Rodillas flexionadas, cadera atrás, torso a unos 45°, espalda recta y brazos estirados.'],
    go:['Tirá el agarre hacia la parte alta del abdomen, llevando los codos hacia atrás y juntando los omóplatos.','Frená un segundo arriba con la espalda apretada.','Bajá controlado en 2 segundos hasta estirar los brazos, sin redondear la espalda.'],
    cues:['Codos hacia el techo detrás tuyo.','El torso es una mesa: no sube ni baja con cada rep.'],
    errs:['Levantar el torso en cada rep para subir más peso: se vuelve un tirón con impulso.','Espalda redondeada. Si pasa, bajá el peso.','Tirar con los brazos y no juntar los omóplatos.'],
    why:'Remo pesado con agarre neutro y más estable que el remo con barra. Elegilo si querés cargar mucho la espalda media sin tanto riesgo lumbar.',
    swaps:['barbell-row','chest-supported-row','cable-row','db-row'], yt:'remo en T con agarre triángulo técnica', img:'T-Bar_Row_with_Handle' },

  { id:'chest-supported-row', name:'Remo con mancuernas en banco inclinado', m:'espalda', m2:['biceps','hombros'], tp:['romboides','dorsal'], ts:['deltoides_post','biceps','redondo'], eq:'mancuernas', pat:'tiron-h', lvl:1, loc:'ambos', reps:[8,12], inc:2, rest:90, mode:'w',
    setup:['Banco inclinado a unos 30-45°. Acostate boca abajo con el pecho apoyado y la cabeza pasando el respaldo.','Puntas de los pies apoyadas en el piso.','Una mancuerna en cada mano, brazos colgando y palmas enfrentadas.'],
    go:['Juntá los omóplatos y tirá las mancuernas hacia los costados de la cadera, codos cerca del cuerpo.','Frená un segundo arriba apretando la espalda.','Bajá controlado en 2 segundos hasta estirar los brazos y dejar que los omóplatos se separen.'],
    cues:['El pecho no se despega del banco.','Codos hacia atrás, como metiéndolos en los bolsillos traseros.'],
    errs:['Despegar el pecho del banco para tirar con impulso.','Encoger los hombros hacia las orejas.','Bajar a medias: perdés el estiramiento de la espalda.'],
    why:'El banco sostiene el torso, así que la zona lumbar descansa y toda la carga va a la espalda. Gran opción si el remo inclinado te molesta la espalda baja.',
    swaps:['db-row','machine-row','cable-row'], yt:'remo con mancuernas pecho apoyado banco inclinado', img:'Dumbbell_Incline_Row' },

  { id:'single-arm-cable-row', name:'Remo en polea a una mano', m:'espalda', m2:['biceps','hombros'], tp:['dorsal','romboides'], ts:['biceps','deltoides_post','redondo'], eq:'polea', pat:'tiron-h', lvl:1, loc:'gym', reps:[10,12], inc:2.5, rest:60, mode:'w', unil:true,
    setup:['Polea baja con un estribo. Sentate con los pies en la plataforma y las rodillas apenas flexionadas.','Agarrá el estribo con una mano y sentate derecho, torso a 90° de las piernas.','Brazo estirado al frente, pecho alto; la otra mano en la cintura.'],
    go:['Tirá el codo hacia atrás y pegado al cuerpo hasta que la mano llegue al costado del abdomen.','Apretá la espalda un segundo con el omóplato bien atrás.','Volvé en 2 segundos dejando que el hombro se estire hacia adelante, sin inclinar el torso.','Terminá todas las reps de un lado y cambiá.'],
    cues:['Arrancá el movimiento con el omóplato, después el brazo.','El torso no gira: los hombros quedan mirando al frente.'],
    errs:['Girar el torso para ganar recorrido.','Inclinarse hacia atrás y adelante con cada rep.','Tirar con el bíceps sin llevar el codo atrás.'],
    why:'Cada lado trabaja por su cuenta y con más recorrido que con barra. Ideal para emparejar fuerza entre lados.',
    swaps:['db-row','cable-row','machine-row'], yt:'remo polea baja a una mano técnica', img:'Seated_One-arm_Cable_Pulley_Rows' },

  { id:'high-row-machine', name:'Remo alto en máquina', m:'espalda', m2:['biceps','hombros'], tp:['dorsal','romboides'], ts:['redondo','biceps','deltoides_post'], eq:'maquina', pat:'tiron-v', lvl:1, loc:'gym', reps:[8,12], inc:5, rest:90, mode:'w',
    setup:['Ajustá el asiento para llegar justo a las manijas con los brazos estirados hacia arriba.','Trabá los muslos con el rodillo, pecho alto.','Agarrá las manijas con las palmas al frente.'],
    go:['Bajá los omóplatos y tirá las manijas hacia abajo y atrás, llevando los codos hacia las costillas.','Frená un segundo abajo apretando la espalda.','Volvé en 2 segundos sin apoyar el peso en la pila, hasta estirar los brazos arriba.'],
    cues:['Codos hacia abajo y atrás, como cerrando un paraguas.','Pecho al frente todo el recorrido.'],
    errs:['Asiento muy alto: no llegás a estirar y perdés recorrido.','Echarse hacia atrás para mover el peso.','Apoyar el peso en la pila entre reps: se corta la tensión.'],
    why:'Un punto medio entre jalón y remo, con el recorrido guiado. Muy fácil de aprender y bueno para sumar volumen de dorsal sin cansar la zona lumbar.',
    swaps:['lat-pulldown','machine-row','close-pulldown'], yt:'remo alto en máquina hammer técnica', img:'Leverage_High_Row' },

  { id:'weighted-pullup', name:'Dominadas con lastre', m:'espalda', m2:['biceps','core'], tp:['dorsal'], ts:['redondo','biceps','romboides','braquial'], eq:'cuerpo', pat:'tiron-v', lvl:3, loc:'gym', reps:[4,8], inc:2.5, rest:180, mode:'bwplus',
    setup:['Colgá el disco o la mancuerna de un cinturón de lastre bien ajustado a la cadera.','Agarre al ancho de los hombros o un poco más, palmas al frente.','Colgate con los brazos estirados, hombros activos y piernas firmes para que el peso no se balancee.'],
    go:['Bajá los omóplatos y tirá los codos hacia abajo hasta que el mentón pase la barra.','Frená un segundo arriba con el pecho cerca de la barra.','Bajá en 2-3 segundos hasta estirar los brazos por completo.','Subí el lastre solo cuando completes el tope del rango con todas las reps limpias.'],
    cues:['Pecho a la barra.','Apretá glúteos y abdomen: el cuerpo es un bloque.'],
    errs:['Agregar lastre antes de hacer 10 dominadas limpias sin peso.','Balanceo y patadas para ganar impulso.','Soltarse de golpe abajo: el peso tira del hombro. Bajá controlado.'],
    why:'Para cuando las dominadas con tu peso ya te quedan cortas. Es avanzado: necesitás técnica sólida y hombros sanos.',
    swaps:['pullup','chinup','lat-pulldown'], yt:'dominadas con lastre técnica cinturón', img:'Weighted_Pull_Ups' },

  { id:'rack-pull', name:'Rack pull (peso muerto desde soportes)', m:'espalda', m2:['gluteos','isquios','antebrazos'], tp:['lumbares','trapecio_sup'], ts:['gluteo_mayor','isquios','dorsal','antebrazo_flex'], eq:'barra', pat:'cadera', lvl:2, loc:'gym', reps:[5,8], inc:5, rest:180, mode:'w',
    setup:['En una jaula, poné la barra sobre los soportes a la altura de las rodillas o apenas debajo.','Pies al ancho de la cadera, barra pegada a las piernas. Agarre al ancho de los hombros, con straps si se te escapa.','Cadera atrás, espalda recta, pecho arriba y brazos estirados.'],
    go:['Inspirá, apretá el abdomen y empujá el piso hasta quedar de pie, con la barra pegada a los muslos.','Arriba, cadera adelante y hombros atrás. No te tires hacia atrás.','Bajá controlado llevando la cadera atrás hasta apoyar la barra en los soportes, sin soltar la postura.'],
    cues:['Empujá el piso, no tires de la barra.','Barra pegada a los muslos todo el recorrido.'],
    errs:['Espalda redondeada al arrancar porque el peso es alto.','Hiperextender la zona lumbar arriba para terminar.','Dejar caer la barra en los soportes: daña la barra y la jaula.'],

  { id:'single-leg-extension', name:'Extensión de cuádriceps a una pierna', m:'cuadriceps', m2:[], tp:['cuadriceps','recto_femoral'], ts:[], eq:'maquina', pat:'aisl', lvl:1, loc:'gym', reps:[10,15], inc:5, rest:60, mode:'w', unil:true,

  { id:'sissy-squat', name:'Sentadilla sissy', m:'cuadriceps', m2:['core'], tp:['cuadriceps','recto_femoral'], ts:['transverso'], eq:'cuerpo', pat:'aisl', lvl:3, loc:'ambos', reps:[8,15], inc:2.5, rest:90, mode:'bwplus',

    cues:['Hombros, cadera y rodillas en una línea recta.','Usá la mano solo para el equilibrio, no para tirar.'],
    errs:['Doblar la cadera y sentarte hacia atrás: se convierte en una sentadilla común.','Bajar de golpe: la rodilla sufre. El control es todo.','Hacerla con la rodilla dolorida. Si molesta, cambiá por la extensión de cuádriceps.'],
    why:'Aísla el cuádriceps con mucho estiramiento y sin máquina. Es exigente para la rodilla: dejala para cuando ya tengas una base de fuerza en piernas.',
    swaps:['leg-extension','single-leg-extension','goblet-squat'], yt:'sentadilla sissy técnica', img:'Weighted_Sissy_Squat' },

    setup:['Sentate con la espalda y la cola bien apoyadas en el respaldo.','Pies en el centro de la plataforma, casi juntos (a menos de un puño), puntas un poco hacia afuera.','Empujá la plataforma, sacá los seguros y quedate con las piernas estiradas sin trabar las rodillas.'],

  { id:'stiff-leg-deadlift', name:'Peso muerto piernas rígidas', m:'isquios', m2:['gluteos','espalda'], tp:['isquios'], ts:['gluteo_mayor','lumbares','antebrazo_flex'], eq:'barra', pat:'cadera', lvl:2, loc:'gym', reps:[8,12], inc:5, rest:150, mode:'w',
    setup:['De pie con la barra en las manos a la altura de los muslos, agarre en pronación al ancho de los hombros.','Pies al ancho de la cadera o un poco más juntos.','Rodillas casi estiradas, apenas flojas, y fijas en ese ángulo todo el ejercicio.'],
    go:['Inclinate desde la cadera con la espalda recta y bajá la barra cerca de las piernas.','Seguí bajando hasta sentir el estiramiento máximo de los isquios. Con buena flexibilidad, la barra llega a la altura de los pies.','Subí llevando la cadera hacia adelante hasta quedar derecho, sin tirar la espalda hacia atrás arriba.'],
    cues:['Las piernas son dos columnas: no se doblan.','Llevá el pecho hacia adelante, no hacia el piso.'],
    errs:['Redondear la espalda para llegar más abajo: el rango lo marca la flexibilidad, no el piso.','Doblar las rodillas a mitad de camino.','Hiperextender la espalda arriba.'],
    why:'Similar al peso muerto rumano pero con las rodillas más estiradas y más recorrido: más estiramiento de isquios. Si tu espalda se redondea antes de pasar las rodillas, quedate con el rumano.',
    swaps:['rdl','db-rdl','good-morning','leg-curl'], yt:'peso muerto piernas rígidas técnica', img:'Stiff-Legged_Barbell_Deadlift' },

  { id:'single-leg-rdl', name:'Peso muerto rumano a una pierna', m:'isquios', m2:['gluteos','core'], tp:['isquios','gluteo_mayor'], ts:['gluteo_medio','lumbares'], eq:'kettlebell', pat:'unilateral', lvl:2, loc:'ambos', reps:[8,12], inc:4, rest:90, mode:'w', unil:true,
    setup:['Agarrá una kettlebell (o mancuerna) con una mano, brazo colgando.','Pararte sobre una pierna con la rodilla apenas flexionada. Lo más estable es apoyarte en la pierna contraria a la mano que lleva el peso.','Cadera derecha, mirada a un punto fijo en el piso.'],
    go:['Inclinate desde la cadera y estirá la pierna libre hacia atrás, en línea con el torso.','Bajá hasta que el torso quede casi paralelo al piso o hasta sentir el estiramiento fuerte del isquio de apoyo.','Volvé a subir empujando la cadera hacia adelante y apretando el glúteo de la pierna de apoyo.','Hacé todas las reps de un lado y cambiá.'],
    cues:['Sos un subibaja: cabeza y talón de atrás se alejan.','La cadera mira al piso, no se abre hacia el costado.'],
    errs:['Abrir la cadera de la pierna libre: el torso rota y se pierde el trabajo.','Doblar mucho la rodilla de apoyo y hacer una sentadilla.','Ir rápido para no perder el equilibrio: bajá lento y, si hace falta, tocá una pared con la mano libre.'],
    why:'Trabaja isquios y glúteos de cada lado por separado y suma equilibrio y estabilidad de cadera. Con poco peso alcanza, así que es ideal en casa.',
    swaps:['db-rdl','rdl','single-leg-bridge','kb-swing'], yt:'peso muerto rumano a una pierna kettlebell técnica', img:'Kettlebell_One-Legged_Deadlift' },

  { id:'standing-leg-curl', name:'Curl femoral de pie a una pierna', m:'isquios', m2:['gemelos'], tp:['isquios'], ts:['gemelos'], eq:'maquina', pat:'aisl', lvl:1, loc:'gym', reps:[10,15], inc:5, rest:60, mode:'w', unil:true,
    setup:['Ajustá la máquina para que la rodilla de la pierna que trabaja quede alineada con el eje de giro.','El rodillo va apoyado justo arriba del talón, en la parte de atrás del tobillo.','Apoyá el muslo y el torso en los almohadones, inclinado hacia adelante, y agarrá las manijas.'],

    cues:['Llevá el talón a la cola.','La cadera quieta: solo se mueve la rodilla.'],
    errs:['Despegar el muslo o arquear la espalda para mover más peso.','Bajar de golpe y rebotar.','Rango corto: estirá casi del todo abajo.'],
    why:'Aísla los isquios de cada pierna por separado y permite emparejar diferencias. Alternativa a la máquina tumbada cuando querés trabajo unilateral.',
    swaps:['leg-curl','seated-leg-curl','ball-leg-curl'], yt:'curl femoral de pie una pierna máquina técnica', img:'Standing_Leg_Curl' },

  { id:'glute-ham-raise', name:'Glute-ham raise (GHD)', m:'isquios', m2:['gluteos','gemelos'], tp:['isquios'], ts:['gluteo_mayor','gemelos','lumbares'], eq:'maquina', pat:'aisl', lvl:3, loc:'gym', reps:[5,10], inc:2.5, rest:120, mode:'bwplus',
    setup:['Ajustá la máquina GHD: los pies trabados entre los rodillos y la placa, las rodillas justo detrás del almohadón.','Arrancá con el torso horizontal, mirando al piso, cuerpo recto de cabeza a rodillas.','Brazos cruzados en el pecho.'],
    go:['Empujá las puntas contra la placa y doblá las rodillas para llevar el torso hacia arriba.','Subí hasta quedar con el torso vertical, sin doblar la cadera. Apretá glúteos.','Bajá controlado en 3 segundos hasta la posición horizontal.','Si no llegás arriba, ayudate empujando con las manos en el almohadón o hacé solo la bajada lenta.'],

  { id:'single-leg-bridge', name:'Puente de glúteos a una pierna', m:'gluteos', m2:['isquios','core'], tp:['gluteo_mayor'], ts:['isquios','gluteo_medio'], eq:'cuerpo', pat:'cadera', lvl:1, loc:'ambos', reps:[10,15], inc:0, rest:60, mode:'bw', unil:true,

const PLATES = [[25, '#E4433B', 60], [20, '#2F6FED', 56], [15, '#F2C230', 50], [10, '#2EAA5B', 44], [5, '#E6E9EF', 36], [2.5, '#E4433B', 26], [1.25, '#B8C0CC', 20]];
function platesFor(total, bar) { let side = (total - bar) / 2; const out = []; if (side <= 0) return out; PLATES.forEach(([kg, col, h]) => { while (side >= kg - 1e-9) { out.push([kg, col, h]); side -= kg; } }); return out; }
// Barra cargada: dibuja los discos reales por lado
function barbellSvg(total, opts) {
  opts = opts || {}; const bar = opts.bar || 20; const ps = platesFor(total, bar);
  const W = 260, H = 76, cy = 38; let x = 22; let inner = '';
  // sleeve izquierdo
  inner += '<rect x="6" y="' + (cy - 4) + '" width="16" height="8" rx="2" fill="#8B857D"/>';
  const drawSide = (dir) => { let s = ''; let cx = dir < 0 ? 96 : 164; ps.forEach(([kg, col, h]) => { const w = kg >= 10 ? 9 : kg >= 5 ? 7 : 6; const px = dir < 0 ? cx - w : cx; s += '<rect x="' + px + '" y="' + (cy - h / 2) + '" width="' + w + '" height="' + h + '" rx="2" fill="' + col + '" stroke="rgba(0,0,0,.35)" stroke-width="1"/>'; if (kg >= 10) s += '<text x="' + (px + w / 2) + '" y="' + (cy + 3) + '" text-anchor="middle" font-size="7" font-weight="700" fill="rgba(0,0,0,.55)" font-family="Anton,sans-serif">' + kg + '</text>'; cx += dir * (w + 1.5); }); return s; };
  inner += '<rect x="22" y="' + (cy - 3.5) + '" width="216" height="7" rx="3" fill="#9B958D"/>';
  inner += '<rect x="96" y="' + (cy - 6) + '" width="4" height="12" rx="1" fill="#5A554F"/><rect x="160" y="' + (cy - 6) + '" width="4" height="12" rx="1" fill="#5A554F"/>';
  inner += '<rect x="100" y="' + (cy - 2.5) + '" width="60" height="5" rx="2" fill="#B8B1A7"/>';
  inner += drawSide(-1) + drawSide(1);
  inner += '<rect x="238" y="' + (cy - 4) + '" width="16" height="8" rx="2" fill="#8B857D"/>';
  const lbl = ps.length ? ps.map(p => p[0]).join(' + ') + ' por lado' : (bar && total <= bar ? 'barra sola' : '');
  return '<div class="bbwrap"><svg viewBox="0 0 ' + W + ' ' + H + '" class="bb">' + inner + '</svg>' + (opts.label !== false ? '<div class="bblbl">' + lbl + (opts.rest > 0.01 ? ' · sobran ' + fmtW(opts.rest) + ' kg' : '') + '</div>' : '') + '</div>';
}
function dumbbellSvg(w) {
  return '<svg viewBox="0 0 120 56" class="dbv"><rect x="40" y="24" width="40" height="8" rx="3" fill="#9B958D"/><rect x="18" y="10" width="22" height="36" rx="5" fill="#3A3530" stroke="rgba(255,255,255,.12)"/><rect x="80" y="10" width="22" height="36" rx="5" fill="#3A3530" stroke="rgba(255,255,255,.12)"/><rect x="8" y="16" width="10" height="24" rx="3" fill="#24201C"/><rect x="102" y="16" width="10" height="24" rx="3" fill="#24201C"/><text x="29" y="33" text-anchor="middle" font-size="12" font-weight="700" fill="#F4EEE6" font-family="Anton,sans-serif">' + fmtW(w) + '</text><text x="91" y="33" text-anchor="middle" font-size="12" font-weight="700" fill="#F4EEE6" font-family="Anton,sans-serif">' + fmtW(w) + '</text></svg>';
}
function stackSvg(w, step) {
  step = step || 5; const n = 10; const idx = Math.min(n - 1, Math.max(0, Math.round(w / step) - 1));
  let s = '<svg viewBox="0 0 80 96" class="stk">'; s += '<rect x="36" y="2" width="3" height="92" fill="#5A554F"/><rect x="42" y="2" width="3" height="92" fill="#5A554F"/>';
  for (let i = 0; i < n; i++) { const y = 8 + i * 8.6; const on = i <= idx; s += '<rect x="18" y="' + y + '" width="46" height="7" rx="1.5" fill="' + (on ? 'var(--acc)' : '#2A2622') + '" opacity="' + (on ? (i === idx ? 1 : .55) : 1) + '"/>'; }
  s += '<rect x="60" y="' + (8 + idx * 8.6 - 1) + '" width="14" height="9" rx="2" fill="#F4EEE6"/><text x="41" y="' + (8 + idx * 8.6 + 5.5) + '" text-anchor="middle" font-size="6.5" font-weight="700" fill="#140600" font-family="Anton,sans-serif">' + fmtW(w) + '</text>';
  return s + '</svg>';
}
// Visual del objetivo según equipo
function loadVisual(e, w) {
  if (!w || w <= 0) return '';
  if (e.eq === 'barra') { const ps = platesFor(w, 20); const rest = (w - 20) / 2 - ps.reduce((a, p) => a + p[0], 0); return '<div class="bbwrap">' + heroBar(w, 20) + (rest > 0.01 ? '<div class="bblbl">sobran ' + fmtW(rest) + ' kg por lado</div>' : '') + '</div>'; }
  if (e.eq === 'mancuernas') return '<div class="bbwrap">' + dumbbellSvg(w) + '<div class="bblbl">' + fmtW(w) + ' kg por mano</div></div>';
  if (e.eq === 'maquina' && e.inc >= 10) { const ps = platesFor(w, 0); const rest = w / 2 - ps.reduce((a, p) => a + p[0], 0); return '<div class="bbwrap">' + heroBar(w, 0) + (rest > 0.01 ? '<div class="bblbl">sobran ' + fmtW(rest) + ' kg por lado</div>' : '') + '</div>'; }
  if (e.eq === 'maquina' || e.eq === 'polea') return '<div class="bbwrap row" style="gap:12px;justify-content:center">' + stackSvg(w, e.inc > 0 ? e.inc : 5) + '<div class="bblbl" style="margin:0">pin en ' + fmtW(w) + ' kg</div></div>';
  return '';
}

  const d = weekData(ws); const done = load('gb2_missions', {})[ws] || {};
  return picks.map(m => { const [v, t] = m.prog(d); return { ...m, v, t, pct: Math.min(1, v / t), done: !!done[m.id] || v >= t, awarded: !!done[m.id] }; });
}
function missionXp() { const M = load('gb2_missions', {}); let x = 0; Object.values(M).forEach(w => Object.values(w).forEach(v => x += v)); return x; }
function awardMissions() {
  const ws = weekStart(today()); const M = load('gb2_missions', {}); M[ws] = M[ws] || {}; const fresh = [];
  weekMissions(ws).forEach(m => { if (m.v >= m.t && !M[ws][m.id]) { M[ws][m.id] = m.xp; fresh.push(m); } });
  if (fresh.length) save('gb2_missions', M); return fresh;
}
