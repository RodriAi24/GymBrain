}

const LEARN_DATA = {"GLOSS": {"compuesto": {"title": "Ejercicio Compuesto", "text": "Movimiento que usa varias articulaciones y músculos a la vez. Ejemplo: en la sentadilla movés caderas, rodillas y tobillos. Son los que más fuerza y músculo construyen."}, "aislamiento": {"title": "Ejercicio de Aislamiento", "text": "Movimiento que usa una sola articulación y se enfoca en un músculo. Ejemplo: el curl de bíceps solo mueve el codo. Ideal para rematar un músculo después de los compuestos."}, "hipertrofia": {"title": "Hipertrofia", "text": "Crecimiento del tamaño del músculo. Se logra principalmente con 6-12 repeticiones, esfuerzo alto y volumen suficiente. Es el objetivo principal de la mayoría en el gym."}, "emg": {"title": "EMG (Electromiografía)", "text": "Técnica científica que mide la activación eléctrica de un músculo durante un ejercicio. Nos dice qué ejercicios activan más cada músculo. Es la base de la \"evidencia\" que mencionamos."}, "rpe": {"title": "RPE (Esfuerzo Percibido)", "text": "Escala del 1 al 10 de qué tan difícil fue una serie. RPE 7 = podrías haber hecho 3 reps más. RPE 10 = no podías hacer ni una más (fallo). Para hipertrofia, RPE 7-9 es ideal."}, "rir": {"title": "RIR (Reps en Reserva)", "text": "Cuántas repeticiones más podrías haber hecho. RIR 2 = paraste faltándote 2 reps para el fallo. Es lo opuesto del RPE. Para hipertrofia, RIR 1-3 es ideal."}, "fallo": {"title": "Fallo Muscular", "text": "Cuando no podés completar otra repetición con buena forma. Es útil en series finales y aislamiento, pero NO en cada serie de compuestos — eso genera demasiada fatiga sin beneficio extra."}, "supinacion": {"title": "Supinación", "text": "Rotación de la mano para que la palma mire hacia arriba/adelante. En curls, supinar activa más el bíceps. Agarre supino = palmas arriba."}, "pronacion": {"title": "Pronación", "text": "Rotación de la mano para que la palma mire hacia abajo/atrás. Agarre prono = palmas abajo. Se usa en dominadas y remos."}, "escapulas": {"title": "Escápulas (Omóplatos)", "text": "Los huesos planos de la espalda alta. \"Retraer las escápulas\" = juntar los omóplatos como si quisieras apretar un lápiz entre ellos. Es clave para proteger los hombros en press y remos."}, "dorsal": {"title": "Dorsal Ancho", "text": "El músculo más grande de la espalda. Va desde la axila hasta la cintura. Es el que te da la forma de \"V\". Se trabaja con dominadas, remos y jalones."}, "deltoides": {"title": "Deltoides (Hombro)", "text": "El músculo del hombro. Tiene 3 partes: anterior (frente, trabaja en press), medio (costado, trabaja en laterales — da el ancho) y posterior (atrás, trabaja en face pulls)."}, "pectoral": {"title": "Pectoral (Pecho)", "text": "Tiene dos partes: el pectoral mayor (la parte grande, se trabaja con press plano) y el pectoral clavicular o \"pecho superior\" (se trabaja con press inclinado a 30°)."}, "isquiotibiales": {"title": "Isquiotibiales", "text": "Los músculos de la parte de atrás del muslo. Van desde la cadera hasta la rodilla. Se trabajan con peso muerto rumano (estiramiento) y curl de piernas (contracción)."}, "cuadriceps": {"title": "Cuádriceps", "text": "Los músculos de la parte de adelante del muslo. Son 4 músculos que extienden la rodilla. Se trabajan con sentadilla, prensa y extensiones."}, "core": {"title": "Core", "text": "Todo el centro del cuerpo: abdominales, oblicuos, espalda baja, piso pélvico. Su función principal es ESTABILIZAR — resistir movimiento, no crearlo. Por eso los ejercicios anti-rotación son mejores que los crunches."}, "volumen": {"title": "Volumen de Entrenamiento", "text": "La cantidad total de trabajo: series × reps × peso. Para hipertrofia, 10-20 series por músculo por semana es lo recomendado. Más no siempre es mejor — la recuperación importa."}, "frecuencia": {"title": "Frecuencia", "text": "Cuántas veces por semana entrenás cada músculo. 2x por semana es generalmente óptimo para hipertrofia. 1x puede funcionar con suficiente volumen por sesión."}, "negativa": {"title": "Fase Negativa (Excéntrica)", "text": "La parte del ejercicio donde bajás el peso / el músculo se estira bajo tensión. Ejemplo: bajar la barra en bench press. Es la fase que más daño muscular genera y más contribuye al crecimiento. Controlála siempre."}, "concentrica": {"title": "Fase Concéntrica", "text": "La parte del ejercicio donde subís el peso / el músculo se acorta. Ejemplo: empujar la barra hacia arriba en bench press."}, "espalda_neutra": {"title": "Espalda Neutra", "text": "La curvatura natural de la columna — ni redondeada ni sobre-arqueada. Mantenerla durante ejercicios como peso muerto y sentadilla protege los discos. Pensá en \"pecho arriba, cola hacia atrás\"."}, "progressive_overload": {"title": "Sobrecarga Progresiva", "text": "El principio #1: para crecer, el músculo necesita un estímulo mayor cada vez. Puede ser más peso, más reps, más series, mejor técnica o menos descanso. Sin esto, no hay progreso."}, "rom": {"title": "Rango de Movimiento (ROM)", "text": "Qué tanto movés una articulación durante un ejercicio. Rango completo = más estiramiento, más activación, más crecimiento. Nunca sacrifiques rango por usar más peso."}, "deload": {"title": "Deload (Semana de Descarga)", "text": "Semana con menos peso/volumen (50-60% de lo normal) para que el cuerpo se recupere. Hacéla cada 4-8 semanas o cuando te sentís estancado, cansado o con dolores. No es perder el tiempo — es invertir en recuperación."}, "tempo": {"title": "Tempo", "text": "La velocidad de cada fase del movimiento, escrito como 4 números (ej: 3-1-2-0). Primero la bajada, después la pausa abajo, después la subida, y la pausa arriba. Controlar el tempo aumenta el tiempo bajo tensión."}, "mfv": {"title": "MFV (Máximo Volumen Recuperable)", "text": "La cantidad máxima de series que un músculo puede hacer por semana y aún recuperarse. Pasarte del MFV = acumular fatiga sin beneficio. Cada persona tiene un MFV diferente — empezá bajo y subí gradualmente."}, "superavit": {"title": "Superávit Calórico", "text": "Comer más calorías de las que gastás. Necesario para ganar músculo (bulk). Un superávit moderado de 200-300 kcal minimiza la ganancia de grasa mientras permite construir músculo."}, "deficit": {"title": "Déficit Calórico", "text": "Comer menos calorías de las que gastás. Necesario para perder grasa (cut). Un déficit de 300-500 kcal preserva músculo mientras perdés grasa. Déficits más agresivos arriesgan pérdida muscular."}, "bulk": {"title": "Bulk (Fase de Volumen)", "text": "Período donde comés en superávit calórico para maximizar ganancia muscular. Lean bulk (superávit leve) es más lento pero ganás menos grasa. Dirty bulk (comer de todo) es más rápido pero ganás más grasa."}, "cut": {"title": "Cut (Fase de Definición)", "text": "Período donde comés en déficit calórico para perder grasa manteniendo el músculo. Requiere proteína alta (2g/kg), entrenamiento pesado, y paciencia. No hagas déficits extremos."}, "recomp": {"title": "Recomposición Corporal", "text": "Ganar músculo y perder grasa al mismo tiempo. Posible en principiantes, personas con sobrepeso, o al volver después de un descanso. Es más lento que bulk/cut pero funciona sin fases."}, "pump": {"title": "Pump (Congestión)", "text": "La sensación de hinchazón y dureza en el músculo durante/después de entrenar. Se produce por acumulación de sangre y fluidos. Se siente genial pero NO es indicador directo de crecimiento — es solo un efecto temporal."}, "doms": {"title": "DOMS (Agujetas)", "text": "Dolor muscular que aparece 24-72 horas después de entrenar. Es normal en principiantes o cuando hacés algo nuevo. NO es indicador de buen entrenamiento — con el tiempo disminuye aunque sigas progresando."}, "periodizacion": {"title": "Periodización", "text": "Organizar el entrenamiento en bloques con diferentes objetivos (fuerza, hipertrofia, deload). Permite progresión a largo plazo evitando estancamiento y sobreentrenamiento. La forma más simple: 3-4 semanas de progresión + 1 semana de deload."}, "mind_muscle": {"title": "Conexión Mente-Músculo", "text": "Concentrarte en sentir el músculo que estás trabajando durante cada repetición. Estudios muestran que mejora la activación muscular, especialmente en ejercicios de aislamiento. Pensá en el músculo, no en mover el peso."}}, "METHODS": [{"id": "dropset", "name": "Drop Sets", "icon": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"22 17 13.5 8.5 8.5 13.5 2 7\"/><polyline points=\"16 17 22 17 22 11\"/><\/svg>", "diff": "intermediate", "desc": "Hacés una serie hasta no poder más, bajás el peso 20-30% y seguís sin descanso. Repetí 2-3 veces.", "detail": "Ideal para el último ejercicio de un músculo. Genera mucho estrés metabólico (la \"quemadura\") que estimula crecimiento. Cada drop recluta más fibras musculares para compensar la fatiga. Usá en aislamiento, no en compuestos pesados.", "example": "Curl con mancuernas: 15kg x hasta no poder → 10kg x hasta no poder → 7kg x hasta no poder. Sin descanso entre drops.", "example2": "Extensiones de cuádriceps: 50kg x 10 → 35kg x 8 → 20kg x 10. Todo seguido.", "when": "Usalo en la última serie del último ejercicio para un músculo. Ideal en máquinas donde cambiar peso es rápido. Evitá en sentadilla o peso muerto."}, {"id": "restpause", "name": "Rest-Pause", "icon": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect width=\"4\" height=\"16\" x=\"6\" y=\"4\"/><rect width=\"4\" height=\"16\" x=\"14\" y=\"4\"/><\/svg>", "diff": "intermediate", "desc": "Hacés una serie hasta no poder más, descansás 10-15 seg, y seguís. Repetí 2-3 veces.", "detail": "Te permite hacer más repeticiones con el MISMO peso. Es como comprimir 3 series en 1 con micro-descansos — tu cuerpo recupera algo de ATP (energía rápida) pero el músculo sigue fatigado. Muy eficiente en tiempo.", "example": "Prensa de piernas: 100kg x 10 (no das más) → 15 seg → 100kg x 4 → 15 seg → 100kg x 2-3.", "example2": "Pushdowns de tríceps: 30kg x 12 → 15 seg → x5 → 15 seg → x3.", "when": "Ideal cuando tenés poco tiempo. Funciona en ejercicios de aislamiento o máquinas. Evitá donde la fatiga es peligrosa (sentadilla, peso muerto)."}, {"id": "myoreps", "name": "Myo-Reps", "icon": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8\"/><path d=\"M3 3v5h5\"/><\/svg>", "diff": "intermediate", "desc": "Una serie larga de 12-20 reps, luego mini-series de 3-5 reps con 5 seg de descanso.", "detail": "Cada mini-serie arranca con el músculo ya cansado, así que TODAS las reps son \"reps efectivas\" (las últimas 5 antes del fallo son las que más estimulan crecimiento). Parás cuando no llegás a 3 reps. Es la técnica más eficiente según la investigación de Borge Fagerli.", "example": "Laterales: 10kg x 15 → 5 seg → x5 → 5 seg → x5 → 5 seg → x4 → x3 (parás).", "example2": "Curl de piernas: 40kg x 18 → 5 seg → x5 → 5 seg → x5 → 5 seg → x4 → 5 seg → x3.", "when": "Perfecto para ejercicios de aislamiento al final del entrenamiento. También para casa donde tenés peso limitado."}, {"id": "superset", "name": "Superseries", "icon": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71\"/><path d=\"M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71\"/><\/svg>", "diff": "beginner", "desc": "Dos ejercicios seguidos sin descanso. Pueden ser del mismo músculo o de músculos opuestos.", "detail": "Músculos opuestos (ej: bíceps + tríceps) ahorra tiempo sin perder rendimiento — mientras uno trabaja, el otro descansa. Del mismo músculo (ej: press + apertura) genera más fatiga para hipertrofia. La primera opción es mejor para eficiencia.", "example": "Antagonista: Press de banca x 10 → Remo con barra x 10 → descanso 90 seg → repetir.", "example2": "Mismo músculo: Press inclinado x 10 → Aperturas en polea x 12 → descanso 90 seg → repetir.", "when": "Usá superseries antagonistas (músculos opuestos) cuando tenés poco tiempo. Superseries del mismo músculo solo al final del entrenamiento para generar máxima fatiga."}, {"id": "tempo", "name": "Tempo Training", "icon": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 22h14\"/><path d=\"M5 2h14\"/><path d=\"M17 22v-4.172a2 2 0 0 0-.586-1.414L12 12l-4.414 4.414A2 2 0 0 0 7 17.828V22\"/><path d=\"M7 2v4.172a2 2 0 0 0 .586 1.414L12 12l4.414-4.414A2 2 0 0 0 17 6.172V2\"/><\/svg>", "diff": "beginner", "desc": "Controlás la velocidad de cada parte del movimiento con un conteo específico.", "detail": "Se escribe como 4 números: ej. 3-1-2-0 = 3 seg bajando, 1 seg pausa abajo, 2 seg subiendo, 0 pausa arriba. Aumenta el tiempo bajo tensión sin necesitar más peso. Ideal para aprender control y para entrenar en casa con peso limitado.", "example": "Sentadilla tempo 3-1-2-0: bajás contando 3, pausás 1 seg abajo, subís contando 2, arriba directo.", "example2": "Flexiones tempo 4-2-1-0: bajás contando 4, aguantás 2 seg abajo, subís explosivo, arriba directo. Sentís el pecho trabajar el triple.", "when": "Ideal para principiantes que necesitan mejorar técnica. También para entrenamiento en casa cuando el peso disponible es poco — el tempo compensa."}, {"id": "cluster", "name": "Cluster Sets", "icon": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect width=\"7\" height=\"7\" x=\"3\" y=\"3\" rx=\"1\"/><rect width=\"7\" height=\"7\" x=\"14\" y=\"3\" rx=\"1\"/><rect width=\"7\" height=\"7\" x=\"14\" y=\"14\" rx=\"1\"/><rect width=\"7\" height=\"7\" x=\"3\" y=\"14\" rx=\"1\"/><\/svg>", "diff": "advanced", "desc": "Dividís una serie pesada en mini-series de 2-3 reps con 15-20 seg de descanso entre cada una.", "detail": "Te permite hacer más repeticiones con un peso pesado del que normalmente podrías. Tu cuerpo recupera algo de fosfocreatina (energía rápida) en esos 15-20 seg, pero el músculo sigue cargado. Excelente para ganar fuerza.", "example": "Sentadilla pesada: 2 reps → 20 seg → 2 reps → 20 seg → 2 reps = 6 reps totales con un peso que normalmente harías solo 3-4.", "example2": "Press de banca: 3 reps → 15 seg → 3 reps → 15 seg → 2 reps = 8 reps con tu peso de 5RM.", "when": "Solo para ejercicios compuestos pesados donde querés ganar fuerza: sentadilla, peso muerto, press de banca, press militar. Nunca en aislamiento — no tiene sentido."}, {"id": "mechanical", "name": "Mechanical Drop Set", "icon": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z\"/><\/svg>", "diff": "advanced", "desc": "En vez de bajar el peso, cambiás a una versión más fácil del mismo ejercicio.", "detail": "Aprovechás que distintas posiciones del cuerpo hacen el ejercicio más fácil o difícil. El músculo sigue trabajando pero con ventaja mecánica. No necesitás cambiar el peso. Es como hacer trampa de manera inteligente y controlada.", "example": "Bíceps: Curl inclinado (difícil) → sin descanso → Curl parado (más fácil) → sin descanso → Curl martillo (el antebrazo ayuda).", "example2": "Pecho: Aperturas en polea baja (difícil) → sin descanso → Aperturas en polea media (más fácil) → sin descanso → Press en polea (más fácil aún).", "when": "Úsalo como finisher de un grupo muscular. Requiere planificación — tené los ejercicios pensados de antemano. Mejor en poleas o máquinas donde no necesitás cambiar posición de pesos."}], "SUPPS": [{"id": "creatina", "name": "Creatina Monohidrato", "icon": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polygon points=\"13 2 3 14 12 14 11 22 21 10 12 10 13 2\"/><\/svg>", "verdict": "yes", "verdictLabel": "Recomendado", "oneliner": "El suplemento más estudiado del mundo. Funciona. Punto.", "what": "La creatina es una molécula que tu cuerpo ya produce naturalmente. Se almacena en los músculos como fosfocreatina y se usa para producir ATP (energía rápida) durante esfuerzos intensos y cortos. Suplementarla satura tus reservas al máximo.", "evidence": "Más de 500 estudios en humanos. Aumenta fuerza ~5-10%, masa muscular ~1-2kg en las primeras semanas (agua intramuscular + rendimiento), y mejora recuperación. También tiene beneficios cognitivos.", "when": "Todos los días, sin importar si entrenás o no. No necesita ciclarse (no hace falta dejar de tomarla).", "how": "5 gramos por día, todos los días. Mezclálo con agua, jugo, o lo que quieras. El timing no importa — mañana, noche, pre o post entreno, da igual.", "dose": "5g/día. La fase de carga (20g/día por 5 días) funciona pero no es necesaria — con 5g/día llegás al mismo punto en 3-4 semanas.", "extra": "No retiene agua subcutánea (debajo de la piel) — la retención es INTRAmuscular, lo que hace que el músculo se vea más lleno. No daña los riñones en personas sanas. La monohidrato es la más barata y la más estudiada — no necesitás versiones \"premium\"."}, {"id": "proteina", "name": "Proteína Whey", "icon": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M17 10v12H7V10l1.5-5.5A2 2 0 0 1 10.43 3h3.14a2 2 0 0 1 1.93 1.5L17 10Z\"/><line x1=\"7\" x2=\"17\" y1=\"10\" y2=\"10\"/><\/svg>", "verdict": "yes", "verdictLabel": "Recomendado", "oneliner": "La forma más práctica de llegar a tu objetivo de proteína diaria.", "what": "Proteína de suero de leche en polvo. Se absorbe rápido y tiene todos los aminoácidos esenciales en proporciones óptimas. No es mágica — es simplemente proteína en formato conveniente.", "evidence": "Evidencia sólida de que consumir 1.6-2.2g de proteína por kg de peso corporal optimiza la ganancia muscular. El whey no es superior a otras fuentes de proteína — la ventaja es la practicidad.", "when": "Cuando necesites completar tu ingesta diaria de proteína. Típicamente post-entreno o entre comidas. Pero el timing exacto no importa tanto como el total del día.", "how": "1-2 scoops (25-50g de proteína) mezclados con agua o leche. Podés agregarlo a avena, yogur, o hacer recetas.", "dose": "Lo que necesites para llegar a 1.6-2.2g/kg de peso corporal por día de PROTEÍNA TOTAL (comida + suplemento). Si pesás 75kg, necesitás ~120-165g de proteína por día.", "extra": "Concentrate (WPC) es más barato y funciona perfecto. Isolate (WPI) tiene menos lactosa. Si sos intolerante a la lactosa, probá isolate o proteína vegana. No es obligatorio — si llegás con comida, no lo necesitás."}, {"id": "cafeina", "name": "Cafeína", "icon": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M17 8h1a4 4 0 1 1 0 8h-1\"/><path d=\"M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4Z\"/><line x1=\"6\" x2=\"6\" y1=\"2\" y2=\"4\"/><line x1=\"10\" x2=\"10\" y1=\"2\" y2=\"4\"/><line x1=\"14\" x2=\"14\" y1=\"2\" y2=\"4\"/><\/svg>", "verdict": "yes", "verdictLabel": "Recomendado", "oneliner": "Mejora el rendimiento, la fuerza y la concentración. Y es barata.", "what": "La cafeína es un estimulante del sistema nervioso central. Bloquea los receptores de adenosina (la molécula que te da sueño), aumentando el estado de alerta y reduciendo la percepción de esfuerzo.", "evidence": "Fuerte evidencia de mejora en rendimiento de fuerza (~3-5%), resistencia (~2-4%), y potencia. Reduce la percepción de esfuerzo (sentís que el peso es más liviano). Funciona mejor si no la consumís a diario.", "when": "30-60 minutos antes de entrenar. Evitá después de las 14-16hs si te afecta el sueño (la cafeína tiene una vida media de 5-6 horas).", "how": "Un café negro, cápsulas de cafeína, o pre-workout. El efecto es el mismo.", "dose": "3-6mg por kg de peso corporal. Para alguien de 75kg: 225-450mg. Un café tiene ~80-100mg. Empezá bajo y subí. Si tomás café todos los días, vas a necesitar más para sentir el efecto ergogénico.", "extra": "La tolerancia se desarrolla rápido. Si querés maximizar el efecto en el gym, intentá no tomar café todos los días o ciclá la cafeína (2 semanas sí, 1 semana no). El sueño es más importante que cualquier pre-workout — nunca sacrifiques sueño por cafeína."}, {"id": "vitamina-d", "name": "Vitamina D3", "icon": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"4\"/><path d=\"M12 2v2\"/><path d=\"M12 20v2\"/><path d=\"m4.93 4.93 1.41 1.41\"/><path d=\"m17.66 17.66 1.41 1.41\"/><path d=\"M2 12h2\"/><path d=\"M20 12h2\"/><path d=\"m6.34 17.66-1.41 1.41\"/><path d=\"m19.07 4.93-1.41 1.41\"/><\/svg>", "verdict": "situational", "verdictLabel": "Situacional", "oneliner": "Esencial si no tomás suficiente sol. Y la mayoría no toma suficiente.", "what": "Vitamina que tu cuerpo produce cuando te exponés al sol. Es clave para huesos, sistema inmune, estado de ánimo, y niveles de testosterona. La mayoría de la gente tiene niveles subóptimos, especialmente en invierno.", "evidence": "Corregir deficiencia de vitamina D mejora fuerza muscular, reduce riesgo de lesiones, y puede mejorar niveles hormonales. Si tus niveles ya son óptimos, suplementar extra no da beneficios adicionales.", "when": "Con una comida que tenga grasa (es liposoluble — se absorbe mejor con grasa).", "how": "Cápsulas o gotas de vitamina D3 (no D2).", "dose": "1000-4000 UI/día. Ideal: hacete un análisis de sangre para medir tus niveles de 25-hidroxivitamina D. El rango óptimo es 30-50 ng/mL.", "extra": "Combiná con vitamina K2 si tomás dosis altas — ayuda a dirigir el calcio a los huesos y no a las arterias. Si vivís en latitudes altas o trabajás adentro todo el día, es casi seguro que la necesitás."}, {"id": "omega3", "name": "Omega 3 (EPA/DHA)", "icon": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M7 16.3c2.2 0 4-1.83 4-4.05 0-1.16-.57-2.26-1.71-3.19S7 6.36 7 4c0 2.36-1.15 4.16-2.29 5.06S3 11.1 3 12.25c0 2.22 1.8 4.05 4 4.05z\"/><path d=\"M17 20c2.2 0 4-1.83 4-4.05 0-1.16-.57-2.26-1.71-3.19S17 10 17 7.64c0 2.36-1.15 4.16-2.29 5.06S13 14.79 13 15.95c0 2.22 1.8 4.05 4 4.05z\"/><\/svg>", "verdict": "situational", "verdictLabel": "Situacional", "oneliner": "Antiinflamatorio natural. Útil si no comés pescado regularmente.", "what": "Ácidos grasos esenciales que tu cuerpo no puede producir. EPA y DHA son las formas activas. Se encuentran en pescados grasos (salmón, sardina, caballa). La mayoría de la gente no consume suficiente.", "evidence": "Reduce inflamación sistémica, mejora salud cardiovascular, puede mejorar recuperación muscular y reducir dolor articular. Los beneficios son más notables si tu dieta es baja en pescado.", "when": "Con comidas, preferiblemente con grasa.", "how": "Cápsulas de aceite de pescado o aceite de algas (opción vegana).", "dose": "1-3g de EPA+DHA combinados por día. Fijáte en la etiqueta: importa el contenido de EPA y DHA, no el total de aceite de pescado. Una cápsula de 1000mg de aceite puede tener solo 300mg de EPA+DHA.", "extra": "Si comés pescado graso 2-3 veces por semana, probablemente no lo necesitás. Guardálas en la heladera para evitar que se pongan rancias."}, {"id": "magnesio", "name": "Magnesio", "icon": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z\"/><\/svg>", "verdict": "situational", "verdictLabel": "Situacional", "oneliner": "Mineral esencial para sueño, recuperación y función muscular.", "what": "Mineral involucrado en más de 300 procesos del cuerpo: contracción muscular, producción de energía, síntesis de proteínas, y regulación del sistema nervioso. La mayoría de la gente no consume suficiente.", "evidence": "La deficiencia de magnesio (muy común) afecta el sueño, la recuperación, y puede causar calambres. Suplementar cuando hay deficiencia mejora calidad de sueño y recuperación muscular.", "when": "A la noche, 30-60 minutos antes de dormir. El magnesio tiene efecto relajante.", "how": "Cápsulas. Las mejores formas: glicinato (para sueño y relajación), citrato (buena absorción general), treonato (para función cognitiva).", "dose": "200-400mg de magnesio ELEMENTAL por día. Evitá óxido de magnesio — se absorbe mal y puede causar diarrea.", "extra": "El magnesio glicinato es la mejor opción para deportistas: buena absorción + el aminoácido glicina también ayuda al sueño. Si tenés diarrea con un tipo, probá otro."}, {"id": "melatonina", "name": "Melatonina", "icon": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z\"/><\/svg>", "verdict": "maybe", "verdictLabel": "Depende", "oneliner": "Puede ayudar con el sueño, pero no es una solución mágica.", "what": "Hormona que tu cuerpo produce naturalmente cuando oscurece. Le dice a tu cerebro que es hora de dormir. Suplementarla puede ayudar a inducir el sueño, especialmente si tu ritmo circadiano está desregulado.", "evidence": "Evidencia moderada para reducir el tiempo que tardás en dormirte (~7 min menos) y mejorar calidad del sueño. Más útil para jet lag, turnos rotativos, o personas que se duermen muy tarde. No es sedante — facilita el inicio del sueño.", "when": "30-60 minutos antes de dormir.", "how": "Comprimidos sublinguales o cápsulas.", "dose": "0.5-3mg. Empezá con la dosis más baja. Más NO es mejor — dosis altas (5-10mg) pueden causar somnolencia diurna, sueños vívidos, y empeorar el sueño.", "extra": "Antes de suplementar melatonina, aseguráte de tener buena higiene del sueño: oscuridad total, sin pantallas 1h antes, temperatura fresca, horario consistente. La melatonina no compensa malos hábitos."}], "CREATORS": [{"name": "Jeff Nippard", "yt": "https://www.youtube.com/@JeffNippard", "icon": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M10 2v7.31\"/><path d=\"M14 9.3V1.99\"/><path d=\"M8.5 2h7\"/><path d=\"M14 9.3a6.5 6.5 0 1 1-4 0\"/><line x1=\"5.52\" x2=\"18.48\" y1=\"16\" y2=\"16\"/><\/svg>", "spec": "Ciencia del entrenamiento", "desc": "Combina investigación científica con experiencia práctica. Sus videos explican la ciencia detrás de cada ejercicio y técnica con animaciones y referencias a estudios.", "best": "Ideal para entender el POR QUÉ detrás de cada decisión de entrenamiento."}, {"name": "Dr. Mike Israetel (Renaissance Periodization)", "yt": "https://www.youtube.com/@RenaissancePeriodization", "icon": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96.44 2.5 2.5 0 0 1-2.96-3.08 3 3 0 0 1-.34-5.58 2.5 2.5 0 0 1 1.32-4.24 2.5 2.5 0 0 1 1.98-3A2.5 2.5 0 0 1 9.5 2Z\"/><path d=\"M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96.44 2.5 2.5 0 0 0 2.96-3.08 3 3 0 0 0 .34-5.58 2.5 2.5 0 0 0-1.32-4.24 2.5 2.5 0 0 0-1.98-3A2.5 2.5 0 0 0 14.5 2Z\"/><\/svg>", "spec": "Hipertrofia y volumen", "desc": "Doctorado en fisiología del deporte. Su contenido sobre volumen de entrenamiento, periodización y recuperación es de lo mejor que existe. Estilo directo y sin rodeos.", "best": "El mejor para aprender sobre cuántas series hacer, cómo organizar el volumen, y cuándo hacer deload."}, {"name": "Jeff Cavaliere (Athlean-X)", "yt": "https://www.youtube.com/@atabornerican", "icon": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M22 12h-4l-3 9L9 3l-3 9H2\"/><\/svg>", "spec": "Prevención de lesiones", "desc": "Fisioterapeuta que trabajó con atletas profesionales de la MLB. Enfocado en entrenar de forma segura y eficiente, corrigiendo errores comunes que causan lesiones.", "best": "Mirá sus videos si tenés algún dolor o querés aprender a proteger las articulaciones."}, {"name": "John Meadows (Mountain Dog)", "yt": "https://www.youtube.com/@mountaindog1", "icon": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m8 3 4 8 5-5 5 15H2L8 3z\"/><\/svg>", "spec": "Técnicas de intensidad", "desc": "Culturista IFBB y creador de Mountain Dog Training. Especialista en técnicas avanzadas de intensidad y variaciones creativas de ejercicios. Lamentablemente falleció en 2021, pero su contenido sigue siendo oro.", "best": "Para intermedios/avanzados que buscan técnicas de intensidad y variaciones que el 99% no conoce."}, {"name": "Jeremy Ethier", "yt": "https://www.youtube.com/@JeremyEthier", "icon": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 1 0 2.829 2.828z\"/><path d=\"m3.928 16.088 14.536-14.536\"/><path d=\"M7.643 6.25l2.121 2.122\"/><path d=\"m14.007 12.614 2.122 2.121\"/><\/svg>", "spec": "Principiantes y técnica", "desc": "Kinesiólogo que hace videos extremadamente claros y bien producidos. Descompone la ciencia en pasos accionables y simples.", "best": "Si estás empezando, arrancá por acá. Sus videos de \"cómo hacer X correctamente\" son excelentes."}, {"name": "Squat University (Dr. Aaron Horschig)", "yt": "https://www.youtube.com/@SquatUniversity", "icon": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect width=\"8\" height=\"14\" x=\"8\" y=\"5\" rx=\"4\"/><path d=\"M12 2v3\"/><path d=\"M12 19v3\"/><\/svg>", "spec": "Movilidad y biomecánica", "desc": "Doctor en terapia física especializado en movimiento y movilidad. Contenido excepcional sobre sentadilla, movilidad de tobillo/cadera, y prevención de lesiones.", "best": "Si sentís rigidez, tenés problemas de movilidad, o querés mejorar tu técnica de sentadilla."}, {"name": "Eugene Teo", "yt": "https://www.youtube.com/@EugeneTeo", "icon": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 12c-2-2.67-4-4-6-4a4 4 0 1 0 0 8c2 0 4-1.33 6-4Zm0 0c2-2.67 4-4 6-4a4 4 0 1 1 0 8c-2 0-4-1.33-6-4Z\"/><\/svg>", "spec": "Conexión mente-músculo", "desc": "Entrenador australiano enfocado en la técnica perfecta y la conexión mente-músculo. Sus videos de \"cómo sentir X músculo\" son únicos en YouTube.", "best": "Para intermedios que quieren mejorar la calidad de cada repetición y sentir cada músculo trabajar."}], "WARMUP": {"general": {"title": "Calentamiento General (5 min)", "desc": "Hacé esto SIEMPRE antes de cualquier entrenamiento, sin importar qué músculo vas a trabajar.", "items": ["2-3 min de cardio leve: caminar rápido, bicicleta suave, jumping jacks, saltar la soga. El objetivo es elevar la temperatura corporal y el ritmo cardíaco.", "Rotaciones de cuello: 10 círculos para cada lado. Suave, sin forzar.", "Rotaciones de hombros: 10 hacia adelante, 10 hacia atrás. Círculos grandes.", "Rotaciones de cadera: 10 círculos para cada lado, como haciendo hula-hoop.", "Rotaciones de rodillas: juntá las rodillas, manos encima, 10 círculos para cada lado.", "Rotaciones de tobillos: 10 círculos cada pie."]}, "specific": {"title": "Calentamiento Específico", "desc": "Después del calentamiento general, hacé series progresivas del primer ejercicio del día antes de ir al peso de trabajo.", "items": ["Serie 1: Barra vacía o peso muy liviano × 15 reps (activar el movimiento)", "Serie 2: 40% del peso de trabajo × 10 reps (sentir el músculo)", "Serie 3: 60% del peso de trabajo × 6 reps (preparar el sistema nervioso)", "Serie 4: 80% del peso de trabajo × 3 reps (acercarse al peso objetivo)", "Después de esto: arrancá con tus series de trabajo normales."]}, "byMuscle": [{"muscle": "Pecho / Press", "items": ["Rotaciones de hombro con banda elástica × 15", "Retracción de escápulas (juntá y separás los omóplatos) × 15", "Dislocaciones con banda o palo × 10", "Press con barra vacía × 15 reps"]}, {"muscle": "Espalda / Tirón", "items": ["Colgarte de la barra 20-30 seg (descomprimir la columna)", "Rotaciones de hombro con banda × 15", "Jalón al pecho con poco peso × 15", "Remo liviano × 12"]}, {"muscle": "Hombros", "items": ["Rotaciones internas/externas con banda × 15 por lado", "Elevaciones laterales sin peso × 15", "Face pulls livianos × 15", "Press con mancuernas livianas × 12"]}, {"muscle": "Piernas / Sentadilla", "items": ["Sentadilla sin peso × 15 (profunda, controlada)", "Estocadas caminando sin peso × 10 por pierna", "Rotación de cadera abierta/cerrada × 10 por lado", "Elevaciones de gemelos × 15", "Si hacés sentadilla: series progresivas con barra vacía → 40% → 60% → 80%"]}, {"muscle": "Brazos", "items": ["Los brazos generalmente ya están calientes si entrenás después de pecho/espalda/hombros", "Si entrenás brazos solos: rotaciones de muñeca × 15, curl con banda liviana × 15, extensiones con banda × 15"]}]}, "LEARN": [{"id": "overload", "name": "Sobrecarga Progresiva", "icon": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"22 7 13.5 15.5 8.5 10.5 2 17\"/><polyline points=\"16 7 22 7 22 13\"/><\/svg>", "desc": "El principio #1 del entrenamiento. Sin esto, no crecés.", "content": "<p>La <span class=\"gterm\" onclick=\"showGloss('progressive_overload')\">sobrecarga progresiva<\/span> es el concepto más importante del entrenamiento. Significa que para que un músculo crezca, necesitás darle un estímulo mayor al que ya está acostumbrado.<\/p>\n    <p><strong>¿Cómo aplicarla?<\/strong> No siempre es agregar peso. Hay varias formas:<\/p>\n    <div class=\"learn-highlight\">\n    → <strong>Más peso:<\/strong> Agregar 1-2.5kg cuando podés completar todas las series en el rango alto de reps<br>\n    → <strong>Más reps:<\/strong> Si hacés 3×8 y la próxima sesión hacés 3×9, progresaste<br>\n    → <strong>Más series:<\/strong> Agregar 1 serie por semana si te sentís recuperado<br>\n    → <strong>Mejor técnica:<\/strong> Más rango de movimiento, más control, mejor conexión mente-músculo<br>\n    → <strong>Menos descanso:<\/strong> Hacer el mismo trabajo en menos tiempo\n    <\/div>\n    <p style=\"margin-top:10px\"><strong>Ejemplo práctico:<\/strong> Si esta semana hiciste press de banca 60kg × 3 series × 8 reps, la próxima sesión intentá 60kg × 3 × 9. Cuando llegues a 3×12, subí a 62.5kg y volvé a empezar desde 3×8.<\/p>"}, {"id": "volume", "name": "Volumen Semanal por Músculo", "icon": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 3v18h18\"/><rect width=\"4\" height=\"7\" x=\"7\" y=\"10\" rx=\"1\"/><rect width=\"4\" height=\"12\" x=\"15\" y=\"5\" rx=\"1\"/><\/svg>", "desc": "Cuántas series por semana necesita cada músculo para crecer.", "content": "<p>El <span class=\"gterm\" onclick=\"showGloss('volumen')\">volumen<\/span> es la cantidad de series efectivas que hacés por músculo por semana. Es uno de los factores más importantes para <span class=\"gterm\" onclick=\"showGloss('hipertrofia')\">hipertrofia<\/span>.<\/p>\n    <table class=\"learn-table\">\n    <tr><th>Músculo<\/th><th>Mínimo<\/th><th>Óptimo<\/th><th>Máximo<\/th><\/tr>\n    <tr><td>Pecho<\/td><td>10<\/td><td>12-16<\/td><td>20<\/td><\/tr>\n    <tr><td>Espalda<\/td><td>10<\/td><td>12-16<\/td><td>20<\/td><\/tr>\n    <tr><td>Hombros (lateral)<\/td><td>8<\/td><td>12-16<\/td><td>22<\/td><\/tr>\n    <tr><td>Bíceps<\/td><td>6<\/td><td>10-14<\/td><td>18<\/td><\/tr>\n    <tr><td>Tríceps<\/td><td>6<\/td><td>10-14<\/td><td>18<\/td><\/tr>\n    <tr><td>Cuádriceps<\/td><td>8<\/td><td>12-16<\/td><td>20<\/td><\/tr>\n    <tr><td>Isquiotibiales<\/td><td>6<\/td><td>10-14<\/td><td>16<\/td><\/tr>\n    <tr><td>Glúteos<\/td><td>4<\/td><td>8-12<\/td><td>16<\/td><\/tr>\n    <tr><td>Core<\/td><td>4<\/td><td>6-10<\/td><td>14<\/td><\/tr>\n    <tr><td>Gemelos<\/td><td>8<\/td><td>12-16<\/td><td>20<\/td><\/tr>\n    <\/table>\n    <p><strong>Importante:<\/strong> Estos números son de series DIRECTAS (ej: para bíceps, solo cuentan curls, no remos). Empezá en el mínimo y subí gradualmente. Si dejás de progresar o estás siempre cansado, estás haciendo demasiado. Hacé un <span class=\"gterm\" onclick=\"showGloss('deload')\">deload<\/span> cada 4-8 semanas.<\/p>"}, {"id": "frequency", "name": "Frecuencia: ¿Cuántas veces por semana?", "icon": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m17 2 4 4-4 4\"/><path d=\"M3 11v-1a4 4 0 0 1 4-4h14\"/><path d=\"m7 22-4-4 4-4\"/><path d=\"M21 13v1a4 4 0 0 1-4 4H3\"/><\/svg>", "desc": "Por qué entrenar cada músculo 2 veces por semana es ideal.", "content": "<p>La <span class=\"gterm\" onclick=\"showGloss('frecuencia')\">frecuencia<\/span> es cuántas veces por semana entrenás cada músculo. La ciencia dice:<\/p>\n    <div class=\"learn-highlight\">\n    <strong>2 veces por semana por músculo es óptimo para la mayoría.<\/strong>\n    <\/div>\n    <p style=\"margin-top:10px\"><strong>¿Por qué?<\/strong> La síntesis de proteína muscular (el proceso que construye músculo) dura 24-72 horas después de entrenar. Si entrenás un músculo solo 1 vez por semana, estás \"desperdiciando\" 4-5 días donde podrías estar estimulando crecimiento.<\/p>\n    <p><strong>Comparación práctica:<\/strong><\/p>\n    <div class=\"learn-highlight\">\n    <strong>1x/semana (Bro Split):<\/strong> 15 series en 1 sesión → Después de la serie 10, la fatiga baja la calidad<br><br>\n    <strong>2x/semana (PPL o Upper/Lower):<\/strong> 8 series × 2 sesiones = 16 series → Cada serie es de mayor calidad porque estás más fresco\n    <\/div>\n    <p style=\"margin-top:10px\"><strong>Excepciones:<\/strong> 1x/semana puede funcionar para avanzados con alto volumen por sesión (Bro Split). 3x/semana puede funcionar para principiantes con Full Body. Lo más importante es el volumen semanal total, no solo la frecuencia.<\/p>"}, {"id": "rpe-rir", "name": "RPE y RIR: ¿Qué tan fuerte entrenar?", "icon": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z\"/><\/svg>", "desc": "Cómo saber si estás entrenando lo suficiente (ni mucho ni poco).", "content": "<p>El <span class=\"gterm\" onclick=\"showGloss('rpe')\">RPE<\/span> (Esfuerzo Percibido) y <span class=\"gterm\" onclick=\"showGloss('rir')\">RIR<\/span> (Reps en Reserva) son escalas para medir qué tan cerca del <span class=\"gterm\" onclick=\"showGloss('fallo')\">fallo muscular<\/span> estás:<\/p>\n    <table class=\"learn-table\">\n    <tr><th>RPE<\/th><th>RIR<\/th><th>¿Cómo se siente?<\/th><\/tr>\n    <tr><td>6<\/td><td>4+<\/td><td>Cómodo. Podrías hacer muchas más.<\/td><\/tr>\n    <tr><td>7<\/td><td>3<\/td><td>Moderado. 3 reps más si te forzás.<\/td><\/tr>\n    <tr><td>8<\/td><td>2<\/td><td>Difícil. 2 reps más con buena forma.<\/td><\/tr>\n    <tr><td>9<\/td><td>1<\/td><td>Muy difícil. Tal vez 1 rep más.<\/td><\/tr>\n    <tr><td>10<\/td><td>0<\/td><td>Fallo total. No podés hacer ni una más.<\/td><\/tr>\n    <\/table>\n    <div class=\"learn-highlight\" style=\"margin-top:10px\">\n    <strong>La zona ideal para hipertrofia: RPE 7-9 (RIR 1-3)<\/strong><br>\n    Compuestos pesados: RPE 7-8 (RIR 2-3) → priorizá la técnica<br>\n    Aislamiento: RPE 8-10 (RIR 0-2) → podés ir más cerca del fallo\n    <\/div>"}, {"id": "nutrition", "name": "Nutrición Básica para Ganar Músculo", "icon": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M17 10v12H7V10l1.5-5.5A2 2 0 0 1 10.43 3h3.14a2 2 0 0 1 1.93 1.5L17 10Z\"/><line x1=\"7\" x2=\"17\" y1=\"10\" y2=\"10\"/><\/svg>", "desc": "Sin nutrición adecuada, el mejor entrenamiento del mundo no sirve.", "content": "<p>Entrenar rompe las fibras musculares. La nutrición las reconstruye más grandes. Sin suficiente proteína y calorías, estás girando en el vacío.<\/p>\n    <div class=\"learn-highlight\">\n    <strong>Los 3 pilares:<\/strong><br>\n    → <strong>Proteína:<\/strong> 1.6-2.2g por kg de peso corporal por día<br>\n    → <strong>Calorías:<\/strong> superávit leve de 200-300 kcal para ganar músculo (bulk), o déficit moderado de 300-500 kcal para perder grasa (cut)<br>\n    → <strong>Distribución:<\/strong> 3-5 comidas con proteína repartida en el día\n    <\/div>\n    <p style=\"margin-top:10px\"><strong>Ejemplo práctico (persona de 75kg):<\/strong><\/p>\n    <div class=\"learn-highlight\">\n    Proteína diaria: 120-165g<br>\n    Eso son ~30-40g por comida en 4 comidas<br>\n    1 pechuga de pollo = ~30g | 1 scoop whey = ~25g | 2 huevos = ~12g | 100g de carne = ~25g\n    <\/div>\n    <p style=\"margin-top:10px\"><strong>¿Y los carbohidratos y grasas?<\/strong> Los carbos son tu combustible para entrenar fuerte (arroz, avena, papa, frutas). Las grasas son esenciales para hormonas (aceite de oliva, palta, frutos secos). No elimines ninguno — ajustá las cantidades según tu objetivo.<\/p>\n    <p><strong>Lo más importante:<\/strong> la consistencia. Una dieta perfecta que seguís 3 días pierde contra una dieta \"buena\" que seguís 6 meses.<\/p>"}, {"id": "sleep", "name": "Sueño y Recuperación", "icon": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z\"/><\/svg>", "desc": "Crecés mientras dormís, no mientras entrenás.", "content": "<p>El entrenamiento es el estímulo. La comida es el material. El sueño es cuando tu cuerpo construye. Sin sueño de calidad, todo lo demás funciona a media máquina.<\/p>\n    <div class=\"learn-highlight\">\n    <strong>¿Qué pasa cuando dormís bien (7-9 horas)?<\/strong><br>\n    → Pico de hormona de crecimiento (GH) — repara y construye tejido muscular<br>\n    → Testosterona se restaura a niveles óptimos<br>\n    → El sistema nervioso se recupera — al día siguiente rendís mejor<br>\n    → Mejor sensibilidad a la insulina — los nutrientes van a donde deben\n    <\/div>\n    <div class=\"learn-highlight\" style=\"margin-top:10px;border-color:rgba(255,94,58,.3)\">\n    <strong>¿Qué pasa con poco sueño (<6 horas)?<\/strong><br>\n    → Testosterona baja hasta un 15% (equivalente a envejecer 10 años)<br>\n    → Cortisol elevado — destruye músculo y acumula grasa<br>\n    → Rendimiento en el gym cae un 10-30%<br>\n    → Más hambre y más antojos de comida basura (leptina/grelina desreguladas)\n    <\/div>\n    <p style=\"margin-top:10px\"><strong>Tips para dormir mejor:<\/strong><\/p>\n    <div class=\"learn-highlight\">\n    → Horario consistente (acostarte y levantarte a la misma hora)<br>\n    → Oscuridad total (cortinas blackout o antifaz)<br>\n    → Sin pantallas 30-60 min antes de dormir<br>\n    → Temperatura fresca (18-20°C ideal)<br>\n    → Cafeína cortada después de las 14hs<br>\n    → Magnesio glicinato antes de dormir puede ayudar\n    <\/div>\n    <p style=\"margin-top:10px\"><strong>Dato clave:<\/strong> una noche mala no arruina nada. Lo que importa es el patrón semanal. 5 de 7 noches durmiendo bien ya es un éxito.<\/p>"}, {"id": "beginner-mistakes", "name": "Errores Clásicos de Principiante", "icon": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><line x1=\"12\" x2=\"12\" y1=\"8\" y2=\"12\"/><line x1=\"12\" x2=\"12.01\" y1=\"16\" y2=\"16\"/><\/svg>", "desc": "Los errores que el 90% comete en sus primeros meses.", "content": "<p>Todos los cometimos. La diferencia es cuánto tardás en corregirlos.<\/p>\n    <div class=\"learn-highlight\">\n    <strong>1. Saltarse el calentamiento<\/strong><br>\n    \"No tengo tiempo\" → tenés tiempo para 3 meses de recuperación de un hombro lesionado? 5-10 minutos de calentamiento son el seguro más barato del gym.\n    <\/div>\n    <div class=\"learn-highlight\" style=\"margin-top:8px\">\n    <strong>2. Demasiado peso, poca técnica<\/strong><br>\n    El ego lifting es la epidemia del gym. Nadie en el mundo se impresiona por tu peso si tu forma es horrible. Bajá el peso, hacé el movimiento bien, y en 6 meses vas a mover más que ahora CON buena técnica.\n    <\/div>\n    <div class=\"learn-highlight\" style=\"margin-top:8px\">\n    <strong>3. Ignorar las piernas<\/strong><br>\n    Entrenar piernas libera más hormonas anabólicas que cualquier otro grupo. Salteártelas es literalmente frenar tu progreso en TODO el cuerpo.\n    <\/div>\n    <div class=\"learn-highlight\" style=\"margin-top:8px\">\n    <strong>4. Cambiar de rutina cada semana<\/strong><br>\n    La sobrecarga progresiva requiere consistencia. Si cambiás de ejercicios cada semana, nunca podés medir si estás progresando. Elegí una rutina y dale al menos 8-12 semanas.\n    <\/div>\n    <div class=\"learn-highlight\" style=\"margin-top:8px\">\n    <strong>5. Copiar al grande del gym<\/strong><br>\n    El tipo que hace 20 series de pecho con técnicas avanzadas lleva 10 años entrenando. Vos necesitás lo básico bien hecho, no lo avanzado mal hecho. Compuestos pesados + progresión = todo lo que necesitás el primer año.\n    <\/div>\n    <div class=\"learn-highlight\" style=\"margin-top:8px\">\n    <strong>6. No comer suficiente proteína<\/strong><br>\n    El error #1 fuera del gym. Si no llegás a 1.6g/kg, no importa qué tan bien entrenes. Medí tu proteína por una semana para tomar conciencia.\n    <\/div>\n    <div class=\"learn-highlight\" style=\"margin-top:8px\">\n    <strong>7. Esperar resultados en 2 semanas<\/strong><br>\n    Resultados reales visibles: 3-6 meses. El primer mes es adaptación neural (tu cerebro aprende a reclutar los músculos). La paciencia es la técnica de intensidad más poderosa que existe.\n    <\/div>"}, {"id": "when-to-increase", "name": "¿Cuándo Subir de Peso?", "icon": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"12\" x2=\"12\" y1=\"19\" y2=\"5\"/><polyline points=\"5 12 12 5 19 12\"/><\/svg>", "desc": "La regla de oro para progresar sin lesionarte.", "content": "<p>La pregunta más común del gym: \"¿ya puedo subir de peso?\" La respuesta es simple pero requiere disciplina:<\/p>\n    <div class=\"learn-highlight\">\n    <strong>La regla 2x2:<\/strong><br>\n    Subí de peso cuando puedas completar <strong>2 reps más<\/strong> de lo programado en las <strong>últimas 2 sesiones<\/strong> consecutivas.\n    <\/div>\n    <p style=\"margin-top:10px\"><strong>Ejemplo práctico:<\/strong><\/p>\n    <div class=\"learn-highlight\">\n    Tu programa dice: Press de banca 3×8-12 con 60kg<br><br>\n    Sesión 1: 60kg × 12, 12, 11 → bien, pero no las 3 en 12<br>\n    Sesión 2: 60kg × 12, 12, 12 → las 3 en el tope del rango<br>\n    Sesión 3: 60kg × 12, 12, 12 → segunda vez consecutiva<br>\n    <strong>→ Sesión 4: subí a 62.5kg y volvé a empezar desde 3×8<\/strong>\n    <\/div>\n    <p style=\"margin-top:10px\"><strong>¿Cuánto subir?<\/strong><\/p>\n    <div class=\"learn-highlight\">\n    → Tren superior (press, remos, curls): +2.5kg por salto<br>\n    → Tren inferior (sentadilla, peso muerto): +5kg por salto<br>\n    → Aislamiento chico (laterales, face pulls): +1-2kg o +2 reps<br>\n    → Bodyweight (dominadas, flexiones): +1-2 reps por sesión\n    <\/div>\n    <p style=\"margin-top:10px\"><strong>Errores comunes:<\/strong> subir demasiado rápido (la técnica se rompe), subir cuando no alcanzaste el rango en 2 sesiones seguidas (ego), o nunca subir por miedo (te estancás). La progresión no tiene que ser lineal — a veces una semana subís y la siguiente mantenés. Lo importante es la tendencia a largo plazo.<\/p>"}, {"id": "hormones", "name": "Hormonas: Lo que Funciona de Verdad", "icon": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96.44 2.5 2.5 0 0 1-2.96-3.08 3 3 0 0 1-.34-5.58 2.5 2.5 0 0 1 1.32-4.24 2.5 2.5 0 0 1 1.98-3A2.5 2.5 0 0 1 9.5 2Z\"/><path d=\"M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96.44 2.5 2.5 0 0 0 2.96-3.08 3 3 0 0 0 .34-5.58 2.5 2.5 0 0 0-1.32-4.24 2.5 2.5 0 0 0-1.98-3A2.5 2.5 0 0 0 14.5 2Z\"/><\/svg>", "desc": "El 90% de lo que ves en redes es humo. Acá va lo que dice la ciencia.", "content": "<div class=\"learn-highlight\" style=\"border-color:rgba(255,94,58,.4);background:rgba(255,94,58,.06)\">\n    <strong>AVISO IMPORTANTE:<\/strong> Esta sección NO promueve el uso de sustancias. La información es puramente educativa sobre cómo optimizar tus hormonas NATURALMENTE. Si sospechás un problema hormonal, consultá a un endocrinólogo, no a Instagram.\n    <\/div>\n    <p style=\"margin-top:12px\">La testosterona, la hormona de crecimiento y la insulina son las principales hormonas anabólicas. El 90% de los \"boosters de testosterona\" que se venden son puro marketing sin evidencia. Acá va lo que SÍ funciona:<\/p>\n    <div class=\"learn-highlight\" style=\"margin-top:10px\">\n    <strong>Lo que tiene EVIDENCIA FUERTE:<\/strong><br><br>\n    <strong>1. Dormir 7-9 horas<\/strong> — Una semana durmiendo 5h baja tu testosterona hasta un 15%. Es el factor #1 y el más ignorado. No hay suplemento que compense mal sueño.<br><br>\n    <strong>2. Entrenar pesado con compuestos<\/strong> — Sentadilla, peso muerto, press. El entrenamiento de fuerza con alta intensidad es el estímulo más potente para la producción hormonal.<br><br>\n    <strong>3. No tener déficit calórico extremo<\/strong> — Dietas de menos de 1200 kcal destruyen tus hormonas. Un déficit moderado (300-500 kcal) preserva la testosterona. Déficits agresivos la desploman.<br><br>\n    <strong>4. Manejar el estrés<\/strong> — El cortisol (hormona del estrés) es directamente antagonista de la testosterona. Estrés crónico = cortisol alto = testosterona baja. Meditación, caminatas, hobby — lo que te funcione.<br><br>\n    <strong>5. Vitamina D<\/strong> — SI estás deficiente (la mayoría lo está), corregirlo puede mejorar tus niveles de testosterona. Hacéte un análisis de sangre. 1000-4000 UI/día si estás bajo.<br><br>\n    <strong>6. Zinc y Magnesio<\/strong> — Solo si estás deficiente. No tienen efecto si ya tenés niveles normales. El zinc se encuentra en carne roja y mariscos. El magnesio en frutos secos y verduras de hoja.\n    <\/div>\n    <div class=\"learn-highlight\" style=\"margin-top:10px;border-color:rgba(255,94,58,.3)\">\n    <strong>Lo que NO funciona (a pesar del marketing):<\/strong><br><br>\n    → Tribulus terrestris — 0 evidencia en humanos<br>\n    → Fenogreco — mejoras mínimas e inconsistentes<br>\n    → D-ácido aspártico — efecto temporal e insignificante<br>\n    → Ashwagandha — puede reducir cortisol, pero el efecto en testosterona es modesto y variable<br>\n    → \"Testosterone boosters\" genéricos — si funcionaran, serían regulados como medicamentos\n    <\/div>\n    <p style=\"margin-top:10px\"><strong>La realidad:<\/strong> si dormís bien, comés bien, entrenás fuerte y manejás el estrés, tus hormonas van a estar donde tienen que estar. Si después de todo eso seguís con síntomas (fatiga extrema, libido baja, pérdida de masa muscular), hacéte un análisis hormonal completo con un endocrinólogo.<\/p>"}], "FAQ": [{"q": "¿Cuánta proteína necesito por día?", "a": "Entre 1.6 y 2.2 gramos por kilo de peso corporal. Si pesás 75kg, son 120-165g de proteína al día repartidos en 3-5 comidas. Priorizá comida real (carne, pollo, huevos, lácteos, legumbres) y completá con whey si no llegás."}, {"q": "¿Puedo entrenar todos los días?", "a": "Podés, pero no deberías entrenar el MISMO músculo todos los días. Cada músculo necesita 48-72 horas de recuperación. Entrenar 4-6 días por semana con una buena rutina (PPL, Upper/Lower) permite entrenar cada músculo 2 veces por semana con descanso suficiente."}, {"q": "¿El cardio mata las ganancias?", "a": "No, si lo hacés bien. Cardio moderado (caminar, bici suave) 2-3 veces por semana mejora la recuperación y la salud cardiovascular sin afectar la ganancia muscular. Lo que SÍ interfiere es correr maratones + intentar ganar músculo al mismo tiempo. Separá el cardio del entrenamiento de fuerza por al menos 6 horas si podés."}, {"q": "¿Cuánto tiempo debería durar mi entrenamiento?", "a": "45-75 minutos es el rango ideal para la mayoría. Más de 90 minutos suele indicar que descansás demasiado entre series o hacés demasiado volumen. La calidad importa más que la duración."}, {"q": "¿Es necesario llegar al fallo muscular?", "a": "No en cada serie. Entrenar a RPE 7-9 (1-3 reps antes del fallo) es suficiente para hipertrofia en la mayoría de los ejercicios. Llegar al fallo es útil en la última serie de ejercicios de aislamiento, pero en compuestos pesados aumenta el riesgo de lesión y la fatiga sin beneficio extra."}, {"q": "¿Sirve entrenar en ayunas?", "a": "No hay diferencia significativa para ganancia muscular o pérdida de grasa. Lo que importa es el total de calorías y proteína del día. Si te sentís bien entrenando en ayunas, dale. Si rendís mejor con algo en el estómago, comé. No hay magia."}, {"q": "¿Cuántas series por músculo por semana necesito?", "a": "Para hipertrofia: 10-20 series directas por músculo por semana. Empezá en 10-12 y subí gradualmente. Si dejás de progresar, agregá 1-2 series por semana. Si estás siempre cansado, restá. El volumen óptimo es individual."}, {"q": "¿Cuánto tiempo hasta ver resultados?", "a": "Primeras 4 semanas: adaptación neural (te sentís más fuerte sin cambios visibles). 2-3 meses: cambios visibles con buena luz y bomba. 6+ meses: cambios que los demás notan. La transformación real lleva 1-2 años de consistencia."}, {"q": "¿Necesito suplementos para ganar músculo?", "a": "No. Los suplementos son el 5% del resultado. El 95% es entrenamiento consistente, nutrición adecuada y buen sueño. Dicho eso, creatina (5g/día) y whey protein (si no llegás con comida) tienen evidencia sólida y son baratos."}, {"q": "¿Es mejor hacer más reps con menos peso o menos reps con más peso?", "a": "Ambos funcionan para hipertrofia si entrenás cerca del fallo. El rango de 6-12 reps es el más práctico: suficiente tensión mecánica + volumen sin fatiga excesiva. Pero rangos de 5-30 reps pueden generar hipertrofia si la intensidad es adecuada."}]};

// ═══ HELPERS ═══
const $ = id => document.getElementById(id);
const ex = id => EX.find(e => e.id === id);
const pad = n => (n < 10 ? '0' : '') + n;
const isoDate = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const today = () => isoDate(new Date());
const parseDate = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const DAYS = ['dom', 'lun', 'mar', 'mié', 'jue', 'vie', 'sáb'];
const MONTHS = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
const fmtD = s => { const d = parseDate(s); return DAYS[d.getDay()] + ' ' + d.getDate() + ' ' + MONTHS[d.getMonth()]; };
const fmtDshort = s => { const d = parseDate(s); return d.getDate() + ' ' + MONTHS[d.getMonth()]; };
const daysAgo = s => Math.round((parseDate(today()) - parseDate(s)) / 86400000);
const relDate = s => { const n = daysAgo(s); return n === 0 ? 'hoy' : n === 1 ? 'ayer' : n < 7 ? 'hace ' + n + ' días' : fmtD(s); };
const weekStart = s => { const d = parseDate(s); const w = (d.getDay() + 6) % 7; d.setDate(d.getDate() - w); return isoDate(d); };
const addDays = (s, n) => { const d = parseDate(s); d.setDate(d.getDate() + n); return isoDate(d); };
const fmtW = w => (Math.round(w * 100) / 100).toString().replace('.', ',');
const fmtK = n => n >= 1000 ? (Math.round(n / 100) / 10).toString().replace('.', ',') + ' t' : Math.round(n) + ' kg';
const fmtTon = n => n.toLocaleString('es-AR', { maximumFractionDigits: 0 });
const e1rm = (w, r) => (r <= 1 ? w : w * (1 + Math.min(r, 15) / 30));
const vib = (p = 30) => { if (navigator.vibrate) try { navigator.vibrate(p); } catch (e) {} };
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const roundTo = (w, step) => { step = step || 2.5; return Math.round(w / step) * step; };
const fmtTime = s => Math.floor(s / 60) + ':' + pad(s % 60);
function toast(msg, ms = 2200) { const t = $('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('on'), ms); }
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

function effDay(pid, did) {
  const p = prog(pid); if (!p) return null;

  c.width = innerWidth; c.height = innerHeight; const ctx = c.getContext('2d');

  const ps = []; for (let i = 0; i < 90; i++) ps.push({ x: c.width / 2 + (Math.random() - .5) * 120, y: c.height * .45, vx: (Math.random() - .5) * 14, vy: -Math.random() * 14 - 4, r: 4 + Math.random() * 5, c: cols[i % cols.length], a: Math.random() * 6 });
  let t = 0; (function f() { ctx.clearRect(0, 0, c.width, c.height); ps.forEach(p => { p.x += p.vx; p.vy += .35; p.y += p.vy; p.a += .1; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.c; ctx.fillRect(-p.r / 2, -p.r / 2, p.r, p.r * .6); ctx.restore(); }); if (++t < 110) requestAnimationFrame(f); else c.remove(); })();
}

  const xs = i => pl + i * (W - pl - pr) / (pts.length - 1); const ys = v => pt + (H - pt - pb) * (1 - (v - mn) / (mx - mn));
  s += '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" style="margin-top:8px"><text x="0" y="' + (pt + 4) + '">' + fmtW(Math.round(mx)) + '</text><text x="0" y="' + (H - pb) + '">' + fmtW(Math.round(mn)) + '</text><polyline class="ln" points="' + pts.map((p, i) => xs(i) + ',' + ys(p.w)).join(' ') + '"/>' + pts.map((p, i) => '<circle class="dot" cx="' + xs(i) + '" cy="' + ys(p.w) + '" r="2.5"/>').join('') + '<text x="' + pl + '" y="' + (H - 4) + '">' + fmtDshort(pts[0].d) + '</text><text x="' + (W - pr) + '" y="' + (H - 4) + '" text-anchor="end">' + fmtDshort(last.d) + '</text></svg>';
  return s;
}

  html += '<p class="small muted2" style="margin-top:16px">GymBrain · ' + APP_VERSION + ' · Chadbits. Tus datos viven solo en este teléfono. Ilustración anatómica: react-native-body-highlighter (MIT). Rangos de fuerza: orientativos, basados en tablas de estándares para hombres.</p>';

function setTheme(t) { S.theme = t; saveS(); document.documentElement.setAttribute('data-theme', t); const m = document.querySelector('meta[name=theme-color]'); if (m) m.content = t === 'dark' ? '#0A0F1C' : '#EEF2F6'; }

function exportData() {
  const data = { v: 2, exported: new Date().toISOString(), settings: S, sessions: SESSIONS, swaps: SWAPS, custom: CUSTOM, bw: BW, ach: load('gb2_ach', []) };
  const blob = new Blob([JSON.stringify(data)], { type: 'application/json' }); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'gymbrain-backup-' + today() + '.json'; a.click(); toast('Copia descargada');

function importData(file) {
  if (!file) return; const r = new FileReader();
  r.onload = () => { try { const d = JSON.parse(r.result); if (!d.sessions) throw 0; if (!confirm('Se van a reemplazar tus datos por los de la copia (' + d.sessions.length + ' sesiones). ¿Seguimos?')) return; S = { ...S, ...d.settings }; if (!S.starts) S.starts = {}; SESSIONS = d.sessions; SWAPS = d.swaps || {}; CUSTOM = d.custom || []; BW = d.bw || []; saveS(); saveSessions(); save(K.sw, SWAPS); save(K.cu, CUSTOM); save(K.bw, BW); save('gb2_ach', d.ach || []); closeSheet(); go('hoy'); toast('Copia importada'); } catch (e) { toast('Ese archivo no es una copia válida'); } };

function resetAll() { if (!confirm('¿Borrar TODO? Sesiones, rutinas, ajustes. No se puede deshacer.')) return; if (!confirm('Última: ¿seguro?')) return; Object.keys(localStorage).filter(k => k.startsWith('gb2_')).forEach(k => localStorage.removeItem(k)); location.reload(); }

function migrateLegacy() {
  const byDate = {};
  legacyKeys().forEach(k => { const id = k.slice(3); const a = load(k, []); if (!Array.isArray(a)) return; a.forEach(e => { if (!e.d) return; byDate[e.d] = byDate[e.d] || {}; (byDate[e.d][id] = byDate[e.d][id] || []).push({ w: +e.w || 0, r: +e.r || 0, t: e.t || 0 }); }); });
  let n = 0;
  Object.keys(byDate).sort().forEach(d => { const exs = Object.keys(byDate[d]).map(id => ({ id, sets: byDate[d][id].sort((a, b) => a.t - b.t).map(s => ({ w: s.w, r: s.r })) })); if (!exs.length) return; const ts = parseDate(d).getTime() + 12 * 3600000; const ton = exs.reduce((a, x) => a + x.sets.reduce((b, s) => b + s.w * s.r, 0), 0); SESSIONS.push({ id: 'legacy_' + d, date: d, start: ts, end: ts + 3600000, prog: 'legacy', day: 'V18', dayName: 'GymBrain V18', ex: exs, ups: [], prs: [], ton, note: '' }); n++; });
  saveSessions(); save('gb2_migrated', true); closeSheet(); go('progreso'); toast(n + ' sesiones importadas de la versión anterior');

  if (OB.step === 0) html = logo + dots + '<h1>Te dice qué levantar hoy. Y cuánto.</h1><p class="lead">Un programa con evidencia que se adapta a los días que vas, ejercicios explicados paso a paso y un motor que te avisa cuándo subir el peso. Sin humo, sin cuenta, sin pagar.</p><label class="lbl">¿Cómo te llamás? (opcional)</label><input class="inp" placeholder="Tu nombre" value="' + esc(OB.name) + '" oninput="OB.name=this.value"><button class="btn p w big" style="margin-top:20px" onclick="OB.step=1;renderOnboarding()">Empezar</button>';

  else if (OB.step === 2) html = logo + dots + '<h1>¿Cuánta experiencia tenés?</h1>' + [['nuevo', 'Empiezo de cero', 'Nunca entrené con pesas o muy poco.'], ['volviendo', 'Estoy volviendo', 'Entrené antes, dejé, y arranco de nuevo.'], ['exp', 'Entreno hace un tiempo', 'Ya conozco los ejercicios básicos.']].map(o => '<button class="opt ' + (OB.exp === o[0] ? 'on' : '') + '" onclick="OB.exp=\'' + o[0] + '\';renderOnboarding()"><b>' + o[1] + '</b><span>' + o[2] + '</span></button>').join('') + '<button class="btn p w big" style="margin-top:20px" onclick="OB.step=3;renderOnboarding()">Siguiente</button>';
  else { const pid = OB.goal >= 5 ? 'ppl' : (OB.goal === 4 && OB.exp === 'exp') ? 'ul' : 'fb'; const p = prog(pid); html = logo + dots + '<h1>¿Barra libre o máquinas y mancuernas?</h1><p class="lead">Las máquinas y mancuernas son más fáciles de aprender y rinden igual al principio. Podés cambiar cualquier ejercicio después.</p>' + [[false, 'Máquinas y mancuernas', 'Prensa, press con mancuernas, remo en máquina.'], [true, 'Barra libre', 'Sentadilla, banca, peso muerto rumano con barra.']].map(o => '<button class="opt ' + (OB.barbell === o[0] ? 'on' : '') + '" onclick="OB.barbell=' + o[0] + ';renderOnboarding()"><b>' + o[1] + '</b><span>' + o[2] + '</span></button>').join('') + '<div class="card" style="margin-top:18px;border-color:var(--acc)"><div class="small" style="color:var(--acc-ink);font-weight:600">Tu programa</div><h3 style="font-size:24px">' + esc(p.name) + '</h3><div class="small muted">' + esc(p.freq) + ' · ' + esc(p.dur) + '</div></div><button class="btn p w big" style="margin-top:14px" onclick="finishOnboarding(\'' + pid + '\')">Listo, vamos</button>'; }
  el.innerHTML = '<div class="ob">' + html + '</div>';

function finishOnboarding(pid) {
  S.onboarded = true; S.name = OB.name.trim(); S.goal = Math.min(OB.goal, 6); S.program = pid; S.exp = OB.exp; S.barbell = OB.barbell; S.starts[pid] = today(); saveS();

  $('ob').classList.add('hid'); $('app').classList.remove('hid'); $('tabbar').classList.remove('hid'); go('hoy');
}

// ═══ INIT ═══
const APP_VERSION = 'V20';
function splash() {
  if (sessionStorage.getItem('gb2_splash')) return; sessionStorage.setItem('gb2_splash', '1');
  const d = document.createElement('div'); d.className = 'splash'; d.innerHTML = '<div class="lg">' + LOGO + '</div><div class="t">GYMBRAIN</div><div class="s">BY CHADBITS</div>'; document.body.appendChild(d); setTimeout(() => d.remove(), 1800);
}

  splash();
  setTheme(S.theme || 'dark');
  $('sheetbg').addEventListener('click', closeSheet);
  document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => go(t.dataset.p)));
  if (!S.onboarded) { $('app').classList.add('hid'); $('tabbar').classList.add('hid'); $('ob').classList.remove('hid'); renderOnboarding(); return; }
  if (ACTIVE) { ACTIVE.ex.forEach(x => { if (x.presc && !x.sug) x.sug = suggest(x.id, x.presc); }); go('entreno', null, true); if (ACTIVE.restEnd && ACTIVE.restEnd > Date.now()) { restTimer = setInterval(tickRest, 500); } }
  else go('hoy');
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('./sw.js').catch(() => {});
}
document.addEventListener('DOMContentLoaded', init);
